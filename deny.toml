[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
         "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "0BSD", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2020-0036", # failure is unmaintained
    "RUSTSEC-2026-0057", "RUSTSEC-2026-0052", "RUSTSEC-2026-0059",
    "RUSTSEC-2026-0051", "RUSTSEC-2026-0060", "RUSTSEC-2026-0064",
    "RUSTSEC-2026-0050", "RUSTSEC-2026-0054", "RUSTSEC-2026-0055",
    "RUSTSEC-2026-0062", "RUSTSEC-2026-0053", "RUSTSEC-2026-0063",
    "RUSTSEC-2026-0061", "RUSTSEC-2026-0056"
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
