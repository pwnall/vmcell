[graph]
all-features = true

[licenses]
# THIS list is the authoritative permissive allow-list (AGENTS.md defers to `cargo deny` as the
# source of truth). It is a superset of the AGENTS.md prose ("MIT / Apache-2.0 / BSD / ISC / Zlib"):
# the extras — `Apache-2.0 WITH LLVM-exception`, `0BSD`, `Unicode-3.0`, `CDLA-Permissive-2.0` — are
# all OSI-permissive, non-copyleft, and safe for a linked dependency (N-BIN-1). Add a new license
# here only after confirming it is permissive; copyleft stays out (external QEMU binary excepted).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
         "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "0BSD", "Unicode-3.0", "CDLA-Permissive-2.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Machine-enforced licensing gate for the seccomp layer (design §20.6). The `[licenses]` allow-list
# above inspects each Rust crate's `license` field — it canNOT see a C library pulled in through a
# `build.rs`/`pkg-config` `-sys` crate. `libseccomp`/`libseccomp-sys`/`syscallz` have PERMISSIVE Rust
# metadata but LINK the LGPL-2.1 `libseccomp` C library, so the license gate would pass GREEN while
# the build links copyleft — the "copyleft banned for linked libraries" rule violated invisibly.
# `seccomp`/`seccomp-sys` are LGPL-2.1 outright. We ban all five by NAME so reaching for the
# ergonomic-looking wrapper reddens here; the sanctioned seccomp path is `seccompiler`
# (Apache-2.0 OR BSD-3-Clause, pure Rust, no C linkage — the lib CH/FC themselves use).
deny = [
    { name = "libseccomp", reason = "links the LGPL-2.1 libseccomp C library (invisible to the license gate); use seccompiler (§20.6)" },
    { name = "libseccomp-sys", reason = "-sys crate that links the LGPL-2.1 libseccomp C library; use seccompiler (§20.6)" },
    { name = "seccomp-sys", reason = "-sys crate that links the LGPL-2.1 libseccomp C library; use seccompiler (§20.6)" },
    { name = "seccomp", reason = "LGPL-2.1 crate + links libseccomp; use seccompiler (§20.6)" },
    { name = "syscallz", reason = "pulls seccomp-sys → the LGPL-2.1 libseccomp C library; use seccompiler (§20.6)" },
    { name = "birdcage", reason = "alternative sandbox crate (seccomp/landlock); banned by name so seccompiler stays the single sanctioned sandbox/seccomp dependency (§20.6, rubric B13)" },
    { name = "tun-tap", reason = "unmaintained; supplied ONE TUNSETIFF ioctl (now vmcell::net_sys::create_tap_in_current_netns) and dragged in the whole tokio-0.1 subtree — 14 permanent RUSTSEC ignores and 47 lockfile packages. Banned by NAME because no other gate can see the re-entry: re-adding it does not redden, it merely makes those 14 advisories live again, to be 'fixed' with 14 fresh ignores. Applies transitively too (docs/91 A1)." },
]

[advisories]
yanked = "deny"
# A dead ignore is not inert — it is a standing exemption for an exposure that no longer exists, and
# the next crate to re-enter that advisory inherits a green gate. The prose below has forbidden them
# since the 16-entry crate-less block was removed, but prose is not a gate: bare `cargo deny check`
# reports an un-encountered ignore as a WARNING and exits 0, so every stale ignore this repo has
# carried was caught by review or not at all. This makes it red. (Verified against the current tree:
# every ignore below is live.)
unused-ignored-advisory = "deny"
# Every ignore below carries: affected crate · how it enters our graph / exposure · why acceptable.
# Do NOT add a new ignore without that same three-part rationale, and NEVER add a crate-less,
# boilerplate "no fixed upstream release" placeholder — a bulk ignore that names no crate cannot be
# reviewed, hides a real exposure, and is exactly the stale pattern Part D forbids. If `cargo deny`
# surfaces a new advisory, ignore it only with its crate, exposure, and acceptance reason spelled out,
# or fix the dependency. (The previous 16-entry crate-less `RUSTSEC-2026-005x/006x` block was removed
# for this reason; re-add individually, with a real rationale, only if the gate actually reports one.)
ignore = [
    # --- Unmaintained-crate advisories: maintenance status only, no known exploitable defect ---
    "RUSTSEC-2023-0089", # atomic-polyfill 1.0.3 (transitive via embedded/no_std deps): unmaintained, superseded by portable-atomic; compile-target shim only.
    # (Removed RUSTSEC-2025-0134 / rustls-pemfile and RUSTSEC-2023-0071 / rsa: those crates left the
    #  graph when the unused `rustls-pemfile` and `pgp` deps were dropped — cargo-machete gate — so
    #  their ignores are no longer exercised. Re-add individually, with a real rationale, if they return.)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
