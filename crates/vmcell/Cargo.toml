#       (`guest_tools-12.4`) while the filename law sanitizes them, so one implementation would have
#       to be wrong for one of the two. It is what lets the tail tell "this pipeline built no
#       handler" from "this pipeline built one I was not told to bake".
#     - `proxy::doubles::hudsucker` and `proxy::doubles::hyper`: the two third-party crates
#       `doubles::Matcher` / `Responder` are `Fn` aliases over, re-exported so an out-of-repo
#       consumer names them THROUGH vmcell instead of pinning them in its own manifest at versions it
#       had to read out of this workspace's `Cargo.lock` (docs/90 E1). Two copies of one crate at
#       incompatible versions do not unify, so the old failure was a type mismatch on a name that
#       looked right — and the bump that causes it is not hypothetical (`hudsucker` has already gone
#       0.23 → 0.24 in this repo) while `cargo semver-checks` sees nothing, because the aliases'
#       SHAPE does not change across it. A doctest compiles the documented spelling.
#     - `feature::HostDeclaration::from_host_capabilities`: the §7.4 host axis DERIVED from the one
#       start-up descriptor. `HostDeclaration::probe()` keeps its signature and its answer — same two
#       modules in the same order, same "unreadable parameter reads as enabled" arm — and is a
#       projection of `HostCapabilities::probe()` now instead of a second
#       `/sys/module/*/parameters/nested` read beside it, which is what makes §7.4's "the host
#       contributes `HostCapabilities`" true (docs/90 D5). It does perform the descriptor's other
#       probes as a result; a caller already holding one passes it here rather than re-probing.
#     - `steward::StewardClient::reconnect_endpoint`: re-dial the endpoint this client is already
#       bound to, beside the existing rotating-path recovery, through one shared body so the two
#       cannot diverge on what a successful recovery resets.
#     - `vmm::FakeVmm::adopting_baked_vsock` plus the `FakeVmm::restored_vsock_path` field (free —
#       `FakeVmm` is `#[non_exhaustive]`): a fake whose `restore` re-binds the host vsock path its
#       snapshot baked instead of naming its own, which is Firecracker's shape, so the orchestrator's
#       ancestor-vmid reservation is drivable with no KVM (docs/90 M9).
#
#   * UNCHANGED, and gated so it stays that way: the emitted kernel command line is BYTE-IDENTICAL.
#     Both guest cadence tokens are composed by `vmcell_protocol::TuningToken::render` and the
#     `Timeouts` floors read that token's own `floor` (vmcell-protocol 0.7 → 0.8), retiring a pair of
#     literals this crate and `vmcell-steward` each carried with no shared const between them —
#     re-spell either and the guest fell back to a compiled cadence that happened to be the same
#     number, so nothing could go red (docs/90 G7). Same tokens, same values, same order.
#
# 0.21.0 → 0.22.0: the 2026-08-20 dependency-modernization pass. One breaking edge, and — like the
# 0.20 → 0.21 edge above — `cargo semver-checks` is BLIND to the thing that breaks: every signature
# on the contract surface is byte-identical, so the tool reports "no semver update required" and this
# entry is written by hand (§10.4; `tests/contract_ledger.rs` gates the chain this line closes).
#
#   * BREAKING, SEMVER-CHECKS-BLIND — `proxy::doubles` re-exports a DIFFERENT `hudsucker`.
#     `hudsucker` 0.24 → 0.25, so `proxy::doubles::hudsucker`, the `Matcher`/`Responder` aliases
#     built over it, and `TestDouble` all resolve to new underlying types. The alias *shapes* are
#     unchanged, which is exactly why no lint sees it — the module's own docs already named this
#     bump class as the reason the ledger entry has to be hand-written, citing the 0.23 → 0.24 move
#     the previous pass made. A consumer that names the types through the re-exports (the documented
#     spelling, compiled as a doctest) needs only to rebuild; a consumer that ALSO pins its own
#     `hudsucker` gets a hard type mismatch. That is not hypothetical either: `vmcell-bench` was such
#     a consumer inside this very workspace, and this bump broke it with "expected
#     `vmcell::proxy::doubles::hudsucker::Body`, found `hudsucker::Body`". Its own `hudsucker` and
#     `hyper` requirements were deleted rather than re-aligned, so the in-tree composition root now
#     demonstrates the documented rule instead of contradicting it.
#
#   * NOT ON THIS EDGE, deliberately — the vendored rust-vmm family. `vhost`/`vhost-user-backend`
#     stay `=0.16.0`/`=0.22.0` (with `vm-memory =0.17.1`, `virtio-queue 0.17.0`). The pass proved the
#     re-vendor onto 0.17.0/0.23.0 works and that upstream still needs the carried patch, then
#     reverted: `fuse-backend-rs` 0.14.0 (latest) pins `vm-memory = "=0.17.1"` and `virtio-queue
#     0.17`, and `fs/in_process.rs` bridges descriptor chains to it, so the set cannot move while
#     `experiment-fuse` exists. The rationale at the pin site records this; it replaced a recorded
#     reason that was a hazard rather than a blocker.
#
#   * NOT BREAKING, but a consumer-visible dependency edge: `net-privileged` no longer pulls
#     `tun-tap`, nor the `tokio 0.1` subtree behind it (47 packages leave the lock). The single
#     `TUNSETIFF` it supplied is now `vmcell::net_sys::create_tap_in_current_netns`, written against
#     `libc::ifreq`. No signature, feature NAME, or behavior on the contract surface moves — the
#     `dep:` prefix means `tun-tap` never was a public feature — so `cargo semver-checks` is silent
#     here by construction and this bullet is the only channel. It matters to exactly one kind of
#     consumer: one that was resolving `tun-tap` out of vmcell's `Cargo.lock` rather than depending
#     on it directly, which is the same anti-pattern `proxy::doubles`' module docs warn about, and
#     which now stops resolving. Such a consumer names `tun-tap` in its own manifest, or does what
#     vmcell did. The crate is `[bans]`-denied in `deny.toml`, transitively too, so it cannot return.
#     One compiler-invisible edge, named here rather than discovered: `Error::Network`'s wrapper text
#     is unchanged (`"tap create fail: {e}"`) but the INNER message is now vmcell's own, so a consumer
#     matching on `tun-tap`'s wording — `EBUSY`/`EINVAL` still render as the OS error, but a refused
#     name is now a typed `InvalidInput` naming the length rule — matches different bytes.
#
#   * UNCHANGED on the contract surface otherwise: the pins schema and its namespaces, the stage /
#     pipeline / build entry points, `pack_rootfs_with_injection` and the labelled pack surface, the
#     `VMCELL_*` env table, and the validator battery all keep their signatures and behavior. The
#     `pins.json` edits in this pass are VALUE moves inside the existing schema (kernel labels
#     `6.6.143`/`6.12.94` → `6.6.152`/`6.12.104` within the same two LTS lines, and a newly committed
#     `cloud_hypervisor: "v53.0"` scalar — a namespace that already existed and already fed the
#     snapshot cache key, closing design §17's "wired and idle" gap). A consumer overlay that named
#     the old kernel labels resolves them no longer — that is a data edge, called out here because
#     the schema gate cannot see a label rename either.
# 0.22.0 → 0.23.0: the deprecated unpaced `VirtioFsDaemon::start` shims are deleted. One breaking
# edge, and it is the edge this ledger rule was invented to carry — `cargo semver-checks` will call
# it clean, because a `0.x` minor bump is the slot pre-1.0 breakage is allowed to use, so nothing
# but this entry tells a consumer their call site is gone.
#
#   * BREAKING `inherent_method_missing` — `fs::VirtioFsDaemon::start(share, vm_tmp)` is removed,
#     under BOTH `experiment-fuse` arms. It has been `#[deprecated(since = "0.13.0")]` for ten
#     releases with the deletion condition stated in its own rustdoc ("delete it in the next
#     `vmcell` version bump"); this is that bump. MIGRATION is mechanical and mandatory rather than
#     optional, which is the point: `VirtioFsDaemon::start_paced(share, vm_tmp, &cfg.timeouts)`,
#     passing the VM's OWN `Timeouts`. A caller with no `VmConfig` in scope writes
#     `&Timeouts::default()` and gets exactly the old behavior — the shim's body was that one line —
#     but now writes it visibly. That visibility IS the change: §9.4 makes `api_socket_poll` pace
#     every daemon readiness wait, and an entry point that can only supply the default cadence
#     silently re-pinned virtiofsd's wait to it under `low_latency()` and `throughput()` (finding
#     `virtiofsd-socket-wait-hardcoded-cadence`). No in-tree caller existed to migrate: all three
#     shipped sites (CH create + restore, QEMU create) already passed `&cfg.timeouts`, and each
#     backend gates that on its own source scan.
#
#   * NEW GATE, because the deletion is not self-enforcing:
#     `fs::one_start_entry_point_gate::virtiofsd_declares_exactly_one_start_entry_point` scans this
#     module's own source and reddens if a second `pub async fn` start entry point is DECLARED
#     beside `start_paced`. The two backend call-site scans cannot see that shape — the deleted
#     shim had exactly it, declared and never called in-tree, so its mispacing was reachable only
#     by a downstream consumer and invisible to this repo. Nothing about adding a `pub async fn` is
#     a compile error and no signature semver-checks reads moves, so a scan is the only thing that
#     can go red on it.
#
#   * UNCHANGED on the contract surface: `fs::VirtioFsDaemon` is not on §10.4's listed surface at
#     all (the pins schema + overlay, the stage/pipeline/build entry points, the pack surface, the
#     `VMCELL_*` env table, the validator battery) — it is reachable public API, which is why it
#     gets a ledgered bump, not listed contract. Nothing on the listed surface moves on this edge.
#
#   * ADDITIVE, and ledgered for the reason additions are invisible: `artifact::workspace_root()` is
#     `pub` (it was `pub(crate)`). `cargo semver-checks` is SILENT by construction on an addition, so
#     nothing but this line records that the workspace-root ascent now has an out-of-crate door —
#     the same door `artifact::ch_binary_path()` has, and for the same reason. It closes design
#     §17's last open "one law, one predicate" item: `bench-vm` hand-rolled the ascent because there
#     was nothing to call, and the coupling §17 named — the `crates/vmcell-protocol/Cargo.toml`
#     marker — is now spelled in one file and scanned by
#     `scripts/ban-workspace-root-ascent-copies.sh`. Not on §10.4's LISTED surface (see the bullet
#     above for what that list is), so this is reachable public API a consumer may call, not a
#     contract entry vmcell owes them stability on beyond the usual semver of a `0.x` bump. It
#     answers "where does this checkout's workspace root sit"; downstream, where there IS no vmcell
#     checkout, the marker is never found and it falls back to the start dir — a consumer wanting a
#     stable anchor sets `$VMCELL_ARTIFACTS_DIR` (the documented §10.4 route) rather than reading
#     this.
# 0.23.0 → 0.23.1: ADDITIVE — the netns-scoped network usage type §7.1 has named as forward work
# since v17 and §17 still lists as an open gap. A PATCH edge on purpose: nothing moves, so the
# fourteen sibling manifests that pin `vmcell = "0.23.0"` (a `^0.23.0` requirement) keep resolving
# without an edit, and the whole change is reachable public API a consumer may start calling.
# `cargo semver-checks` is SILENT by construction on an addition — this entry is the only thing that
# records it.
#
#   * ADDITIVE: `net::usage`, re-exported as `net::NetUsage` / `net::NetUsageTarget`. §7.1's rule
#     stands unchanged — `ResourceUsage` still has no `net_*` fields, because cgroup v2 has no
#     network accounting and that read path holds only a cgroup name. The counters live in their own
#     type read in their own scope: one interface, inside one network namespace.
#     `NetUsageTarget::for_vm(vm.netns(), vm.segment_membership())` is the one law for *which*
#     interface carries a VM's traffic (the per-VM tap, or the member tap in a shared segment
#     netns), and `.read()` returns the counters.
#
#   * VANTAGE, and it is the part a consumer must read rather than infer: the counters are the
#     HOST-SIDE TAP's, and a tap's own `rx`/`tx` are the host kernel's vantage, INVERTED relative to
#     the guest's (`tun_get_user` — the VMM writing a guest frame in — bumps the device's *rx*).
#     `NetUsage`'s fields are therefore named from the GUEST's vantage: `guest_tx_bytes` is egress
#     and equals the tap's `rx_bytes`. The inversion happens in one private function with a unit
#     test that reddens on a swap, because a mapping read backwards produces numbers that stay
#     plausible forever.
#
#   * NO `Default`, deliberately, and this is the one place a consumer feels it: an all-zero
#     `NetUsage` is indistinguishable from a real reading of an idle VM, so §7.1 rule 3 ("an unread
#     counter reported as `0` is the same lie as a missing one") is enforced by making the unread
#     state UNREPRESENTABLE rather than by a `*_read_ok` boolean beside the numbers. A mode that
#     cannot be read is a typed `Error::CapabilityUnavailable` — the unprivileged smoltcp NAT has no
#     tap and no namespace at all — and a namespace or interface that is gone is a loud
#     `Error::Network`. There is no zeroed reading to mistake for a measurement.
#
#   * A DESIGN PREMISE CORRECTED, recorded here because §17 states the sketch as fact: §17 and §7.1
#     both describe this read as `/sys/class/net/<if>/statistics` *inside the VM netns*. That does
#     not work as written. sysfs's net view is namespace-tagged per SUPERBLOCK, fixed when the
#     filesystem was mounted, so a bare `setns(CLONE_NEWNET)` leaves the inherited `/sys` describing
#     the namespace it was mounted in — which is why `ip netns exec` unshares the mount namespace and
#     re-mounts `/sys` at all. Verified on this tree's host: inside a fresh netns holding only `lo`,
#     `ls /sys/class/net` still listed the ROOT namespace's interfaces while `ip link` listed `lo`
#     alone. The shipped read is one `RTM_GETLINK` + `IFLA_STATS64` on a netlink socket created
#     AFTER the move (a socket's namespace is fixed at `socket()` time — the documented reason
#     `net_sys::setns_net` exists), which carries the same `rtnl_link_stats64` fields sysfs renders
#     as text. `net::usage`'s `counter_reader_gate` holds both halves: the decode is spelled once,
#     and NO production site reads `/sys/class/net`.
# 0.23.1 → 0.23.2: ADDITIVE plus one BEHAVIOR change behind unchanged signatures — §6.4's two
# recorded gaps close (docs/92 Tier E, G2): snapshot-and-replay cassettes, and full MITM on the
# transparent (raw 80/443) egress path. A PATCH edge on purpose, for the reason the 0.23.0 → 0.23.1
# edge names: nothing on any signature moves, so the fourteen sibling manifests pinning
# `vmcell = "0.23.0"` (a `^0.23.0` requirement) keep resolving without an edit. `cargo semver-checks`
# is SILENT on both halves by construction — an addition, and a behavior change behind an unchanged
# signature — so this entry is the only thing that records either.
#
#   * ADDITIVE: `proxy::cassette` (the module, `CassetteOptions` / `CassetteError` / `CassetteMiss` /
#     `RecordedInteraction` / `RecordedBody` / `interaction_key` / `is_recordable_response_header`
#     and the four consts), plus `EgressProxy::record_cassette` / `replay_cassette` /
#     `cassette_misses`. A cassette records the whole INTERACTION (key → status/headers/body) and
#     replays it with no upstream at all; `EgressProxy::record_to`'s request-line log is unchanged,
#     still writes the same one-line-per-request format, and is documented as the lesser facility
#     rather than retired — a consumer parsing it is not moved.
#
#     Three rules a consumer must read rather than infer, because a cassette is a PERSISTED
#     ARTIFACT under the same no-secrets rule as a serial log. (1) It is keyed by method + canonical
#     absolute URI ONLY: no request header and no request body is persisted or matched, which is
#     both the determinism story (a nonce or a `Date` cannot make replay miss) and the secrets story
#     (`Authorization` cannot reach the file). Repeated calls under one key replay in RECORDED ORDER.
#     (2) Query parameters named in `REDACTED_QUERY_PARAMS` are dropped from the key entirely, and a
#     caller adds its own volatile names with `CassetteOptions::redacting`. (3) Response headers are
#     filtered to the `RECORDED_RESPONSE_HEADERS` allowlist (`content-type`), so `set-cookie` never
#     lands in the artifact — while the response BODY is recorded verbatim, since serving it is the
#     whole point. The one stated hole: a secret in a URI *path* is not redacted, because no general
#     rule tells a secret path segment from a resource id.
#
#     A replay MISS is a typed `CassetteError::Miss`, served to the guest as a `504` naming the key
#     and retained by `cassette_misses()`. It NEVER falls through to the real upstream: a
#     fall-through would make a green replay run evidence of nothing.
#
#   * BEHAVIOR, SEMVER-CHECKS-BLIND — the transparent intake. `EgressProxy::start` /
#     `start_transparent` keep their signatures and their listening port, but connections now reach
#     `hudsucker` through `proxy::transparent::serve_intake`, which classifies each one and recovers
#     the destination a transparently-redirected connection names NOWHERE in HTTP: the `Host` header
#     for an origin-form request, and the ClientHello's SNI for a raw TLS connection (handed on
#     behind a synthesized `CONNECT`, the explicit-proxy intake hudsucker does understand). What
#     changes for a consumer: raw 80/443 egress is now MITM'd — logged under its reconstructed
#     absolute URI, matched by doubles, and **subject to the deny list**, which before could not see
#     a host at all on that path. An explicit-proxy connection is classified on its first byte and
#     spliced through unchanged; §6.4's "the transparent path only constrains egress" no longer
#     holds, and the recorded limitation in its own text is the thing that moved.
#
#     Two boundaries stated rather than discovered: a ClientHello split across TLS records, or
#     larger than `transparent::MAX_INTAKE_PREFIX_BYTES`, is REFUSED (logged as
#     `TRANSPARENT REFUSED`, never guessed at); and a TLS intake with no SNI falls back to the
#     kernel-preserved original destination only where there is one (the privileged `TPROXY` case) —
#     under the unprivileged NAT there is nothing to fall back to and the connection is refused.
#
#   * UNCHANGED: `proxy::doubles` — the `Matcher`/`Responder` aliases, `TestDouble`, and the
#     `hudsucker`/`hyper` re-exports they are built from all resolve to the same types at the same
#     versions, so design §1.3's other extension point is untouched and its doctest compiles the
#     same spelling. `ProxyHandler` keeps its exact field set: the new stages compose AROUND it
#     (`proxy::handler::EgressHandler`) precisely because adding a field to a public all-public
#     struct is a major break, which at 0.x would have forced 0.24.0 and stranded those fourteen
#     pins.
#
#   * ADDITIVE, on the same edge and for the same reason (docs/92 Tier E, G5 — §17's "the persistent
#     port-forward bridge remains"): `steward::forward` (the module, `PortForward` / `ForwardOptions`
#     / `EndOfStream`). A host `TcpListener` that relays each accepted TCP connection into a guest
#     AF_VSOCK port, so a tool that knows nothing about vsock reaches an in-guest listener over
#     `127.0.0.1:<port>`. It is built ON `VsockDial` and changes nothing about it.
#
#     The one thing a consumer must read rather than infer: **`EndOfStream` is not a tuning knob, it
#     is the backend question**. A host half-close is not portable — Firecracker and QEMU translate
#     it into a teardown of the whole vsock connection and silently discard whatever the guest had
#     not yet flushed (the measured table on `VsockDial`) — so the default,
#     `EndOfStream::DrainThenClose`, never forwards one and bounds what follows with
#     `ForwardOptions::drain_budget` instead. Selecting `ForwardHalfClose` is selecting Cloud
#     Hypervisor or crosvm. The REVERSE direction (a guest dialling out through a host listener) is
#     deliberately not shipped: it is two different mechanisms on the two transport families, one of
#     which `VsockEndpoint` does not model.
version = "0.23.2"
edition = "2024"
# MSRV is the single workspace floor (`[workspace.package] rust-version`, in lockstep with
# rust-toolchain.toml via the `just ci` sync assertion) — currently the latest stable, 1.98.0.
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Micro-VM-per-test integration & evaluation platform for a hypothetical agentic harness"
publish = false

[lib]
name = "vmcell"
path = "src/lib.rs"

# The `vmcell` CLI binary moved to the `vmcell-cli` crate and the `bench-vm` binary to the
# `vmcell-bench` crate (design §10.1): both are composition roots that wire crates depending on
# `vmcell` (bench-vm drives all four backends, wiring `vmcell-firecracker`/`vmcell-qemu`/
# `vmcell-crosvm` alongside the in-tree Cloud Hypervisor), so
# keeping them here would form a dependency cycle. `vmcell` itself declares no binary.
[[bench]]
name = "micro"
harness = false
required-features = ["pipeline"]

# The cache-key example uses blake3 + serde_json (the pipeline/host stack).
[[example]]
name = "blake3_cache_key"
path = "examples/blake3_cache_key.rs"
required-features = ["pipeline"]

# Integration tests exercise the host stack via the `vmm_matrix_test!` harness,
# which emits per-backend test fns `#[cfg]`-gated on the backend features. They are
# gated on `cloud-hypervisor` (the primary backend, always present via `default`
# and in every `just test-*` invocation): this keeps the feature-powerset from
# compiling them under configs where the host modules are absent, AND avoids the
# dead-code that a backend-less-but-host-common config would leave (the matrix would
# emit no backend fn, so the shared `test_*_impl` helpers would be unused).
# (The `benchmark` integration test moved to the `vmcell-bench` crate alongside the `bench-vm`
# binary it drives via `assert_cmd::cargo_bin`.)
[[test]]
name = "boot"
path = "tests/boot.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "egress_proxy"
path = "tests/egress_proxy.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "exec_vsock"
path = "tests/exec_vsock.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "host_endpoint"
path = "tests/host_endpoint.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "metrics_limits"
path = "tests/metrics_limits.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "nested_virt"
path = "tests/nested_virt.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "pipeline"
path = "tests/pipeline.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "proptests"
path = "tests/proptests.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "shares_ro_rw"
path = "tests/shares_ro_rw.rs"
required-features = ["cloud-hypervisor"]

# v30 §18 delta 8: the VM-to-VM segment live battery (§6.5). Auto-joins `serial-host` via the
# workspace-glob nextest override, and `test-privileged`'s filter selects it (it is neither
# `unprivileged` nor `smoltcp`).
[[test]]
name = "segment"
path = "tests/segment.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "snapshot_restore"
path = "tests/snapshot_restore.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "zygote"
path = "tests/zygote.rs"
required-features = ["cloud-hypervisor"]

# §12.3: the jailer-equivalent hardening gate. KVM-free AND root-free (unprivileged
# no_new_privs / rlimit / seccomp), so it runs in `just test-unit`, not the privileged suite.
[[test]]
name = "jail_hardening"
path = "tests/jail_hardening.rs"
required-features = ["cloud-hypervisor"]

[dependencies]
# unconditional shared core
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
# the framed postcard wire enum, shared with the steward (v15 §10.1). The explicit
# `version` (alongside `path`) keeps the cargo-deny `wildcards = "deny"` gate happy — a bare
# path dep reads as a `*` requirement.
vmcell-protocol = { path = "../vmcell-protocol", version = "0.8.0" }

# host common
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "process", "sync", "time", "signal"] }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
nix = { version = "0.31", optional = true, features = ["mount", "sched", "process", "signal", "user", "fs"] }
uuid = { version = "1", optional = true, features = ["v4"] }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }
# Async AF_VSOCK host transport: the control-plane client dials a snapshot-eligible
# QEMU on the in-kernel `vhost-vsock-pci` device directly by CID (§2.4), where there
# is no AF_UNIX bridge. Anticipated by design §9.6. MIT; permissive transitive set.
tokio-vsock = { version = "0.7", optional = true }
libc = { version = "0.2", optional = true }
# seccompiler (rust-vmm): the pure-Rust seccomp-BPF compiler Cloud Hypervisor and Firecracker
# themselves use, for the jailer-equivalent's optional VMM-child deny-list (design §12.3, Layer 2 —
# the jailer-equivalent; §12.5 is the licensing constraint this dep choice answers).
# `Apache-2.0 OR BSD-3-Clause` — both allow-listed; NO C-library linkage (unlike the LGPL-2.1
# `libseccomp` family, banned by name in deny.toml). default-features off to skip the json frontend.
seccompiler = { version = "0.5", optional = true, default-features = false }

# CH client
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["client", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }


# Net
rtnetlink = { version = "0.23", optional = true }
netns-rs = { version = "0.2", optional = true }


# Proxy
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rcgen = { version = "0.14", optional = true, features = ["x509-parser"] }
hudsucker = { version = "0.25", optional = true }


# Pipeline
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls", "stream", "blocking"] }
sha2 = { version = "0.11", optional = true }
blake3 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
# XZ decode for the kernel-source tarball. `default-features = false` DELIBERATELY drops
# `optimization`, the one feature that enables `unsafe`: with it off the crate's own
# `#![cfg_attr(not(feature = "optimization"), forbid(unsafe_code))]` makes unsafe-freedom a
# COMPILER-ENFORCED property of the dependency rather than a promise — which is what lets a crate
# with an `unsafe`-bearing feature past this tree's unsafe rules at all. `encoder` and `lzip` are
# dropped because vmcell only ever decodes XZ. `xz` pulls `sha2` (the XZ integrity check), which
# this crate already depends on, so the swap adds no new crate to the graph.
lzma-rust2 = { version = "0.19", default-features = false, features = ["std", "xz"], optional = true }
zstd = { version = "0.13", optional = true }
reflink-copy = { version = "0.1", optional = true }
walkdir = { version = "2", optional = true }
tempfile = { version = "3", optional = true }

# (The `clap`/`anyhow` deps left with the `bench-vm` binary when it moved to the `vmcell-bench`
# crate; nothing in the `vmcell` library used them. `vmcell-cli` and `vmcell-bench` carry their own.)

# OCI
oci-client = { version = "0.17", optional = true }

# In-process virtio-fs experiment + unprivileged smoltcp NAT vhost-user backend
fuse-backend-rs = { version = "0.14.0", optional = true }
# M-VEND-3: exact `=` pins. A carried `[patch.crates-io]` (root Cargo.toml) points
# these at vendor/vhost{,-user-backend}. A caret bump (e.g. to 0.17) would silently
# drop the patch with only a "Patch was not used" warning — regressing the
# QEMU-unprivileged SET_VRING_ENABLE quirk with a green build. `=` forbids the bump;
# `scripts/check-vendored-vhost.sh` additionally asserts both resolve from the path patch.
#
# HELD BACK at 0.16.0/0.22.0/0.17.1/0.17.0 — and the 2026-08-20 dependency pass replaced the
# reason, because the one recorded here before was NOT the blocker. The old rationale was
# "bumping forks the version and silently drops the patch"; that is a hazard, not an
# obstacle — the pass re-vendored 0.17.0/0.23.0, re-applied the patch and its red-on-inverse
# test onto the new sources, and `check-vendored-vhost.sh` stayed green (it reads the pinned
# version out of the vendored manifest precisely so a pin bump is supported). Upstream was
# re-checked at the same time and still carries the unconditional PROTOCOL_FEATURES check on
# published 0.17.0/0.23.0 AND on `main`, so the patch remains load-bearing either way.
#
# THE ACTUAL BLOCKER IS `experiment-fuse`. vhost 0.17 / vhost-user-backend 0.23 both require
# vm-memory 0.18 + virtio-queue 0.18, so the four move as one set. But `fuse-backend-rs`
# 0.14.0 — latest, and the in-process virtio-fs backend behind `experiment-fuse` (design
# Appendix B #6) — requires `virtio-queue 0.17` and pins `vm-memory = "=0.17.1"` EXACTLY, and
# `fs/in_process.rs` hands a `virtio_queue::DescriptorChain` straight to that crate's
# `Reader::from_descriptor_chain`. Two virtio-queue majors cannot meet at that bridge, so the
# bump compiles under default features and fails under `--features experiment-fuse` (which
# `--all-features` and the `cargo hack` powerset both select) with "expected
# `DescriptorChain<_>`, found `DescriptorChain<...>`".
#
# The trade was judged the wrong way round: vhost 0.17's headline fix is the `SHMEM` protocol
# feature-bit position (21 → 22), and vmcell negotiates no SHMEM on any device it ships
# (vhost-user-vsock and the smoltcp vhost-user-net NAT), so the fix is inert here — while the
# cost is breaking a shipped feature. UNBLOCKS WHEN: fuse-backend-rs publishes a release built
# on vm-memory 0.18 / virtio-queue 0.18. Re-check that first; the re-vendor itself is proven.
vhost = { version = "=0.16.0", optional = true }
vhost-user-backend = { version = "=0.22.0", optional = true }
virtio-queue = { version = "0.17.0", optional = true }
vmm-sys-util = { version = "0.15.0", optional = true }
vm-memory = { version = "=0.17.1", optional = true }
virtio-bindings = { version = "0.2.7", optional = true }
smoltcp = { version = "0.14", optional = true, features = ["std", "log", "medium-ethernet", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "phy-tuntap_interface"] }
am-fs-erofs = { version = "0.1.1", optional = true }
async-trait = { version = "0.1.89", optional = true }
# Used only by the privileged tap path (`net/tap.rs`, alongside rtnetlink 0.23) and the proxy CA
# authority type (`proxy/tls.rs`); both are optional so they stay out of feature-trimmed builds.
netlink-packet-route = { version = "0.33", optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
# The integration tests reuse the extracted contract checks + boot harness from the
# validator (design §5.4/§8.5). This is a dev-dependency cycle (`vmcell(dev) →
# vmcell-artifact-validator → vmcell`), which cargo permits, so `vmcell` itself gains no
# runtime edge to the validator.
vmcell-artifact-validator = { path = "../vmcell-artifact-validator", version = "0.6.0" }
# The `vmm_matrix_test!` harness and the FC/QEMU capability/lifecycle/`qemu_*` tests construct the
# concrete backends, which now live in these crates. Same permitted dev-dependency cycle as the
# validator above (`vmcell(dev) → vmcell-firecracker/vmcell-qemu → vmcell`), so `vmcell` gains no
# production edge to them. The FC/QEMU test arms stay `#[cfg(feature = …)]`-gated, but the dev-deps
# themselves are unconditional (cargo forbids optional dev-deps).
vmcell-firecracker = { path = "../vmcell-firecracker", version = "0.1.0" }
vmcell-qemu = { path = "../vmcell-qemu", version = "0.1.0" }
vmcell-crosvm = { path = "../vmcell-crosvm", version = "0.1.0" }
# The jail gates assert the post-transition capability state the blessed runner leaves behind, so
# they name caps through the ONE crate that owns the privileged vocabulary rather than re-deriving
# `CAP_*` numbers (`libc` exports none). Dev-only: `cargo tree -e no-dev` — the lean-tree invariant
# CI asserts — does not traverse it, and `vmcell` gains no production edge.
vmcell-privilege = { path = "../vmcell-privilege", version = "0.2.0" }
criterion = { version = "0.8", features = ["html_reports"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` for the deterministic
# EXP-D shutdown-timing tests (L-ORCH-5). Test-only: dev-deps do not affect the
# production build or the feature powerset.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "test-util"] }
assert_cmd = "2"
predicates = "3"
serial_test = "4"
tempfile = "3"
tracing-test = "0.2"
proptest = "1"
env_logger = "0.11"
# The jailer-equivalent hardening gate (tests/jail_hardening.rs, §12.3) forks a stand-in and
# reads its `/proc/self/status`; it calls raw prctl/syscall/waitpid directly.
libc = "0.2"
# The §15.4 xattr battery (tests/xattr_policy.rs, §18 delta 7) synthesizes the one tar layer that
# carries PAX `SCHILY.xattr.*` records — the pinned Debian base carries none, so a `Preserve` leg
# has no input without it. Dev-only here because the production `tar` dependency above is optional
# (`am-fs-erofs`), and an integration test cannot see an optional dependency of its own crate.
# Same version requirement, so the lockfile is unmoved.
tar = "0.4"

[features]
experiment-fuse = ["fuse-backend-rs/vhost-user-fs", "dep:vhost", "dep:vhost-user-backend", "dep:virtio-queue", "dep:vmm-sys-util", "dep:vm-memory", "vm-memory/backend-mmap", "vm-memory/backend-atomic", "dep:virtio-bindings"]
default = ["cloud-hypervisor", "net-privileged", "net-unprivileged", "proxy", "metrics", "pipeline", "ext4-producer", "cli"]

# Test-only fixtures shared with the backend crates. NOT in `default`, and never a
# dependency of a shipped binary: the backend crates take it as a DEV-dependency only, so
# `cargo build -p vmcell-firecracker` compiles without it and a production reference to a
# fixture is a compile error. `scripts/ban-test-support-in-production.sh` is the backstop
# for the `--all-targets` build, where feature unification does make the fixtures visible
# to the lib target.
#
# What it exposes (see the items' own rustdoc): `metrics::FakeCgroupFs` — the in-process
# `CgroupFs` fake the four backends had each hand-rolled a `TestCgroupFs` copy of — and
# `vmm::VmmProcessGroup::already_reaped_for_test`, which fabricates the recycled-pgid state
# the per-backend M-VMM-1 gates need.
test-support = []

# Fuzz-only entry points onto predicates that stay private in every shipped configuration. NOT in
# `default`, and never a dependency of a shipped binary: the only consumer is the workspace-EXCLUDED
# `fuzz/` crate (root `Cargo.toml`'s `exclude = ["fuzz"]`), whose feature selection therefore cannot
# unify into `cargo build --workspace` / nextest / `--all-targets` the way a dev-dependency's can.
#
# `vmcell` IS a `cargo semver-checks` contract crate, so this MUST stay out of `default`: a
# non-default feature adds no default public API, so semver-checks sees nothing and no consumer's
# build can start depending on it by accident.
#
# What it exposes (see the items' own rustdoc): `proxy::doubles::fuzz_is_blocked` — the egress
# deny-list label-boundary matcher, fuzzed against the normalization/sibling-label properties;
# `artifact::tar2erofs::fuzz_node_paths` — the merged-tree key set an OCI layer produces, fuzzed for
# path confinement; `artifact::rootfs::fuzz_validate_extra_files` — the F5 injection-dest validator,
# fuzzed for the reserved/duplicate escape law (`/usr/sbin/./vmcell-steward`, `/opt/.`); and the F7
# registry chain — `artifact::fuzz_merged_pins_document` (the overlay parse + merge + legacy-shape
# reject, from TEXT, so the fuzzer does no file I/O) beside `artifact::fuzz_rootfs_registry` and
# `artifact::fuzz_handler_registry` (the two label-map kinds, kept two calls so neither kind's first
# rejection masks the other's inputs). Each is
# a thin `#[cfg(feature = "fuzzing")]` wrapper that CALLS the production predicate — never a second
# copy of its logic.
fuzzing = []

# Collapsed host stack (design §10.5 follow-up "one feature per binary"): enabling
# any host binary/backend feature (cloud-hypervisor/firecracker/qemu/cli) pulls the
# full host module set, so there are no incoherent partial host configs. The host
# modules in lib.rs are gated on `host-common`, and their bodies need the per-module
# deps below — so `host-common` MUST turn them all on together. (The per-module
# features still list `host-common` in turn; cargo permits the resulting feature
# cycle and unifies it, so any host feature yields the whole coherent stack.)
host-common = [
    "dep:tokio", "dep:futures", "dep:bytes",
    "dep:tracing", "dep:tracing-subscriber",
    "dep:nix", "dep:uuid",
    "dep:tokio-util", "dep:tokio-vsock", "dep:async-trait", "dep:libc", "dep:seccompiler",
    "net-privileged", "net-unprivileged", "proxy", "metrics", "pipeline",
    # Shared host-service deps: the HTTP-over-Unix VMM client (`vmm/mod.rs`,
    # `proxy/doubles.rs`) and JSON (VMM config/bundle) are host-common code, so
    # their deps belong here, not only on the CH/FC backend features. This is what
    # lets a qemu- or cli-only host build compile the shared client.
    "dep:serde_json", "dep:hyper", "dep:hyper-util", "dep:http-body-util",
    # Zygote copy-on-write fan-out (§8.4): the orchestrator reflink-clones a
    # suspend image (`reflink`) per clone and walks the snapshot dir tree
    # (`walkdir`). These live here, not only on `pipeline`, so the CoW-clone
    # path compiles in any host build (`pipeline` still gets them via this set).
    "dep:reflink-copy", "dep:walkdir",
]

cloud-hypervisor = ["host-common", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:serde_json"]
# `firecracker` and `qemu` no longer gate any in-tree module — those backends moved to the
# `vmcell-firecracker` / `vmcell-qemu` crates (which `vmcell` dev-depends on). The features are kept
# (dropping them would be a semver feature removal, cf. `jip-nftables`) as aliases of `host-common`
# so the integration-test legs `#[cfg(feature = "firecracker"/"qemu")]` still compile the FC/QEMU
# matrix arms and CI's `--features firecracker,qemu` invocation keeps selecting them.
firecracker = ["host-common"]
qemu = ["host-common"]
# Same alias as firecracker/qemu: the `crosvm` backend lives in the `vmcell-crosvm` crate (which
# `vmcell` dev-depends on), so this feature gates no in-tree module — it only compiles the
# `#[cfg(feature = "crosvm")]` matrix/honesty test arms and lets CI's `--features …,crosvm`
# invocation select them.
crosvm = ["host-common"]

net-privileged = ["host-common", "dep:rtnetlink", "dep:netns-rs", "dep:netlink-packet-route"]
experiment-nftables = ["net-privileged", "jip-nftables"]
# Vestigial placeholder feature (never referenced by any `#[cfg(feature = ...)]`). Its optional
# `jip-nftables` dep was removed as unused (cargo-machete verified; its lib `nftables_netlink` is
# absent from the source). Kept as an empty feature so the public feature set is unchanged — dropping
# it outright is a semver-breaking feature removal (cargo-semver-checks) even on this publish=false crate.
jip-nftables = []
net-unprivileged = ["host-common", "dep:smoltcp", "dep:vhost", "dep:vhost-user-backend", "dep:virtio-queue", "dep:vmm-sys-util", "dep:vm-memory", "vm-memory/backend-mmap", "vm-memory/backend-atomic", "dep:virtio-bindings"]

proxy = ["host-common", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:hudsucker", "dep:http"]
proxy-hudsucker = ["proxy"]

metrics = ["host-common"]

pipeline = [
    "host-common",
    "dep:reqwest", "dep:sha2", "dep:blake3",
    "dep:tar", "dep:flate2", "dep:lzma-rust2", "dep:zstd",
    # `reflink-copy`/`walkdir` are declared on `host-common` (zygote CoW fan-out,
    # §8.4); `pipeline` inherits them through `host-common` above.
    "dep:tempfile",
    "am-fs-erofs", "dep:oci-client",
]

# Retained (dependents `vmcell-cli`/`vmcell-daemon`/`vmcell-bench` still name `vmcell/cli`, and
# dropping a feature is a semver break, cf. `jip-nftables`) but now only ensures the shared host
# JSON stack — the `bench-vm` binary that needed clap/anyhow moved to the `vmcell-bench` crate.
cli = ["host-common", "dep:serde_json"]

fuse-backend-rs = ["dep:fuse-backend-rs"]
vhost = ["dep:vhost"]
vhost-user-backend = ["dep:vhost-user-backend"]
virtio-queue = ["dep:virtio-queue"]
vmm-sys-util = ["dep:vmm-sys-util"]
vm-memory = ["dep:vm-memory"]
virtio-bindings = ["dep:virtio-bindings"]
am-fs-erofs = ["dep:am-fs-erofs"]

# §4.7's ext4 rootfs producer (§18 delta 8) — the second emitter behind the one pack tail.
#
# Named for the CAPABILITY, not for a crate, and that breaks this manifest's otherwise-unbroken
# convention on purpose. Every other library feature here (`am-fs-erofs`, `vhost`, `virtio-queue`,
# …) turns on the crate it is named after; this one turns on no crate at all, because the shipped
# route spawns `mkfs.ext4` (a GPL-2 binary, never linked — the QEMU/nft carve-out shape). Naming it
# after the crate it *might* one day use would be a name that is false today, and **dropping a
# feature is a semver break on this crate** (cf. `jip-nftables`), so the name is chosen once and
# permanently. Under this name, graduating from the external tool to a pure-Rust writer is a
# `dep:` line added inside the stanza — an implementation swap, exactly as §4.7 requires — rather
# than a feature rename nobody can take back.
#
# It gates NO dependency (the producer uses `std::process` plus the `tar` that `pipeline` already
# pulls), so turning it off shrinks no tree. What it does is make "this build cannot produce ext4"
# expressible and TYPED: the off arm returns `Error::CapabilityUnavailable`, never a silent pack in
# the default format.
#
# In `default` and deliberately NOT inside `pipeline`, even though `pipeline` is what it needs to be
# useful. A feature `pipeline` implied could never be OFF in any configuration cargo can build, so
# its refusal arm would be unreachable code nobody has ever compiled — and the `cargo hack
# --feature-powerset` job is exactly what compiles `pipeline` without it and proves the arm is real.
ext4-producer = []

[package.metadata.cargo-machete]
# False positive: the library name is `fs_erofs` (not `am_fs_erofs`), used in
# src/artifact/tar2erofs.rs — cargo-machete's name heuristic misses the rename.
ignored = ["am-fs-erofs"]
