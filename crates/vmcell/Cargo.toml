[package]
name = "vmcell"
# 0.2 → 0.3: intentional breaking change — `AgentClient::connect`/`reconnect` gained a
# `&Timeouts` param (per-VM tunable connect cadence, design 44 §3). A 0.x minor bump is
# the SemVer slot for a breaking change on a pre-1.0 crate (cargo-semver-checks gate).
# 0.3 → 0.4: intentional breaking change — `AgentClient::resync` (and the `GuestResync`
# seam) gained an `ipv4: Option<Ipv4Reconfig>` param for H-VMM-1 guest-IP rotation on
# restore, and `AgentClient::reconnect`'s params were reordered to match `connect`
# (N-GUEST-3). `ResyncOutcome` gained `ip_applied` (additive, `#[non_exhaustive]`).
# 0.4 → 0.5: intentional breaking change (design §5.4/§8.5) — the in-VM builders were
# extracted to the `vmcell-rootfs-builder` / `vmcell-kernel-builder` crates. `RootfsStage`
# dropped its `source: RootfsBuildSource` and `cid_alloc` fields (now OCI-only; the enum
# `RootfsBuildSource` was removed), and `PrebuiltKernelStage` + `resolve_builder_base`
# became `pub` for the builder crates. The CLI moved to the `vmcell-cli` crate.
# 0.5 → 0.6: one configurable `resource_prefix` for per-VM naming + the sweep (v21 §18.4.1).
# 0.6 → 0.7: additive privileged-window hardening (design §20) — `VmConfig` gained
# `vmm_seccomp: VmmSeccomp` and `jail: JailConfig`, plus the `vmm::seccomp` / `vmm::jail`
# modules and a `JailSpec` param on `build_vmm_cmd`. Additive to the config surface
# (`#[non_exhaustive]`); the `build_vmm_cmd` signature change is a minor pre-1.0 bump.
# 0.7 → 0.8: the OverlayStore seam + fork/branch lineage (design §21) — new `overlay`
# (`OverlayStore`, `ReflinkOverlayStore`) and `lineage` (`Lineage`, `LineageId`,
# `LineageAllocator`) modules; `MicroVm::restore_cow` gained a final
# `Arc<dyn OverlayStore>` seam param (the one breaking change, a minor pre-1.0 bump);
# `Zygote` gained `with_overlay_store`.
# 0.11.0: the Firecracker and QEMU backends were extracted into the `vmcell-firecracker` and
# `vmcell-qemu` crates, so the `Firecracker`/`Qemu` re-exports left the public API (a breaking
# change under the pre-1.0 minor-bump convention).
# 0.11.0 → 0.12.0: adding the crosvm backend (`vmcell-crosvm`) surfaced a per-backend divergence —
# crosvm has no disk I/O rate limiter — so `VmmCapabilities` gained a `disk_io_throttle` field. That
# is a breaking change to an externally-constructible (exhaustive) struct (cargo-semver-checks
# `constructible_struct_adds_field`), hence the pre-1.0 minor bump.
# 0.12.0 → 0.13.0: the design v30 §18 downstream-platform pass (deltas 1–9), one breaking release.
# Every edge below is deliberate and named here so a consumer reads it in the ledger instead of
# discovering it when their build breaks (§10.4, the downstream toolkit contract):
#   * `constructible_struct_adds_field` (exhaustive structs, the intended compile-time fail-loud):
#     `ResolvePinsStage.overlay_file` (delta 1), `RootfsStage.extra` (delta 6),
#     `PerVmResources.segment` (delta 8), `VmmCapabilities.usb_host_passthrough` (delta 9).
#   * `struct_pub_field_missing`: `ResolvePinsStage.pins_file` is GONE (delta 1) — the pins baseline
#     is now the compile-time-embedded `pins.json`, so a caller-supplied baseline path would be a
#     second source of truth with no stated precedence. `overlay_file` is what a caller sets now.
#   * `function_parameter_count_changed`: `pack_erofs_with_injection`, `tar2erofs::tar_to_erofs`,
#     `oci::build_rootfs` and `fold_rootfs_injection_identity` each gained the `extra: &[ExtraFile]`
#     downstream-injection slot (delta 6; existing callers pass `&[]`); `sweep_orphans` gained
#     `live_segids` (delta 8 — a segment netns must be liveness-checked against its OWN id space,
#     never against live vmids). `build_kernel_cmdline` keeps its arity but now takes `&PerVmResources`
#     instead of a bare `vmid`, because the segment `ip=` token is derived from the membership.
#   * `enum_no_repr_variant_discriminant_changed`: `NetConfig::None` moved 2 → 3 as `Segment` was
#     inserted (delta 8). `NetConfig` is `#[non_exhaustive]`, so this only bites code that relies on
#     discriminant VALUES (a transmute or an `as` cast), never a match.
#   * `trait_method_added`: `Netlink` gained `create_bridge` / `setup_tap_on_bridge` / `delete_link`
#     (delta 8). Out-of-tree implementors of that seam must add the three methods.
#   * `auto_trait_impl_removed`: `VmConfig`, `Zygote` and `Lineage` are no longer `UnwindSafe` /
#     `RefUnwindSafe`, because `NetConfig::Segment` carries the `Arc<Mutex<…>>`-backed segment
#     handle. Only `catch_unwind` callers holding those types across the boundary are affected.
#   * ADDITIVE (no breakage, ledgered so a consumer reads it here): the crate-root re-export set
#     gained `RootfsSource`, `Egress` and `UsbHostDevice` (docs/78 §9.4). They were reachable only
#     as `vmcell::config::…` while the leaf types they are passed alongside were root-re-exported,
#     so `use vmcell::{VmConfig, NetConfig}` could not actually call the builder. A re-export
#     addition is minor-compatible; `lib.rs`'s `root_reexport_tests` is the gate.
#   * ADDITIVE: the `vmcell::vmm::usb` module — `claim_usb_host_devices`, `UsbHostClaim`,
#     `UsbInterfaceBinding`, `ResolvedUsbDevice`. `usb_host_passthrough` is a capability, so the
#     backend owns only its own argv and everything unified (resolve the `vid:pid`, prove the usbfs
#     node openable, record the host interface→driver map before the spawn, re-bind it after the
#     VMM is reaped) is shared here. A backend crate gaining the capability calls
#     `claim_usb_host_devices` at create and `UsbHostClaim::restore` after its reap; there is no
#     second copy to write. Gated by `vmm::usb`'s unit tests plus the live `usb_passthrough_qemu`.
# The `vmcell-artifact-validator` half of the contract surface is additive in this pass
# (`cargo semver-checks -p vmcell-artifact-validator`: no update required).
# 0.13.0 → 0.14.0: the docs/81 review pass, one breaking release. `cargo semver-checks
# check-release -p vmcell --baseline-rev main` reports exactly the first two edges below and nothing
# else; the third BREAKING edge and all three BEHAVIOR-ONLY ones are structurally invisible to it
# (it has no return-type lint, and no lint of any kind sees behavior behind an unchanged signature).
# That is precisely why they are ledgered by hand: a consumer reads them here instead of discovering
# them at run time (§10.4, the downstream toolkit contract).
#   * BREAKING `function_parameter_count_changed`: `vmm::register_and_await_ready` drops its
#     `timeout_ms` parameter (6 → 5). The VMM control-socket readiness ceiling is now the one
#     `vmm::VMM_SOCKET_READY_TIMEOUT_MS`, so no backend can spell it as a literal again (it was six
#     inline `1000`s). Callers delete the argument. There is deliberately no way to pass a different
#     ceiling; the genuinely per-VM half, `interval_ms`, is still a parameter.
#   * BREAKING `method_parameter_count_changed`: `net::SmoltcpProcess::start` gained a fifth
#     parameter, `egress: net::smoltcp::backend::NatEgressPolicy`. The unprivileged NAT opened
#     outbound host connections on the guest's behalf regardless of the config's `Egress`, so
#     `Egress::Blocked` — which promises "all egress traffic is blocked" — blocked nothing on that
#     datapath. The policy now travels into the NAT instead of being assumed. A caller reproducing
#     the pre-0.14 behavior passes `NatEgressPolicy::Allow`; `Blocked` maps to `Deny`.
#   * BREAKING, and SEMVER-CHECKS-BLIND (there is no return-type lint):
#     `net::tap::Netlink::setup_tap` returns `Result<()>`, not `Result<Option<tun_tap::Iface>>`. The
#     old return was always `Ok(None)` and read by nobody, while forcing every out-of-tree
#     implementor of this ledgered seam to depend on `tun-tap` — which `vmcell` does not re-export,
#     so the pin had to be guessed — and teaching them to hold the tap fd open, the one thing that
#     breaks the single-opener discipline (a non-multi-queue tap admits one opener and the VMM must
#     be it; the tap is `TUNSETPERSIST`'d and our fd dropped). Implementors return `Ok(())`; callers
#     drop the discarded binding. `vmcell-broker`, whose `Netlink` fake now compiles with no
#     `tun-tap` dependency at all, is the living gate against re-introducing the type.
#   * BEHAVIOR-ONLY — no signature moved, so nothing mechanical will warn a consumer:
#     - `VmConfigBuilder::build` REJECTS `NetConfig::Unprivileged { egress: Egress::Blocked,
#       host_services_port: Some(_) }` with `Error::Config` naming both fields (F1). The port was
#       accepted and silently unused, because `Egress::Blocked` registers no NAT forward. A caller
#       that paired them drops the port or moves to `Egress::Open`/`Egress::Filtered`. `VmConfig`'s
#       fields stay public, so assigning `cfg.net` directly still bypasses the check.
#     - `Zygote::suspend` is create-only. It creates `master_dir` (and any missing parents) when
#       absent, accepts an existing but EMPTY directory, and refuses a populated one with
#       `Error::Io` / `ErrorKind::AlreadyExists`. It previously wrote into whatever was already
#       there, and a snapshot image written file-by-file over another leaves a torn mix of two
#       lineages — a clone restored from it is neither. `Lineage::fork_from_vm` and `Lineage::branch`
#       delegate, so they inherit both halves; the daemon's equivalent path already refused this.
#     - The privileged egress rulesets no longer emit `log prefix "vmcell-drop: "` on the catch-all
#       drop rule. netfilter discards the syslog LOG target in a non-init netns, so the prefix
#       promised a diagnostic the kernel threw away: a consumer grepping host logs for `vmcell-drop`
#       matched nothing before this release and matches nothing after it, but should stop expecting
#       to. `net::tap::NetNamespace::render_blocked_rules` is the readable form of what is emitted.
#   * ADDITIVE (ledgered so a consumer reads them here; none of them require action):
#     - `vmm::VMM_SOCKET_READY_TIMEOUT_MS` and `vmm::wait_for_vmm_socket` — the same ceiling, with no
#       ceiling argument to get wrong. `vmm::reject_unadvertised_capabilities` — the one
#       nested-virt/lazy-restore refusal, hoisted out of three byte-identical backend copies, whose
#       typed-refusal feature string equals the `VmmCapabilities` field name.
#       `vmm::snapshot_request_timeout` — the guest-RAM-proportional snapshot-RPC budget every
#       backend now sizes from, instead of the flat control ceiling a multi-GiB guest overruns by
#       construction. `vmm::unix_api_request_with` — the Unix-socket HTTP helper on a caller-supplied
#       budget. `vmm::VmmProcessGroup` — the VMM leader's pgid and its one-shot reaped flag owned
#       together (L1), with the pgid PRIVATE and no accessor, so no code outside `vmm` can construct
#       `-pgid` for a group the kernel may have recycled.
#     - `metrics::vm_slice_name`, re-exported as `naming::vm_slice_name`: the §13 sibling-placed
#       slice path, which four call sites (including this workspace's `vmcell-artifact-validator` and
#       `vmcell-broker`) had each hand-formatted as a `vmcell-vm-<vmid>` literal that is wrong for
#       any non-default `resource_prefix`.
#     - `artifact::kernel::kernel_pin_key` / `kernel_artifact_key`: the flattened pins key
#       (`kernel_source_url` / `kernel_<label>_source_url`) and the artifact-map key (`kernel` /
#       `kernel-<label>`), previously composed inline in the pins flattener and byte-duplicated in
#       `vmcell-kernel-builder` and `vmcell-cli`. Exporting them is what lets a downstream kernel
#       builder CALL the flattener's spelling instead of re-deriving it. Output is byte-identical to
#       the pre-consolidation spellings, so no cache key, pin key or artifact key moves (F4).
#     - `artifact::oci_cache_dir`; `net::smoltcp::backend::NatEgressPolicy`;
#       `net::tap::NetNamespace::render_blocked_rules` and `emit_blocked_rules`;
#       `proxy::tls::CaManager::ca_cert_path`; `lineage::Lineage::probe_cow_support_in`.
#     - The non-default `test-support` feature (see its stanza below), which additionally exposes
#       `metrics::FakeCgroupFs` and `vmm::VmmProcessGroup::already_reaped_for_test`. It is not in
#       `default`, so it changes nothing for a consumer that does not ask for it.
#     - The non-default `fuzzing` feature (see its stanza below), which exposes three thin
#       fuzz-only entry points onto predicates that are otherwise private — the egress deny-list
#       matcher (`proxy::doubles::fuzz_is_blocked`), the tar-layer merged-tree key set
#       (`artifact::tar2erofs::fuzz_node_paths`) and the F5 injection-dest validator
#       (`artifact::rootfs::fuzz_validate_extra_files`) — so the nightly `cargo fuzz` job can drive
#       each against a property rather than a bare no-panic check. Not in `default`, so
#       `cargo semver-checks` (which runs on default features) sees nothing and a consumer that does
#       not ask for it is unaffected.
# 0.14.0 → 0.15.0: design v33 §18 delta 1 — the steward rename, landed first and alone. The in-guest
# control-plane process was `vmcell-guest-agent`; it is `vmcell-steward` now. vmcell explicitly
# serves AGENTIC EXECUTION as a domain, so "the agent" was about to mean two different things in
# every consumer's prose; the window to fix that closes as consumers accumulate. This is a pure
# vocabulary pass — no behavior, no wire format, and no cache key moves — so the whole migration is
# a `sed` over this identifier list:
#   AgentClient            → StewardClient
#   MicroVm::agent()       → MicroVm::steward()
#   vmcell::agent (module) → vmcell::steward   (incl. `agent::session` → `steward::session`)
#   Error::Agent           → Error::Steward
#   GuestAgentStage        → StewardStage
#   AGENT_VSOCK_PORT       → STEWARD_VSOCK_PORT
#   crate vmcell-guest-agent → vmcell-steward  (lib `vmcell_guest_agent` → `vmcell_steward`)
#   /usr/sbin/vmcell-guest-agent → /usr/sbin/vmcell-steward   (DEFAULT_INIT)
#   --agent-musl           → --steward-musl    (vmcell-cli)
#   guest_agent_src_hash / guest_agent_closure_hash → steward_src_hash / steward_closure_hash
# Every one of those is `cargo semver-checks`-visible as a removal-plus-addition, hence the pre-1.0
# minor bump. The retired identifiers are now flagged by `scripts/ban-legacy-terms.sh` (one MUST-flag
# fixture per pattern, each verified to redden on deleting its scanner branch), so a re-introduction
# fails CI. The ban is IDENTIFIER-shaped, never the bare word "agent": the agentic-execution domain
# text, `AGENTS.md`, historical finding IDs (`AGENT-2`), Kata's `agent-ctl`, and HTTP's
# `User-Agent`/`Proxy-Agent` all legitimately keep it.
#   Ledger fidelity note: the 0.3 and 0.4 entries above still say `AgentClient`, deliberately. They
#   record what a consumer saw AT those versions; rewriting them would make them false. This entry
#   is the one place the old→new mapping lives.
version = "0.15.0"
edition = "2024"
# MSRV is the single workspace floor (`[workspace.package] rust-version`, in lockstep with
# rust-toolchain.toml via the `just ci` sync assertion) — currently the latest stable, 1.96.1.
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Micro-VM-per-test integration & evaluation platform for a hypothetical agentic harness"
publish = false

[lib]
name = "vmcell"
path = "src/lib.rs"

# The `vmcell` CLI binary moved to the `vmcell-cli` crate and the `bench-vm` binary to the
# `vmcell-bench` crate (design §10.1): both are composition roots that wire crates depending on
# `vmcell` (bench-vm drives all four backends, wiring `vmcell-firecracker`/`vmcell-qemu`/
# `vmcell-crosvm` alongside the in-tree Cloud Hypervisor), so
# keeping them here would form a dependency cycle. `vmcell` itself declares no binary.
[[bench]]
name = "micro"
harness = false
required-features = ["pipeline"]

# The cache-key example uses blake3 + serde_json (the pipeline/host stack).
[[example]]
name = "blake3_cache_key"
path = "examples/blake3_cache_key.rs"
required-features = ["pipeline"]

# Integration tests exercise the host stack via the `vmm_matrix_test!` harness,
# which emits per-backend test fns `#[cfg]`-gated on the backend features. They are
# gated on `cloud-hypervisor` (the primary backend, always present via `default`
# and in every `just test-*` invocation): this keeps the feature-powerset from
# compiling them under configs where the host modules are absent, AND avoids the
# dead-code that a backend-less-but-host-common config would leave (the matrix would
# emit no backend fn, so the shared `test_*_impl` helpers would be unused).
# (The `benchmark` integration test moved to the `vmcell-bench` crate alongside the `bench-vm`
# binary it drives via `assert_cmd::cargo_bin`.)
[[test]]
name = "boot"
path = "tests/boot.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "egress_proxy"
path = "tests/egress_proxy.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "exec_vsock"
path = "tests/exec_vsock.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "host_endpoint"
path = "tests/host_endpoint.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "metrics_limits"
path = "tests/metrics_limits.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "nested_virt"
path = "tests/nested_virt.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "pipeline"
path = "tests/pipeline.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "proptests"
path = "tests/proptests.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "shares_ro_rw"
path = "tests/shares_ro_rw.rs"
required-features = ["cloud-hypervisor"]

# v30 §18 delta 8: the VM-to-VM segment live battery (§6.5). Auto-joins `serial-host` via the
# workspace-glob nextest override, and `test-privileged`'s filter selects it (it is neither
# `unprivileged` nor `smoltcp`).
[[test]]
name = "segment"
path = "tests/segment.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "snapshot_restore"
path = "tests/snapshot_restore.rs"
required-features = ["cloud-hypervisor"]

[[test]]
name = "zygote"
path = "tests/zygote.rs"
required-features = ["cloud-hypervisor"]

# §20.4: the jailer-equivalent hardening gate. KVM-free AND root-free (unprivileged
# no_new_privs / rlimit / seccomp), so it runs in `just test-unit`, not the privileged suite.
[[test]]
name = "jail_hardening"
path = "tests/jail_hardening.rs"
required-features = ["cloud-hypervisor"]

[dependencies]
# unconditional shared core
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
# the framed postcard wire enum, shared with the steward (v15 §10.1). The explicit
# `version` (alongside `path`) keeps the cargo-deny `wildcards = "deny"` gate happy — a bare
# path dep reads as a `*` requirement.
vmcell-protocol = { path = "../vmcell-protocol", version = "0.5.0" }

# host common
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "process", "sync", "time", "signal"] }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
nix = { version = "0.31", optional = true, features = ["mount", "sched", "process", "signal", "user", "fs"] }
uuid = { version = "1", optional = true, features = ["v4"] }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }
# Async AF_VSOCK host transport: the control-plane client dials a snapshot-eligible
# QEMU on the in-kernel `vhost-vsock-pci` device directly by CID (§2.4), where there
# is no AF_UNIX bridge. Anticipated by design §9.6. MIT; permissive transitive set.
tokio-vsock = { version = "0.7", optional = true }
libc = { version = "0.2", optional = true }
# seccompiler (rust-vmm): the pure-Rust seccomp-BPF compiler Cloud Hypervisor and Firecracker
# themselves use, for the jailer-equivalent's optional VMM-child deny-list (design §20.4/§20.6).
# `Apache-2.0 OR BSD-3-Clause` — both allow-listed; NO C-library linkage (unlike the LGPL-2.1
# `libseccomp` family, banned by name in deny.toml). default-features off to skip the json frontend.
seccompiler = { version = "0.5", optional = true, default-features = false }

# CH client
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["client", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }


# Net
rtnetlink = { version = "0.21", optional = true }
netns-rs = { version = "0.2", optional = true }
tun-tap = { version = "0.1", optional = true }


# Proxy
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rcgen = { version = "0.14", optional = true, features = ["x509-parser"] }
hudsucker = { version = "0.24", optional = true }


# Pipeline
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls", "stream", "blocking"] }
sha2 = { version = "0.11", optional = true }
blake3 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
lzma-rs = { version = "0.3", optional = true }
zstd = { version = "0.13", optional = true }
reflink-copy = { version = "0.1", optional = true }
walkdir = { version = "2", optional = true }
tempfile = { version = "3", optional = true }

# (The `clap`/`anyhow` deps left with the `bench-vm` binary when it moved to the `vmcell-bench`
# crate; nothing in the `vmcell` library used them. `vmcell-cli` and `vmcell-bench` carry their own.)

# OCI
oci-client = { version = "0.17", optional = true }

# In-process virtio-fs experiment + unprivileged smoltcp NAT vhost-user backend
fuse-backend-rs = { version = "0.14.0", optional = true }
# M-VEND-3: exact `=` pins. A carried `[patch.crates-io]` (root Cargo.toml) points
# these at vendor/vhost{,-user-backend}. A caret bump (e.g. to 0.17) would silently
# drop the patch with only a "Patch was not used" warning — regressing the
# QEMU-unprivileged SET_VRING_ENABLE quirk with a green build. `=` forbids the bump;
# the `ci` recipe additionally asserts both resolve from the path patch.
vhost = { version = "=0.16.0", optional = true }
vhost-user-backend = { version = "=0.22.0", optional = true }
virtio-queue = { version = "0.17.0", optional = true }
vmm-sys-util = { version = "0.15.0", optional = true }
vm-memory = { version = "=0.17.1", optional = true }
virtio-bindings = { version = "0.2.7", optional = true }
smoltcp = { version = "0.13.1", optional = true, features = ["std", "log", "medium-ethernet", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "phy-tuntap_interface"] }
am-fs-erofs = { version = "0.1.1", optional = true }
async-trait = { version = "0.1.89", optional = true }
# Used only by the privileged tap path (`net/tap.rs`, alongside rtnetlink 0.21) and the proxy CA
# authority type (`proxy/tls.rs`); both are optional so they stay out of feature-trimmed builds.
netlink-packet-route = { version = "0.30", optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
# The integration tests reuse the extracted contract checks + boot harness from the
# validator (design §5.4/§8.5). This is a dev-dependency cycle (`vmcell(dev) →
# vmcell-artifact-validator → vmcell`), which cargo permits, so `vmcell` itself gains no
# runtime edge to the validator.
vmcell-artifact-validator = { path = "../vmcell-artifact-validator", version = "0.3.0" }
# The `vmm_matrix_test!` harness and the FC/QEMU capability/lifecycle/`qemu_*` tests construct the
# concrete backends, which now live in these crates. Same permitted dev-dependency cycle as the
# validator above (`vmcell(dev) → vmcell-firecracker/vmcell-qemu → vmcell`), so `vmcell` gains no
# production edge to them. The FC/QEMU test arms stay `#[cfg(feature = …)]`-gated, but the dev-deps
# themselves are unconditional (cargo forbids optional dev-deps).
vmcell-firecracker = { path = "../vmcell-firecracker", version = "0.1.0" }
vmcell-qemu = { path = "../vmcell-qemu", version = "0.1.0" }
vmcell-crosvm = { path = "../vmcell-crosvm", version = "0.1.0" }
# The jail gates assert the post-transition capability state the blessed runner leaves behind, so
# they name caps through the ONE crate that owns the privileged vocabulary rather than re-deriving
# `CAP_*` numbers (`libc` exports none). Dev-only: `cargo tree -e no-dev` — the lean-tree invariant
# CI asserts — does not traverse it, and `vmcell` gains no production edge.
vmcell-privilege = { path = "../vmcell-privilege", version = "0.2.0" }
criterion = { version = "0.8", features = ["html_reports"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` for the deterministic
# EXP-D shutdown-timing tests (L-ORCH-5). Test-only: dev-deps do not affect the
# production build or the feature powerset.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "test-util"] }
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"
tracing-test = "0.2"
proptest = "1"
env_logger = "0.11"
# The jailer-equivalent hardening gate (tests/jail_hardening.rs, §20.4) forks a stand-in and
# reads its `/proc/self/status`; it calls raw prctl/syscall/waitpid directly.
libc = "0.2"

[features]
experiment-fuse = ["fuse-backend-rs/vhost-user-fs", "dep:vhost", "dep:vhost-user-backend", "dep:virtio-queue", "dep:vmm-sys-util", "dep:vm-memory", "vm-memory/backend-mmap", "vm-memory/backend-atomic", "dep:virtio-bindings"]
default = ["cloud-hypervisor", "net-privileged", "net-unprivileged", "proxy", "metrics", "pipeline", "cli"]

# Test-only fixtures shared with the backend crates. NOT in `default`, and never a
# dependency of a shipped binary: the backend crates take it as a DEV-dependency only, so
# `cargo build -p vmcell-firecracker` compiles without it and a production reference to a
# fixture is a compile error. `scripts/ban-test-support-in-production.sh` is the backstop
# for the `--all-targets` build, where feature unification does make the fixtures visible
# to the lib target.
#
# What it exposes (see the items' own rustdoc): `metrics::FakeCgroupFs` — the in-process
# `CgroupFs` fake the four backends had each hand-rolled a `TestCgroupFs` copy of — and
# `vmm::VmmProcessGroup::already_reaped_for_test`, which fabricates the recycled-pgid state
# the per-backend M-VMM-1 gates need.
test-support = []

# Fuzz-only entry points onto predicates that stay private in every shipped configuration. NOT in
# `default`, and never a dependency of a shipped binary: the only consumer is the workspace-EXCLUDED
# `fuzz/` crate (root `Cargo.toml`'s `exclude = ["fuzz"]`), whose feature selection therefore cannot
# unify into `cargo build --workspace` / nextest / `--all-targets` the way a dev-dependency's can.
#
# `vmcell` IS a `cargo semver-checks` contract crate, so this MUST stay out of `default`: a
# non-default feature adds no default public API, so semver-checks sees nothing and no consumer's
# build can start depending on it by accident.
#
# What it exposes (see the items' own rustdoc): `proxy::doubles::fuzz_is_blocked` — the egress
# deny-list label-boundary matcher, fuzzed against the normalization/sibling-label properties;
# `artifact::tar2erofs::fuzz_node_paths` — the merged-tree key set an OCI layer produces, fuzzed for
# path confinement; `artifact::rootfs::fuzz_validate_extra_files` — the F5 injection-dest validator,
# fuzzed for the reserved/duplicate escape law (`/usr/sbin/./vmcell-steward`, `/opt/.`). Each is
# a thin `#[cfg(feature = "fuzzing")]` wrapper that CALLS the production predicate — never a second
# copy of its logic.
fuzzing = []

# Collapsed host stack (design §10.5 follow-up "one feature per binary"): enabling
# any host binary/backend feature (cloud-hypervisor/firecracker/qemu/cli) pulls the
# full host module set, so there are no incoherent partial host configs. The host
# modules in lib.rs are gated on `host-common`, and their bodies need the per-module
# deps below — so `host-common` MUST turn them all on together. (The per-module
# features still list `host-common` in turn; cargo permits the resulting feature
# cycle and unifies it, so any host feature yields the whole coherent stack.)
host-common = [
    "dep:tokio", "dep:futures", "dep:bytes",
    "dep:tracing", "dep:tracing-subscriber",
    "dep:nix", "dep:uuid",
    "dep:tokio-util", "dep:tokio-vsock", "dep:async-trait", "dep:libc", "dep:seccompiler",
    "net-privileged", "net-unprivileged", "proxy", "metrics", "pipeline",
    # Shared host-service deps: the HTTP-over-Unix VMM client (`vmm/mod.rs`,
    # `proxy/doubles.rs`) and JSON (VMM config/bundle) are host-common code, so
    # their deps belong here, not only on the CH/FC backend features. This is what
    # lets a qemu- or cli-only host build compile the shared client.
    "dep:serde_json", "dep:hyper", "dep:hyper-util", "dep:http-body-util",
    # Zygote copy-on-write fan-out (§9.4): the orchestrator reflink-clones a
    # suspend image (`reflink`) per clone and walks the snapshot dir tree
    # (`walkdir`). These live here, not only on `pipeline`, so the CoW-clone
    # path compiles in any host build (`pipeline` still gets them via this set).
    "dep:reflink-copy", "dep:walkdir",
]

cloud-hypervisor = ["host-common", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:serde_json"]
# `firecracker` and `qemu` no longer gate any in-tree module — those backends moved to the
# `vmcell-firecracker` / `vmcell-qemu` crates (which `vmcell` dev-depends on). The features are kept
# (dropping them would be a semver feature removal, cf. `jip-nftables`) as aliases of `host-common`
# so the integration-test legs `#[cfg(feature = "firecracker"/"qemu")]` still compile the FC/QEMU
# matrix arms and CI's `--features firecracker,qemu` invocation keeps selecting them.
firecracker = ["host-common"]
qemu = ["host-common"]
# Same alias as firecracker/qemu: the `crosvm` backend lives in the `vmcell-crosvm` crate (which
# `vmcell` dev-depends on), so this feature gates no in-tree module — it only compiles the
# `#[cfg(feature = "crosvm")]` matrix/honesty test arms and lets CI's `--features …,crosvm`
# invocation select them.
crosvm = ["host-common"]

net-privileged = ["host-common", "dep:rtnetlink", "dep:netns-rs", "dep:tun-tap", "dep:netlink-packet-route"]
experiment-nftables = ["net-privileged", "jip-nftables"]
# Vestigial placeholder feature (never referenced by any `#[cfg(feature = ...)]`). Its optional
# `jip-nftables` dep was removed as unused (cargo-machete verified; its lib `nftables_netlink` is
# absent from the source). Kept as an empty feature so the public feature set is unchanged — dropping
# it outright is a semver-breaking feature removal (cargo-semver-checks) even on this publish=false crate.
jip-nftables = []
net-unprivileged = ["host-common", "dep:smoltcp", "dep:vhost", "dep:vhost-user-backend", "dep:virtio-queue", "dep:vmm-sys-util", "dep:vm-memory", "vm-memory/backend-mmap", "vm-memory/backend-atomic", "dep:virtio-bindings"]

proxy = ["host-common", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:hudsucker", "dep:http"]
proxy-hudsucker = ["proxy"]

metrics = ["host-common"]

pipeline = [
    "host-common",
    "dep:reqwest", "dep:sha2", "dep:blake3",
    "dep:tar", "dep:flate2", "dep:lzma-rs", "dep:zstd",
    # `reflink-copy`/`walkdir` are declared on `host-common` (zygote CoW fan-out,
    # §9.4); `pipeline` inherits them through `host-common` above.
    "dep:tempfile",
    "am-fs-erofs", "dep:oci-client",
]

# Retained (dependents `vmcell-cli`/`vmcell-daemon`/`vmcell-bench` still name `vmcell/cli`, and
# dropping a feature is a semver break, cf. `jip-nftables`) but now only ensures the shared host
# JSON stack — the `bench-vm` binary that needed clap/anyhow moved to the `vmcell-bench` crate.
cli = ["host-common", "dep:serde_json"]

fuse-backend-rs = ["dep:fuse-backend-rs"]
vhost = ["dep:vhost"]
vhost-user-backend = ["dep:vhost-user-backend"]
virtio-queue = ["dep:virtio-queue"]
vmm-sys-util = ["dep:vmm-sys-util"]
vm-memory = ["dep:vm-memory"]
virtio-bindings = ["dep:virtio-bindings"]
am-fs-erofs = ["dep:am-fs-erofs"]

[package.metadata.cargo-machete]
# False positive: the library name is `fs_erofs` (not `am_fs_erofs`), used in
# src/artifact/tar2erofs.rs — cargo-machete's name heuristic misses the rename.
ignored = ["am-fs-erofs"]
