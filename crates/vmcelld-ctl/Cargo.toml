[package]
name = "vmcelld-ctl"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "vmcelld-ctl: a CLI wrapper over vmcell-daemon-client (design §18.7.2)"
publish = false

# A thin clap wrapper over the client library — argument marshaling + output formatting only, no
# logic (AGENTS.md "functionality in the library, binary is the wrapper").
[[bin]]
name = "vmcelld-ctl"
path = "src/main.rs"

[dependencies]
vmcell-daemon-client = { path = "../vmcell-daemon-client", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = "1"
serde_json = "1"
url = "2"
