[package]
name = "vmcell-bench"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "The vmcell cross-backend micro-VM benchmark harness (the bench-vm binary). Composition root that wires all four backends, kept out of the vmcell package so the dependency graph stays acyclic."
publish = false

# The `bench-vm` binary drives all four backends, so — like `vmcell-cli` — it lives OUTSIDE the
# `vmcell` package and depends on `vmcell` plus the three extracted backend crates. This is the one
# place with an edge to every backend; `vmcell` itself keeps only Cloud Hypervisor. The optional
# `firecracker`/`qemu`/`crosvm` features gate the three secondary backends the same way the in-tree
# bin used to.
[dependencies]
vmcell = { path = "../vmcell", version = "0.12.0", default-features = false, features = ["cloud-hypervisor", "metrics", "cli", "proxy"] }
vmcell-firecracker = { path = "../vmcell-firecracker", version = "0.1.0", optional = true }
vmcell-qemu = { path = "../vmcell-qemu", version = "0.1.0", optional = true }
vmcell-crosvm = { path = "../vmcell-crosvm", version = "0.1.0", optional = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "process", "sync", "time", "signal"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "blocking"] }
hyper = { version = "1", features = ["client", "http1"] }
hudsucker = "0.24"
futures = "0.3"
libc = "0.2"
tempfile = "3"

[features]
# `crosvm` graduated INTO the default set once it was validated live on a KVM host with a `crosvm`
# binary present (21/21 via `just test-crosvm`, incl. snapshot/restore — the exit condition the
# staging comment named, mirroring how `qemu` graduated). CI compiles the crosvm arm regardless via
# `--all-features` (see `just ci`), so default-on adds no build risk; it only lets the standard
# `cargo build --release -p vmcell-bench` cover crosvm, which the perf matrix relies on. The crosvm
# *runtime* matrix still needs a `crosvm` binary present (absent on CI), so its LIVE validation stays
# the opt-in `just test-crosvm` recipe, not `test-privileged`.
default = ["cloud-hypervisor", "firecracker", "qemu", "crosvm"]
# `cloud-hypervisor` is the binary's `required-features` equivalent; the `vmcell` dep pins it
# unconditionally above, so this feature only exists to satisfy the bin's `#[cfg(feature=…)]` arm.
cloud-hypervisor = ["vmcell/cloud-hypervisor"]
firecracker = ["dep:vmcell-firecracker"]
qemu = ["dep:vmcell-qemu"]
crosvm = ["dep:vmcell-crosvm"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# The `#[ignore]`d KVM benchmark tests re-export the rootfs/kernel getters from the validator
# harness (the single source of truth) so they trigger the same at-most-once artifact build the
# rest of the suite uses. Dev-only: no production edge (vmcell-bench → validator → vmcell).
vmcell-artifact-validator = { path = "../vmcell-artifact-validator", version = "0.1.0" }

[[bin]]
name = "bench-vm"
path = "src/bin/bench-vm.rs"
required-features = ["cloud-hypervisor"]
