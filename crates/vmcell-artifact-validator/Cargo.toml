[package]
name = "vmcell-artifact-validator"
# This crate is the second half of the downstream contract surface (§10.4), so `cargo semver-checks`
# covers it beside `vmcell` and every change to its public API is a deliberate, ledgered bump — the
# same convention `vmcell`'s and `vmcell-protocol`'s manifests carry. This block starts the ledger;
# 0.1.0 was the extraction release and needs no entry behind it.
# 0.1.0 → 0.2.0: the docs/81 review pass. `cargo semver-checks check-release
# -p vmcell-artifact-validator --baseline-rev main` reports exactly the one BREAKING edge below; the
# additive items and the two behavior changes are ledgered by hand because no lint sees them.
#   * BREAKING `function_parameter_count_changed`: `checks::metrics_mem_limit_ooms` gained a
#     `resource_prefix: &str` parameter (1 → 2). It composed its `memory.events` path from a
#     hardcoded `vmcell-vm-<vmid>` literal, so `metrics.mem_limit_ooms` read a slice that exists for
#     NO VM with a non-default `resource_prefix` — the check could only ever pass by accident on a
#     renamed deployment. The slice name now comes from the one law, `vmcell::metrics::vm_slice_name`
#     (new in `vmcell` 0.14.0), and the prefix is a required argument with no default, so the wrong
#     path is not reachable without a caller naming one. Callers pass the `VmConfig::resource_prefix`
#     the VM was actually started with, not a constant.
#   * ADDITIVE: `classify::BootKind` (`Fresh` / `Restored`), `classify::classify_serial_of` and
#     `classify::explain_boot_failure_of` (the same two renderers with the boot kind made explicit),
#     and the three tail bounds `classify::SERIAL_TAIL_MAX_LINE_BYTES`,
#     `classify::SERIAL_TAIL_MAX_BYTES`, `classify::TRUNCATION_MARKER` — public so a caller matching
#     on a rendered message has the literal rather than a copy of it. `classify::classify_serial` and
#     `classify::explain_boot_failure` keep their signatures and delegate with `BootKind::Fresh`, so
#     an existing call site classifies exactly as before.
#   * BEHAVIOR-ONLY — no signature moved:
#     - `classify::explain_boot_failure`'s serial tail is now byte-bounded as well as line-bounded:
#       each quoted line is capped at `SERIAL_TAIL_MAX_LINE_BYTES` (truncated at a UTF-8 boundary and
#       marked with `TRUNCATION_MARKER` plus the elided byte count) and the quoted lines together at
#       `SERIAL_TAIL_MAX_BYTES`. It previously quoted 20 tail lines at whatever length they were, so
#       a guest that emitted one multi-megabyte line put all of it in the caller's report. A consumer
#       asserting on exact message text may now see a truncated quote.
#     - `checks::snapshot_restore_roundtrip` renders the restored VM's console with
#       `BootKind::Restored`, so an absent kernel banner is no longer reported as
#       `NoDirectBootKernel`. A restored instance's console is empty by construction — its kernel
#       printed the banner in the snapshot SOURCE, a different VM writing a different console file —
#       so the old reading diagnosed a kernel that provably just booted as not being a kernel.
# 0.2.0 → 0.3.0: design v33 §18 delta 1 — the steward rename. This crate's share of it is small in
# code and BREAKING in contract, because two CHECK IDS are contract surface: a consumer selects,
# skips, or asserts on them by string.
#   * BREAKING (invisible to `cargo semver-checks` — a check id is data, not a signature, which is
#     exactly why it is ledgered by hand):
#       "boot.agent_ready"       → "boot.steward_ready"
#       "agent.exec_roundtrip"   → "steward.exec_roundtrip"
#       "agent.put_file_roundtrip" → "steward.put_file_roundtrip"
#     A consumer filtering the roster by id, or diffing a report against a stored baseline, sees the
#     rename as a check disappearing and a new one arriving. `sed` the three ids.
#   * BREAKING `function_parameter_count_changed`-adjacent renames in the public API follow
#     `vmcell` 0.15.0's list (the crate drives `StewardClient`, not `AgentClient`).
# No check CHANGED WHAT IT VERIFIES in this bump; the ids moved and nothing else did.
# 0.3.0 → 0.4.0: design v33 §18 delta 3 — the two-directional conformance kit (§10.6).
#   * BREAKING `enum_variant_added`: `CheckStatus` gains `Warn(String)` and `Unverified(String)`.
#     `CheckStatus` is deliberately exhaustive, so a consumer matching on it must add two arms —
#     which is the intended compile-time fail-loud, not an accident. `cargo semver-checks` reports
#     exactly this edge; it is the gate that caught the missing bump on this very change.
#       - `Warn` = an ABSENT feature that DOES work: under-claiming, a DOCUMENTATION defect, not a
#         runtime one. It is deliberately not a `Fail`, because reddening an under-claim pushes
#         declarers toward over-claiming — the exact wrong incentive.
#       - `Unverified` = an absence that cannot be decided, with why. Never counted as a pass.
#         Proving a negative is sometimes impractical (snapshot absence is testable by attempting a
#         snapshot; page-sharing absence is not, because no in-guest observation distinguishes "the
#         host is not sharing pages" from "it is and nothing diverged yet").
#   * UNCHANGED, and pinned by a test so it stays that way: `into_result()`'s and `is_ok()`'s
#     contract is still **Fail-only**. A report carrying Warns and Unverifieds but no Fail is still
#     `Ok(())`. A consumer's pass/fail decision does not move under this bump.
#   * ADDITIVE: the `conformance` module (`ConformanceOptions`, `Substrate`, the paired
#     absence-probe/positive-control machinery), `ValidationReport::warnings`/`unverified`.
# 0.4.0 → 0.5.0: v33 §18 delta 7 — `conformance.xattr_preserved` stops being undecidable.
#   * BREAKING `enum_variant_added`: `ProbePlan::XattrReadback`. `ProbePlan` is exhaustive, so an
#     out-of-tree matcher gains an arm. It was `Undecidable(NO_PROBE_YET)` only because nothing
#     could read an xattr inside a guest; delta 7's `xattr` guest-tools applet is exactly that, and
#     leaving the plan undecidable once the probe exists is the accepted-but-not-honored shape the
#     kit exists to catch.
#   * ADDITIVE: `checks::xattr_preserved_probe` — an in-guest walk that short-circuits on the first
#     xattr found. A COMPLETE walk finding none is a decided `DoesNotWork` (so a `Strip` artifact
#     PASSES rather than skipping); a walk that hits its cap, or cannot run, is `NotRun` →
#     `Unverified`, and the verdict REPORTS the cap rather than implying completeness.
#     Driven live both ways: `Works` against a `Preserve` image, and `DoesNotWork` against the
#     canonical `Strip` artifacts after walking 3276 paths.
# 0.5.0 → 0.6.0: the docs/90 review pass — one signature edge `cargo semver-checks` reports, and one
# behavior change it structurally cannot (there is no lint for a verdict that changes which status it
# renders).
#   * BREAKING `constructible_struct_adds_field`: `ValidationOptions.run_budget: Option<Duration>`.
#     The one edge `cargo semver-checks` reports, and the only one — measured with the version held at
#     the baseline: `196 checks: 195 pass, 1 fail`, naming this field.
#     The struct is deliberately exhaustive, so a caller building it with a struct literal adds a
#     field — the intended compile-time fail-loud. Both constructors carry
#     `Some(DEFAULT_RUN_BUDGET)`: `ValidationOptions::default()` and `::level(l)`, the latter through
#     a functional update rather than a re-spelled literal, so a later field cannot silently arrive
#     as `None` for every `level()` caller.
#   * ADDITIVE: `DEFAULT_RUN_BUDGET` (20 minutes). Its own const rather than a reuse of
#     `conformance::DEFAULT_BATTERY_BUDGET`, because the two bound different rosters — the three
#     levels here, a declared feature roster there — and one const for both would re-budget one
#     silently when the other's roster grew.
#   * BEHAVIOR, and the point of the field: `validate()` is bounded END TO END now. Per-check
#     deadlines are unchanged and each still fails loud; this bounds their SUM. A `Level::Full` run
#     boots several VMs sequentially and was bounded only by whatever those deadlines happened to add
#     up to — the gap `ConformanceOptions.battery_budget` closed for the battery and not for this,
#     older, entry point, which design §17 nonetheless read as closed (docs/90 C5). Exceeded is
#     `vmcell::Error::Timeout` naming the budget, the level that outran it and the checks that
#     completed first — never a hang, and never a green report with its tail missing. `None` opts out
#     EXPLICITLY, for a caller that bounds the run itself (a nextest timeout, a CI job budget).
#   * BEHAVIOR a downstream battery can observe, and the one to act on: the conformance kit's
#     snapshot absence-probe now distinguishes SETUP failure from MEASUREMENT. A candidate that could
#     not be configured, could not start, never booted, or had no tempdir comes back
#     `ProbeOutcome::NotRun` → `CheckStatus::Unverified` (with why, never counted as a pass), where
#     0.5.0 answered `DoesNotWork` — which `judge` reads as a measured absence and therefore as a
#     `Pass`. So an artifact declaring `snapshot_restore: false` that could not boot AT ALL was
#     certified as a verified absence while the healthy positive control kept the run green (docs/90
#     M8). A consumer diffing reports against a stored baseline sees some former passes become
#     `Unverified`: those are exactly the ones that never measured anything. The inverse is held too
#     — a snapshot and restore that both SUCCEEDED and then failed the guest handshake stays
#     `DoesNotWork`, so a broken restore cannot hide behind `Unverified`.
#     `checks::snapshot_restore_roundtrip`, the `Level::Full` check, is unchanged; this is the
#     conformance probe beside it.
# 0.6.0 → 0.6.1: design §17 (Open gaps and deferred work)'s backend hardcode, closed. `validate()`
# booted Cloud Hypervisor and nothing else, though every check under it is already generic over
# `Vmm`. PURELY ADDITIVE — `cargo semver-checks check-release -p vmcell-artifact-validator` reports
# no edge at all — measured against `main`: `196 checks: 196 pass`, `no semver update required` —
# which is exactly why the decision is written down here rather than left to a lint.
#   * ADDITIVE: `validate_with(&vmm, &artifacts, &opts)` — `validate`'s body with the backend
#     supplied by the caller: a secondary backend crate's (`vmcell-firecracker`, `vmcell-qemu`,
#     `vmcell-crosvm`), a consumer's own out-of-tree one, or a test double. A PATCH bump, not a
#     minor one: nothing moved and nothing broke, and the two in-workspace `^0.6.0` requirements
#     (`vmcell`'s dev-dep and `vmcell-bench`'s) keep resolving without an edit.
#   * THE SHAPE, and why it is not the one §17 sketched ("a backend knob on `ValidationOptions`").
#     `Vmm` is not dyn-compatible — `create` and `restore` are `async fn`, so `dyn Vmm` is
#     `error[E0038]` — which means no FIELD can hold an erased backend or an erased factory over
#     one; and the enum-of-backends rustc itself suggests would make this contract crate depend on
#     all three backend crates (they depend on `vmcell`, not the reverse) while STILL excluding the
#     out-of-tree backend the knob exists for. So the backend travels with the call, the way
#     `vmcell-bench`'s composition root and this crate's own `conformance::LiveProbe` already pass
#     one. `ValidationOptions` gains NO field and stays `Clone + Debug` data: a consumer building it
#     with a struct literal compiles unchanged, which is the whole reason this bump is a patch.
#   * UNCHANGED, and pinned by tests rather than by this prose: `validate()` still boots Cloud
#     Hypervisor (`the_default_backend_is_still_cloud_hypervisor` asserts the backend's `id()`, and
#     a source scan pins that the crate constructs a backend in exactly ONE production site and that
#     `validate` is `validate_with` on it), and its two refusals fire in the same order as before —
#     missing artifact first, absent `/dev/kvm` second.
#   * BEHAVIOR, scoped to the new door and stated because no lint can: `validate_with` does NOT
#     probe `/dev/kvm`. The caller chose the backend, so the caller knows whether it needs one —
#     every shipped backend does, and `harness::has_kvm()` is public for that preflight, while a
#     test double does not. Refusing on the double's behalf would put this knob's own gate behind
#     the facility the knob exists to be testable without. It DOES run the same artifact-existence
#     refusal `validate` runs, through the one predicate, so a path typo is a typed
#     `Error::Artifact` at either door instead of a report full of boot failures.
#   * The other §10.4 (The downstream toolkit contract) entry point needed nothing:
#     `conformance::run_battery` has always taken its backend from the caller
#     (`LiveProbe::new(&vmm)`). The asymmetry §17 records for `run_budget` — bounded in the battery,
#     unbounded in this older door — does not repeat here, and
#     `only_the_default_door_names_a_concrete_backend` is what keeps it from starting to.
version = "0.6.1"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Validates custom-built vmcell artifacts (kernel, rootfs) against the artifact↔system contract by booting test micro-VMs"
publish = false

[lib]
name = "vmcell_artifact_validator"
path = "src/lib.rs"

[dependencies]
# The validator boots real vmcell micro-VMs and drives the steward, and reuses vmcell's
# capability descriptors + net math. It needs the host stack: a backend, metrics, pipeline
# (for artifact_path helpers). `vmcell` has no dependency on this crate.
vmcell = { path = "../vmcell", version = "0.22.0", features = ["cloud-hypervisor", "metrics", "pipeline"] }
# The applet roster (`GUEST_TOOLS_APPLETS`) only — the validator speaks no wire protocol of its
# own. `rootfs_guest_tools` composes its PATH probe from that const instead of re-typing the
# names, so growing the roster extends what the contract battery checks with no edit here. It is
# the same const the guest binary's dispatch table and the rootfs symlink manifest derive from
# (design §4.4, docs/81 m22). `vmcell` links it too, but does not re-export it.
vmcell-protocol = { path = "../vmcell-protocol", version = "0.8.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
futures = "0.3"
tracing = "0.1"
tempfile = "3"

# `vmcell/test-support` is a DEV-dependency and never a production one: it exposes
# `vmcell::metrics::FakeCgroupFs` (the in-process `CgroupFs` fake this crate used to hand-roll a
# `TestCgroupFs` copy of — docs/81 §9). Declaring it here means `cargo build -p
# vmcell-artifact-validator` compiles WITHOUT the feature, so a production reference to the fixture
# is a compile error; `scripts/ban-test-support-in-production.sh` is the backstop for
# `--all-targets`, where cargo's feature unification does make it visible to the lib target.
# The feature list mirrors the `[dependencies]` entry above, plus `test-support`.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
vmcell = { path = "../vmcell", version = "0.22.0", features = ["cloud-hypervisor", "metrics", "pipeline", "test-support"] }
