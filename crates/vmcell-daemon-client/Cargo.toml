[package]
name = "vmcell-daemon-client"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Typed Rust client for vmcelld, mirroring the vmcell entry points over HTTP (design §11.7)"
publish = false

[lib]
name = "vmcell_daemon_client"
path = "src/lib.rs"

[dependencies]
# `default-features = false` links ONLY the wire DTOs + the name predicate from the daemon — never
# its axum/vmcell server stack (design §11.1). One type on both sides of the wire.
vmcell-daemon = { path = "../vmcell-daemon", version = "0.7.0", default-features = false }
# `stream` is what makes `upload_artifact` STREAM a local file (§11.7 / §17): it enables
# `impl From<tokio::fs::File> for reqwest::Body`, which wraps the file in a byte stream instead of
# requiring the caller to hand over a `Vec` it read itself.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `fs` only: the streaming upload opens the artifact file asynchronously and hands it to reqwest.
tokio = { version = "1", features = ["fs"] }
url = "2"

[dev-dependencies]
# `net`/`io-util` beyond the runtime: the streaming-upload gate runs a real one-connection HTTP
# server on loopback and reads the request the client actually put on the wire.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tempfile = "3"
