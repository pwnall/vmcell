[package]
name = "vmcell-daemon-client"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Typed Rust client for vmcelld, mirroring the vmcell entry points over HTTP (design §18.7)"
publish = false

[lib]
name = "vmcell_daemon_client"
path = "src/lib.rs"

[dependencies]
# `default-features = false` links ONLY the wire DTOs + the name predicate from the daemon — never
# its axum/vmcell server stack (design §18.1). One type on both sides of the wire.
vmcell-daemon = { path = "../vmcell-daemon", version = "0.2.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
