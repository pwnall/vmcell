[package]
name = "vmcell-guest-agent"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "vmcell guest PID-1 agent: vsock control plane + zombie reaper (lean, no host async stack)"
publish = false

# A library (the PID-1 reaper coordination — pure, unit-tested) plus the thin binary that
# drives it. Both stay off the host async stack; the CI lean-agent assertion enforces this
# structurally on the member crate (v15 §12.8 #4).
[lib]
name = "vmcell_guest_agent"
path = "src/lib.rs"

[[bin]]
name = "vmcell-guest-agent"
path = "src/main.rs"

[dependencies]
# Explicit `version` alongside `path` keeps the cargo-deny `wildcards = "deny"` gate happy.
vmcell-protocol = { path = "../vmcell-protocol", version = "0.5.0" }
postcard = { version = "1", features = ["use-std"] }
vsock = "0.5"
# `event` powers the event-driven vsock accept loop (poll(2) on the listener fd,
# OPP-2). `pty`/`termios`/`stdio` power interactive PTY sessions (design 62 §22):
# `openpt`/`ptsname`/`unlockpt`, `tcsetwinsize`/`Winsize`, and the async-signal-safe
# `setsid`/`ioctl_tiocsctty`/`dup2_std*` login-tty sequence in the child `pre_exec`.
# All are features on the existing dep, so the lean-agent graph gains no crate.
rustix = { version = "1", features = ["fs", "mount", "process", "net", "time", "event", "pty", "termios", "stdio"] }
signal-hook = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# AGENT-3: round-trip the guest's hand-rolled framing against the REAL host codec
# in a KVM-free unit test. Dev-only, so the CI lean-agent assertion (`cargo tree
# -e no-dev`) still sees no tokio/hyper on the agent's production graph.
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
