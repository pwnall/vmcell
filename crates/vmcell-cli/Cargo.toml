[package]
name = "vmcell-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "The vmcell command-line tool: the composition root that wires vmcell with the in-VM builder crates"
publish = false

# The `vmcell` command. This is the composition root (design §10.1): it depends on
# `vmcell` AND the two in-VM builder crates and assembles the artifact `Pipeline`, choosing
# bootstrap vs in-VM builders per `--rootfs-source` / `--kernel-source`. It lives OUTSIDE the
# `vmcell` package so the dependency graph stays acyclic (a CLI in `vmcell` that constructed
# the builders — which depend on `vmcell` — would be a cycle).
[[bin]]
name = "vmcell"
path = "src/main.rs"

[dependencies]
vmcell = { path = "../vmcell", version = "0.17.0", features = ["cloud-hypervisor", "metrics", "pipeline", "cli"] }
vmcell-rootfs-builder = { path = "../vmcell-rootfs-builder", version = "0.1.0" }
vmcell-kernel-builder = { path = "../vmcell-kernel-builder", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
# `io-std`/`io-util` power the interactive `run --tty/--stdin` stdin forwarding
# (async `tokio::io::stdin` + `AsyncReadExt`, design 62 §22); `macros` gives `select!`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
# NOTE: no `serde_json` here. The CLI's only JSON parse was `build-kernels`' overlay-blind
# re-read of `pins.json`, retired by §18 delta 1 in favour of `vmcell::artifact::resolve_kernel_labels`
# (which resolves baseline + overlay through the one pin schema). `cargo machete` (a `just ci` step)
# is the gate: re-adding the dep without a consumer turns it red.
