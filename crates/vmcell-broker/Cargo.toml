[package]
name = "vmcell-broker"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "vmcell setup broker: a minimal privileged spawn helper that holds the caps and performs netns/tap/nft/cgroup setup + the jailed VMM spawn for a cap-dropped daemon parent (design §20.5)"
publish = false

# Links `vmcell` for the audited netns/nft/cgroup/sweep + jail code it reuses at privilege (one law,
# never a reimplementation), and `vmcell-privilege` for the parent capability-drop plan. It does NOT
# link `vmcell-daemon` / any web stack — the whole point is that the HTTP surface is NOT co-located
# with the caps. `vmcell` has no edge back here.
[dependencies]
vmcell = { path = "../vmcell", version = "0.11.0", default-features = false, features = ["cloud-hypervisor"] }
vmcell-privilege = { path = "../vmcell-privilege", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
libc = "0.2"

[dev-dependencies]
# The dispatch tests implement a recording `Netlink` fake; the trait's `setup_tap` return type
# names `tun_tap::Iface`, so the impl must reference the crate (test-only). Pinned to vmcell's `0.1`.
tun-tap = "0.1"
