[package]
name = "vmcell-daemon"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "vmcell control-plane daemon library: artifact store, cross-process VM registry, and the HTTP REST API (§D)"
publish = false

# The daemon library carries the well-tested logic; `vmcelld` is the thin blessed binary wrapper
# (§18.1). The `client` consumer (`vmcell-daemon-client`) sets `default-features = false` to link
# ONLY the wire DTOs + the artifact-name predicate (serde + std), never the axum/vmcell server stack —
# so the wire schema is single-sourced without the client pulling the whole server (§18.1).
[lib]
name = "vmcell_daemon"
path = "src/lib.rs"

[features]
default = ["server"]
# The full daemon: axum router + handlers, VM registry, auth, the vmcell host stack, and the
# setup-broker bridge (the privilege-separated `vmcelld` cutover, §20.5 — the broker child owns the
# registry, the cap-dropped parent serves HTTP over the `VmEngine` RPC).
server = [
    "dep:axum",
    "dep:tower",
    "dep:tokio",
    "dep:async-trait",
    "dep:subtle",
    "dep:sha2",
    "dep:tempfile",
    "dep:tracing",
    "dep:vmcell",
]

[dependencies]
# Always compiled — the wire schema shared with the client.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Server-only.
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util"], optional = true }
async-trait = { version = "0.1", optional = true }
subtle = { version = "2", optional = true }
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }
tracing = { version = "0.1", optional = true }
vmcell = { path = "../vmcell", version = "0.12.0", features = ["cloud-hypervisor", "metrics", "pipeline", "cli"], optional = true }

[package.metadata.cargo-machete]
# False positive: async-trait is a proc-macro used via #[async_trait]
# (launcher.rs/server.rs/registry.rs) — not a path-referenced crate.
ignored = ["async-trait"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"
