[package]
name = "vmcell-daemon"
# 0.2.0 → 0.3.0: v33 §18 delta 10 — steward placement over REST. The change is **wire-additive**
# (`CreateVmRequest` grows `init` and `steward_placement`, both `#[serde(default)]`, so an existing
# client's body still decodes and still produces the pre-v33 cell) but **source-breaking** for an
# out-of-tree Rust caller building `CreateVmRequest` or `LaunchSpec` with a struct literal — neither
# is `#[non_exhaustive]` nor `Default`, this crate is `publish = false`, and `cargo semver-checks`
# does not cover it, so nothing would tell such a caller but this line.
# 0.3.0 → 0.4.0: the docs/90 review pass. `cargo semver-checks` does not cover this crate (§10.4
# lists neither it nor its wire), and nothing here moved a signature anyway — every edge below is a
# REPLY a client sees change, so this line is the only thing that will tell them.
#   * `name::MAX_ARTIFACT_NAME_LEN` DROPS to `NAME_MAX - SHA256_SIDECAR_SUFFIX.len()` (248) from a
#     bare 255. A 249..=255-byte name is refused at the boundary now — `InvalidName::TooLong`, a 400
#     naming the suffix — where it used to be accepted, persist the artifact, and then fail its
#     sidecar write with `ENAMETOOLONG`: a deterministic 500 on a well-formed request, and a burned
#     name in a create-only store. An accepted name has to fit TWICE, as `<name>` and as
#     `<name>.sha256`. A client minting names at the old ceiling shortens them by seven bytes; the
#     predicate is the same one it already links (`default-features = false` compiles `name`), so it
#     can pre-check without a round trip.
#   * A `create` whose digest-sidecar write fails now ROLLS THE ARTIFACT BACK, so the reply's error
#     describes the state on disk. It previously left the blob in place, bootable by a later `create`
#     and holding a name that could never be re-created.
#   * An op racing a teardown gets a prompt 409 `Conflict` ("vm <id> is Destroying, not Ready"),
#     where it used to get a 404. `destroy` marks the slot `Destroying` IN PLACE, takes the handle
#     lock — which is where a teardown waits, for as long as an in-flight snapshot's multi-second
#     guest-RAM write holds it — and removes the slot from the table LAST. Removing it first unpinned
#     the VM for the whole of that wait: the delete-in-use scan reads pins only through that table,
#     so a `DELETE /v1/artifacts/<prefix>` landing in the window found a pin-free table, returned 204
#     and `remove_dir_all`'d the directory the VMM was still writing into (docs/90 M6). A client that
#     treated 404 as "already gone, stop retrying" must handle 409 as "not yet". `Destroying` is a
#     one-way door: a snapshot completing behind a parked teardown no longer restores `Ready` over it.
#   * `POST /v1/vms` carrying an inline `command` tears the VM down when the exec FAILS, not only
#     when `ephemeral` asked for it. `create` is one operation and its error reply carries no
#     `CreateVmResponse`, so the VM it left behind was a booted, resource-holding cell whose id the
#     caller never received and could not destroy. A command that RAN and exited non-zero is
#     unchanged — that is an `Ok` outcome and keeps its VM, as `ephemeral: false` asks.
#   * COMPANION, in `vmcell-daemon-client` (0.1.0, unbumped — it has no ledger and no signature
#     moved): every verb that names a resource validates the segment BEFORE joining it into the
#     request path, through one predicate, instead of `format!`-ing a caller string into a URL.
#     `Url::join` resolves a relative reference, so an unvalidated `../vms/vm-1` did not 404 — it
#     retargeted the request at another endpoint. `upload_artifact` validated and the other seven did
#     not.
# 0.4.0 → 0.5.0: the guest exec capture gets its own host-side ceiling (design §17, Open gaps and
# future capabilities). Same reasoning as the entry above — `cargo semver-checks` does not cover this
# crate and no signature a client links moved, so this line is the only thing that will tell them.
#   * An `exec` — or a `create` carrying an inline `command` — whose captured stdout+stderr exceeds
#     `bridge::MAX_EXEC_CAPTURE_BYTES` now returns 413 `payload_too_large`, naming the measured size,
#     the ceiling and the remedy. Two client-visible edges: a capture in the narrow band that used to
#     fit the bridge frame is now REFUSED, and a capture past the frame that used to return an opaque
#     500 `internal` ("bridge frame … exceeds cap") now returns that explained 413. A client that
#     treated 500 as retryable must handle 413 as terminal-until-the-command-changes.
#   * The capture is REFUSED, never truncated: `ExecOutcomeDto` is unchanged, so no reply carries a
#     silently shortened stdout/stderr a client could mistake for the whole. Re-run the command
#     redirecting output to a file in the guest and fetch the file.
#   * `bridge::MAX_EXEC_CAPTURE_BYTES` is public so a client can pre-size without a round trip. It is
#     DERIVED from `MAX_BRIDGE_FRAME_BYTES` (less the reply-envelope reserve, times 3/4 for base64),
#     so re-tuning the frame cap moves it; read the constant, never a number quoted anywhere.
# 0.5.0 → 0.6.0: the two §17 daemon gaps — the pause/resume ROUTES and the STREAMING artifact upload.
# Same reasoning as every entry above: `cargo semver-checks` does not cover this crate (§10.4 lists
# neither it nor its wire), so this line is the only thing that will tell a consumer.
#   * NEW ROUTES `POST /v1/vms/{id}/pause` and `POST /v1/vms/{id}/resume` (op ids `pauseVm` /
#     `resumeVm`), authenticated like every other VM verb and served in the OpenAPI document from the
#     same one table. Both reply `200` with the VM's `VmInfo`, so a client reads the state it moved to
#     rather than assuming it. Additive: no existing route, request or reply changed.
#   * `VmState::Paused` is now REACHABLE. It has been in the wire enum since v1, documented as
#     reserved; a client that treated it as unreachable (an `unreachable!()` arm, a match that folded
#     it into "ready") now needs a real arm. A paused VM still holds every host resource and still
#     PINS its artifacts, so `DELETE /v1/artifacts/{name}` still 409s for it; `exec`, `snapshot` and a
#     second `pause` are 409 `conflict` until the resume, while `stats` and `destroy` keep working.
#     `snapshot` is refused deliberately: the backend's own snapshot pauses and RESUMES internally,
#     which would restart the guest behind the daemon's state.
#   * `PUT /v1/artifacts/{name}` STREAMS. The handler takes the raw body instead of buffering it, and
#     the store hashes, caps and writes chunk by chunk, so the largest artifact a daemon can accept is
#     no longer a function of its RAM. Create-only, atomicity and the digest sidecar are unchanged —
#     the buffered `create` is now literally the streaming path with one chunk. Two client-visible
#     edges: an over-cap upload is refused AT THE CHUNK THAT CROSSES the cap (a 413 whose message says
#     "at least N bytes", because the total is not known in advance), and a body that fails
#     mid-stream — a client that disconnects — is a 400 `bad_request` naming how far it got, where it
#     previously surfaced as the body extractor's own error. Nothing is published in either case.
#   * COMPANION, in `vmcell-daemon-client` (0.1.0, unbumped — it has no ledger, and both edges are
#     additive): `pause`/`resume` verbs, and `upload_artifact` now STREAMS an `UploadBody::Path` off
#     disk (`tokio::fs::File` → `reqwest::Body`) instead of `std::fs::read`-ing it into memory. A
#     streamed body has no `Content-Length` — it is sent chunked — which a strict intermediary or a
#     hand-rolled test server may need to expect. `vmcelld-ctl` gains `pause`/`resume` subcommands.
# 0.6.0 → 0.7.0: three more §17 daemon gaps — the PERIODIC orphan sweeper, the UDS transport, and
# the artifact-store quota + start-up GC. Same reasoning as every entry above: `cargo semver-checks`
# does not cover this crate (§10.4 lists neither it nor its wire), so this line is the only thing
# that will tell a consumer.
#   * NEW ROUTE `GET /v1/store` (op id `storeUsage`), authenticated like every other route and served
#     in the OpenAPI document from the same one table. It answers the new `dto::StoreUsage`
#     (`used_bytes`, `quota_bytes`, `artifact_count`, `snapshot_prefix_count`). `quota_bytes` is a
#     plain `Option` with NO `skip_serializing_if`, so `null` is always on the wire — deliberately
#     not a presence attribute.
#   * NEW BEHAVIOR, off by default: `vmcelld --max-store-bytes <N>` caps the WHOLE store. Once it is
#     reached, `PUT /v1/artifacts/{name}` and `POST /v1/vms/{id}/snapshot` return 413
#     `payload_too_large` naming the usage, the quota and the remedy. Nothing is ever EVICTED to make
#     room — a client at the ceiling frees space itself with `DELETE /v1/artifacts/{name}`. An upload
#     that fits the per-upload cap but not the remaining headroom is refused at the chunk that
#     crosses, and the message names WHICH ceiling bound it. With no `--max-store-bytes` the store is
#     unbounded and pays no scan, exactly as before.
#   * NEW BEHAVIOR: a start-up artifact GC removes the daemon's OWN crash residue — abandoned upload
#     temp files (now prefixed `artifact_store::UPLOAD_TEMP_PREFIX`) and digest sidecars whose
#     artifact is gone — older than `DEFAULT_RESIDUE_MIN_AGE`. It never touches an uploaded artifact,
#     a snapshot prefix, or any file it did not create. A client cannot observe this except as
#     reclaimed bytes in `GET /v1/store`. The upload temp-file NAME changed (`.tmp*` →
#     `.vmcelld-tmp.*`), which matters only to a test or tool that matched the old prefix.
#   * NEW BEHAVIOR: `vmcelld --sweep-interval-secs <N>` (default 300, `0` disables) runs the orphan
#     sweep periodically, not only at start-up. It is liveness-aware in two independent ways — the
#     registry's live-vmid set and the cross-process id-claim registry — and it DEFERS a whole pass
#     while any VM launch is in flight, because a launching VM's resources exist under a vmid the
#     table does not list yet. A value between 1 and `sweep::MIN_SWEEP_INTERVAL` is REFUSED at
#     start-up rather than rounded up.
#   * NEW TRANSPORT: `vmcelld --uds` (or `--uds-path <path>`) also serves the API on a Unix-domain
#     socket under `$XDG_RUNTIME_DIR/vmcell/vmcelld.sock`. It carries the SAME bearer authentication
#     as the TCP bind — the socket's `0700` directory and `0600` mode are defence in depth, not a
#     substitute (the reasoning is recorded in `vmcell_daemon::uds`). The daemon refuses to start if
#     that directory is wider than `0700`, if a LIVE daemon already holds the socket, or if a
#     non-socket is in the way; a stale socket is reclaimed and logged.
#   * SOURCE-BREAKING for an out-of-tree Rust caller: `Registry` gains a private field (it is
#     constructed only through `Registry::new`, so this is a break only for a struct literal, which
#     was never possible); `ArtifactWriter` no longer borrows the store by value-field. Neither is
#     reachable from a `default-features = false` client.
#   * COMPANION, in `vmcell-daemon-client` (0.1.0, unbumped — it has no ledger and the edge is
#     additive): a `store_usage()` verb, and `vmcelld-ctl` gains a `store` subcommand.
# 0.7.0 → 0.8.0: **copy-on-attach writable scratch disks** (docs/92 Tier E, H1; design §11.5, §17).
# The daemon's "extra disks are read-only" limitation is lifted — it was recorded rather than
# accidental, so this line is where it stops being true. As with every entry above,
# `cargo semver-checks` does not cover this crate, so nothing else will tell a consumer.
#   * WIRE-ADDITIVE: `ExtraDiskSpec` grows `writable: bool`, `#[serde(default)]` false. An existing
#     client's body decodes unchanged and still produces a read-only, shared attachment — the
#     pre-H1 cell, byte for byte. `writable: true` attaches a PRIVATE COPY of the named artifact
#     instead: copied at create time (a reflink where the host filesystem gives one, a byte copy
#     otherwise), writable by the guest, deleted with the VM. Nothing reads it back — it is scratch,
#     not an output channel; a client that wants the result out of the cell reads it over `exec`.
#   * THE STORE ARTIFACT IS NEVER ATTACHED WRITABLE, whatever the flag says, because the store is
#     create-only and other cells may be reading the same file. That is why this is a copy rather
#     than a mode, and it is what the live leg
#     `writable_extra_disk_is_a_private_copy_and_the_store_artifact_is_unchanged` asserts.
#   * A writable disk still PINS its source artifact (`DELETE` → 409 while the VM lives), exactly
#     like a read-only one: the delete-in-use law does not fork on the mode.
#   * NEW ON-DISK LAYOUT, inside `--artifacts-dir`: a reserved `.vmcell-scratch/` subdirectory
#     (`scratch::SCRATCH_DIR_NAME`) holds one directory of copies per VM. It lives beside the store
#     so a copy can actually reflink — that is a filesystem-local property — and its leading `.`
#     makes it unnameable by any client artifact name on any verb. It is EXCLUDED from
#     `GET /v1/store`: those bytes are real, but counting them would report per-VM scratch as
#     snapshot prefixes and make an upload's 413 depend on which VMs happen to be running. An
#     operator sizing that filesystem must account for the writable disks their cells ask for.
#     A hard-killed daemon leaks these copies like it leaks netns/cgroup/scratch; the next daemon
#     reclaims them at start-up, retaining anything whose owning pid is still alive.
#   * SOURCE-BREAKING for an out-of-tree Rust caller (none of it reachable from a
#     `default-features = false` client except the first): `ExtraDiskSpec` is not
#     `#[non_exhaustive]`, so a struct literal must add `writable` — use
#     `CreateVmRequest::with_extra_disk` / the new `with_writable_extra_disk` instead;
#     `LaunchSpec::extra_disks` is now `Vec<launcher::ExtraDisk>` rather than
#     `Vec<vmcell::BlockDevice>` (a `BlockDevice` names the image the guest is handed, and a
#     writable disk's image does not exist until the launcher makes it, so carrying the store path
#     in one would make "the artifact, attached read-write" representable); and
#     `MicroVmLauncher::new` takes a third argument, the artifacts directory it puts that scratch
#     under.
#   * NEEDS `vmcell` 0.23.3, whose `OverlayStore` seam grew the file-level `clone_file` door every
#     copy is materialized through (invariant S4: no second CoW path). The dependency requirement
#     below stays `^0.23.0`, as every sibling's does — the workspace resolves it by path, and
#     tightening one pin while thirteen others stayed loose would say something about resolution
#     that is not true.
version = "0.8.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "vmcell control-plane daemon library: artifact store, cross-process VM registry, and the HTTP REST API (§11)"
publish = false

# The daemon library carries the well-tested logic; `vmcelld` is the thin blessed binary wrapper
# (§11.1). The `client` consumer (`vmcell-daemon-client`) sets `default-features = false` to link
# ONLY the wire DTOs + the artifact-name predicate (serde + std), never the axum/vmcell server stack —
# so the wire schema is single-sourced without the client pulling the whole server (§11.1).
[lib]
name = "vmcell_daemon"
path = "src/lib.rs"

[features]
default = ["server"]
# The full daemon: axum router + handlers, VM registry, auth, the vmcell host stack, and the
# setup-broker bridge (the privilege-separated `vmcelld` cutover, §12.4 — the broker child owns the
# registry, the cap-dropped parent serves HTTP over the `VmEngine` RPC).
server = [
    "dep:axum",
    # The streaming artifact upload's chunk source: `axum::body::Body::into_data_stream()` yields a
    # `Stream`, and `StreamExt::next` is how the ingest loop pulls one chunk at a time (§11.7 /
    # §17, "Streaming upload"). Server-only, so the `default-features = false` client still links
    # nothing but the DTOs and the name predicate.
    "dep:futures",
    "dep:tower",
    "dep:tokio",
    "dep:async-trait",
    "dep:subtle",
    "dep:sha2",
    "dep:tempfile",
    "dep:tracing",
    "dep:vmcell",
]

# Fuzz-only decode entry points onto the bridge's two wire enums (`bridge::fuzz_decode_engine_request`
# / `fuzz_decode_engine_reply`). NOT in `default`, and the only consumer is the workspace-EXCLUDED
# `fuzz/` crate, so `cargo build -p vmcell-daemon` cannot reach them and no feature unification can
# pull them into a shipped binary.
#
# It exposes DECODE FUNCTIONS, not the enums: `EngineRequest`/`EngineReply` stay private, so this
# commits to no wire schema — the entry point hands back the value re-serialized on the same codec,
# which is all a round-trip property needs. `vmcell-daemon` is `publish = false` and is not one of
# the two `cargo semver-checks` contract crates (`vmcell`, `vmcell-artifact-validator`), so the
# ledger cost is this comment rather than a version bump. Deliberately NOT enrolled in
# `scripts/ban-test-support-in-production.sh`: that gate polices test FIXTURES against production
# use, and these are production types reached through a fuzz-only door.
fuzzing = ["server"]

[dependencies]
# Always compiled — the wire schema shared with the client.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

# Server-only.
axum = { version = "0.8", optional = true }
futures = { version = "0.3", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "time"], optional = true }
async-trait = { version = "0.1", optional = true }
subtle = { version = "2", optional = true }
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3", optional = true }
tracing = { version = "0.1", optional = true }
vmcell = { path = "../vmcell", version = "0.23.0", features = ["cloud-hypervisor", "metrics", "pipeline", "cli"], optional = true }

[package.metadata.cargo-machete]
# False positive: async-trait is a proc-macro used via #[async_trait]
# (launcher.rs/server.rs/registry.rs) — not a path-referenced crate.
ignored = ["async-trait"]

[dev-dependencies]
# `test-util` is what lets the periodic sweeper's SCHEDULER be gated: `#[tokio::test(start_paused =
# true)]` runs its cadence on a virtual clock, so a 300-second interval is exercised in microseconds
# instead of being the one part of the feature no test executes.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
