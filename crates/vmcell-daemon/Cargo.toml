[package]
name = "vmcell-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "vmcell control-plane daemon library: artifact store, cross-process VM registry, and the HTTP REST API (v21 §D)"
publish = false

# The daemon library carries the well-tested logic; `vmcelld` is the thin blessed binary wrapper
# (v21 §D1.1). The `client` consumer (`vmcell-daemon-client`) sets `default-features = false` to link
# ONLY the wire DTOs + the artifact-name predicate (serde + std), never the axum/vmcell server stack —
# so the wire schema is single-sourced without the client pulling the whole server (v21 §D1.1).
[lib]
name = "vmcell_daemon"
path = "src/lib.rs"

[features]
default = ["server"]
# The full daemon: axum router + handlers, VM registry, auth, and the vmcell host stack.
server = [
    "dep:axum",
    "dep:tower",
    "dep:tokio",
    "dep:async-trait",
    "dep:subtle",
    "dep:sha2",
    "dep:tempfile",
    "dep:tracing",
    "dep:vmcell",
    "dep:vmcell-privilege",
]

[dependencies]
# Always compiled — the wire schema shared with the client.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Server-only.
axum = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"], optional = true }
async-trait = { version = "0.1", optional = true }
subtle = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
tracing = { version = "0.1", optional = true }
vmcell = { path = "../vmcell", version = "0.5.0", features = ["cloud-hypervisor", "metrics", "pipeline", "cli"], optional = true }
vmcell-privilege = { path = "../vmcell-privilege", version = "0.1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"
