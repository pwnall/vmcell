[package]
name = "vmcell-kernel-builder"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Builds a guest kernel (download + configure + compile) inside a vmcell builder micro-VM"
publish = false

[lib]
name = "vmcell_kernel_builder"
path = "src/lib.rs"

[dependencies]
# The in-VM builder drives a vmcell builder micro-VM (MicroVm/VmConfig/agent) and reuses
# vmcell's shared build utilities (the OCI builder-base packer, the HttpClient seam, the
# blake3 hash helpers). It needs the host stack: a backend, metrics, and the pipeline.
vmcell = { path = "../vmcell", version = "0.6.0", features = ["cloud-hypervisor", "metrics", "pipeline"] }
async-trait = "0.1.89"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time"] }
tracing = "0.1"
tempfile = "3"
sha2 = "0.10"
blake3 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
