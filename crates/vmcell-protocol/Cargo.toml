[package]
name = "vmcell-protocol"
# 0.2 → 0.3: intentional breaking change — `Message::Resync` gained an `ipv4` field and
# `Message::ResyncAck` gained `ip_applied` (H-VMM-1 guest-IP rotation on restore), plus a
# new `Ipv4Reconfig` type. A 0.x minor bump is the SemVer slot for a pre-1.0 break.
# 0.3 → 0.4: additive interactive-session layer (design 62 §22) — eight append-only
# channelized `Message` variants (`OpenSession`…`SessionExit`) plus `SessionId`/`SessionSpec`/
# `PtyConfig`. Additive on a `#[non_exhaustive]` enum, but a minor bump keeps the shared-crate
# version legible across the host and guest.
# 0.4 → 0.5: additive — `GUEST_TOOLS_APPLETS`, the one guest-tools multicall applet roster. It is
# not wire vocabulary; it lives here because this is the only crate the host `vmcell` lib and the
# guest `vmcell-guest-tools` binary both link, which is what lets the dispatch table and
# `rootfs_injection_manifest` DERIVE from one list instead of restating it (design §4.4). The names
# and their order are unchanged (`ip`, `curl`, `kvm-ok`, `echo-server`), so nothing injected into the
# rootfs moves — but the guest-tools closure hash does, so the rootfs re-bakes. `vmcell-guest-tools`
# is a THIRD dependent as of this bump; guest → shared is the same edge `vmcell-steward` already
# has, not the forbidden `vmcell` → guest one.
# 0.5 → 0.6: `GUEST_TOOLS_APPLETS` GROWS — `mini-init` joins it (v33 §18 delta 5, §3.5). Unlike the
# 0.4 → 0.5 entry above, whose "the names and their order are unchanged" sentence this one retires,
# the roster's contents move: the rootfs gains a `/vmcell-tools/mini-init` symlink, the guest-tools
# dispatch table gains an arm (a COMPILE error until it does), and the validator's `rootfs.guest_tools`
# probe grows a `command -v` clause — which means **a rootfs packed before this bump fails that check
# until it is re-packed** (`vmcell build --kernel-source host-make`). `mini-init` is the smallest
# generic init that starts the steward as a service, and it exists because live-validating the
# `Service` placement requires an init that is not the steward and neither the pinned base nor CI
# can supply one (the law-G1 defense recorded in §3.5).
# 0.6 → 0.7: `GUEST_TOOLS_APPLETS` GROWS AGAIN — `xattr` joins it (v33 §18 delta 7, §4.7). Same
# consequences as the 0.5 → 0.6 entry above, for the same mechanical reasons: the rootfs gains a
# `/vmcell-tools/xattr` symlink, the guest-tools dispatch table gains an arm (a COMPILE error until
# it does), the closure hash moves so the rootfs re-bakes, and **a rootfs packed before this bump
# fails the validator's `rootfs.guest_tools` check until it is re-packed**
# (`vmcell build --kernel-source host-make`). `xattr get <path> <name>` / `xattr list <path>` is
# read-only and calls `getxattr(2)`/`listxattr(2)` directly: delta 7's whole claim is that a
# `Preserve` artifact's xattrs survive into the guest, and that is only assertable by reading one
# back IN-guest. There is deliberately no `set` — a write primitive in a test guest with no gate
# behind it is surface for nothing.
# 0.7 → 0.8: additive, and NOT wire vocabulary — the two host→guest kernel-cmdline TUNING TOKENS join
# `GUEST_TOOLS_APPLETS` and `STEWARD_VSOCK_PORT` as agreements kept here because this is the one crate
# both sides link (docs/90 G7).
#   * ADDITIVE: `TuningToken` (`token` / `default` / `floor` / `ceiling`, plus `render` and the three
#     `*_ms` accessors) and the two consts `STEWARD_ACCEPT_POLL` (`vmcell_accept_poll_ms=`) and
#     `STEWARD_REBIND_IDLE` (`vmcell_rebind_idle_ms=`). Each token's spelling, the value BOTH sides
#     fall back to, and the window the guest clamps an arriving value into are one agreement, so they
#     travel as one value.
#   * WHY, because the defect is invisible by construction: the two tokens were hand-spelled on both
#     sides of the process boundary — one literal in `vmcell`'s cmdline builder, a second copy in
#     `vmcell-steward`'s parser — with no shared const, since `vmcell` does not depend on the steward.
#     Re-spell either and nothing goes red: the guest falls back to its compiled cadence, which was
#     *coincidentally* the number the host meant to send. Renaming is a compile error on both sides at
#     once now.
#   * NOTHING MOVES for either side: same token spellings (pinned as literals — the parser is baked
#     into `rootfs.erofs`, so re-spelling one silently loses the channel against every already-packed
#     image), same defaults (20 ms / 250 ms), same floors (1 ms / 20 ms). `vmcell`'s emitted kernel
#     command line is byte-identical and `vmcell-steward`'s `ACCEPT_POLL` / `REBIND_IDLE` keep their
#     names, types and values, derived from `.default` instead of re-typed.
#   * The applet roster is UNCHANGED on this edge, so — unlike 0.4 → 0.5, 0.5 → 0.6 and 0.6 → 0.7 —
#     no rootfs FAILS the validator's `rootfs.guest_tools` check. It does re-bake once: this
#     manifest and `Cargo.lock` are both folded into `steward_closure_hash` /
#     `guest_tools_closure_hash`, which any version bump in the workspace moves.
version = "0.8.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Framed postcard wire protocol shared by the vmcell host and the steward"
publish = false

[lib]
name = "vmcell_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
