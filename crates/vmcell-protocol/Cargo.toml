[package]
name = "vmcell-protocol"
# 0.2 → 0.3: intentional breaking change — `Message::Resync` gained an `ipv4` field and
# `Message::ResyncAck` gained `ip_applied` (H-VMM-1 guest-IP rotation on restore), plus a
# new `Ipv4Reconfig` type. A 0.x minor bump is the SemVer slot for a pre-1.0 break.
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Framed postcard wire protocol shared by the vmcell host and the guest agent"
publish = false

[lib]
name = "vmcell_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
