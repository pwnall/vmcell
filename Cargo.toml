[workspace]
resolver = "2"
members = [
    "crates/vmcell",
    # The two secondary VMM backends, extracted out of `vmcell` so the core library carries only the
    # primary Cloud Hypervisor backend. Each depends on `vmcell` (shared `Vmm` trait + helpers);
    # `vmcell` has no production edge back (only a dev-dep, for the matrix tests).
    "crates/vmcell-firecracker",
    "crates/vmcell-qemu",
    # vmcell-crosvm: a third secondary backend (crosvm, the ChromeOS Rust VMM). Like the FC/QEMU
    # crates it depends on `vmcell` (shared `Vmm` trait + jail/seccomp/spawn helpers); `vmcell` has
    # no production edge back (only a dev-dep, for the matrix tests). crosvm is driven purely as an
    # external binary, so this crate carries no serde/JSON.
    "crates/vmcell-crosvm",
    # The cross-backend benchmark harness (the `bench-vm` binary); wires all backends, so like
    # `vmcell-cli` it lives outside the `vmcell` package to keep the dependency graph acyclic.
    "crates/vmcell-bench",
    "crates/vmcell-protocol",
    "crates/vmcell-steward",
    "crates/vmcell-test-runner",
    "crates/vmcell-guest-tools",
    # v20 §5.4/§8.5: the two in-VM builders, extracted out of `vmcell`. Each depends on
    # `vmcell` (to drive a builder micro-VM + reuse its shared build utilities); `vmcell`
    # has no edge back to them. `vmcell-cli` is the composition root that wires all three,
    # kept out of the `vmcell` package so the dependency graph stays acyclic.
    "crates/vmcell-rootfs-builder",
    "crates/vmcell-kernel-builder",
    "crates/vmcell-cli",
    # Boots test micro-VMs to validate a candidate kernel+rootfs pair against the whole
    # artifact↔system contract (§4.3/§5.4/§13); depends on `vmcell`, reuses its integration
    # checks. `vmcell`'s tests dev-depend on it (a permitted dev-dep cycle).
    "crates/vmcell-artifact-validator",
    # v21 §D1.1: the control-plane daemon and its client. `vmcell-privilege` is the lean shared
    # capability/blessing crate (also linked by `vmcell-test-runner`). The daemon library owns the
    # artifact store + VM registry + HTTP API; `vmcelld` is its blessed binary. The client library
    # mirrors the vmcell entry points over HTTP; `vmcelld-ctl` is its CLI. `vmcell` has no edge to
    # any of these — the daemon depends on `vmcell`, never the reverse.
    "crates/vmcell-privilege",
    # v24 §20.5: the setup broker — a minimal privileged spawn helper that holds the three caps and
    # performs netns/tap/nft/cgroup setup + the jailed VMM spawn for a cap-dropped parent (the
    # daemon/API mode's privilege boundary). Depends on `vmcell` (net/metrics subset) +
    # `vmcell-privilege`; NEVER the daemon's web stack. `vmcell` has no edge to it.
    "crates/vmcell-broker",
    "crates/vmcell-daemon",
    "crates/vmcelld",
    "crates/vmcell-daemon-client",
    "crates/vmcelld-ctl",
]

# The cargo-fuzz crate is NOT a workspace member: libfuzzer-sys only builds under `cargo fuzz` on
# nightly, so keeping it out means `cargo build --workspace` / nextest / doc / hack (all stable, all
# --locked) never try to compile it. The nightly `fuzz.yml` job drives it via `cargo fuzz` directly.
#
# `examples/downstream-kernel` is excluded for the same structural reason, not a toolchain one
# (v30 §18 delta 5): it is the out-of-tree CONSUMER workspace — its own `[workspace]` root, its own
# Cargo.lock, its own `[patch.crates-io]` — and the whole point is that it resolves and builds the
# way a git-dep consumer's workspace does. Pulling it in as a member would unify its features and
# lockfile with vmcell's and silently repair exactly the drift it exists to detect.
exclude = ["fuzz", "examples/downstream-kernel"]

[workspace.package]
# The single MSRV fact: the tested floor, tracking the latest stable (1.96.1). Understating it is a
# live vulnerability path (see clippy.toml's msrv comment). Every member inherits it via
# `rust-version.workspace = true`, and the `just ci` sync assertion keeps it equal to
# rust-toolchain.toml's pinned channel.
rust-version = "1.96.1"

# Carried patch: QEMU-unprivileged vhost-user only (relaxes a PROTOCOL_FEATURES check on
# SET_VRING_ENABLE that QEMU sends before SET_FEATURES finalizes). Lives at the workspace root
# (v15 §10.1) so it applies to every member that links vhost / vhost-user-backend.
[patch.crates-io]
vhost-user-backend = { path = "vendor/vhost-user-backend" }
vhost = { path = "vendor/vhost" }
