[package]
name = "imp-testing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Micro-VM-per-test integration & evaluation platform for the Imp agentic harness"
publish = false

[lib]
name = "imp_testing"
path = "src/lib.rs"

[[bin]]
name = "imp-testing"
path = "src/bin/imp-testing.rs"
required-features = ["cli"]

[[bin]]
name = "imp-guest-agent"
path = "src/bin/imp-guest-agent.rs"
required-features = ["agent"]

[[bin]]
name = "imp-test-runner"
path = "src/bin/imp-test-runner.rs"
required-features = ["test-runner"]

[dependencies]
# unconditional shared core
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"

# host common
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "signal"] }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tokio-vsock = { version = "0.7", optional = true }
nix = { version = "0.29", optional = true, features = ["mount", "sched", "process", "signal", "user"] }
uuid = { version = "1", optional = true, features = ["v4"] }
which = { version = "6", optional = true }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }
libc = { version = "0.2", optional = true }

# CH client
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["client", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", optional = true }
hyperlocal = { version = "0.9", optional = true }
serde_json = { version = "1", optional = true }

# QEMU
qapi = { version = "0.14", optional = true, features = ["qmp", "qga", "async-tokio"] }

# Net
rtnetlink = { version = "0.14", optional = true }
netns-rs = { version = "0.1", optional = true }
tun-tap = { version = "0.1", optional = true }
ipnet = { version = "2", optional = true }


# Proxy
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rcgen = { version = "0.13", optional = true }
rustls-pemfile = { version = "2", optional = true }
hudsucker = { version = "0.23", optional = true }

# Metrics
cgroups-rs = { version = "0.3", optional = true }
procfs = { version = "0.16", optional = true }

# Pipeline
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
pgp = { version = "0.14", optional = true }
sha2 = { version = "0.10", optional = true }
blake3 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
lzma-rs = { version = "0.3", optional = true }
zstd = { version = "0.13", optional = true }
reflink-copy = { version = "0.1", optional = true }
walkdir = { version = "2", optional = true }
toml = { version = "0.8", optional = true }
tempfile = { version = "3", optional = true }

# CLI
clap = { version = "4", optional = true, features = ["derive"] }
anyhow = { version = "1", optional = true }

# Guest agent
vsock = { version = "0.5", optional = true }
rustix = { version = "0.38", optional = true, features = ["fs", "mount", "process"] }
capctl = { version = "0.2.4", optional = true }
signal-hook = { version = "0.3", optional = true }
fuse-backend-rs = { version = "0.14.0", optional = true }
vhost = { version = "0.16.0", optional = true }
vhost-user-backend = { version = "0.22.0", optional = true }
virtio-queue = { version = "0.17.0", optional = true }
vmm-sys-util = { version = "0.15.0", optional = true }
vm-memory = { version = "=0.17.1", optional = true }
virtio-bindings = { version = "0.2.7", optional = true }
smoltcp = { version = "0.11.0", optional = true, features = ["std", "log", "medium-ethernet", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4", "phy-tuntap_interface"] }
log = "0.4"
jip-nftables = { version = "0.1.0", optional = true }
am-fs-erofs = { version = "0.1.1", optional = true }
async-trait = { version = "0.1.89", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
log = "0.4"
axum = "0.7"
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"
tracing-test = "0.2"
proptest = "1"
env_logger = "0.11"

[features]
experiment-fuse = ["fuse-backend-rs/vhost-user-fs", "dep:vhost", "dep:vhost-user-backend", "dep:virtio-queue", "dep:vmm-sys-util", "dep:vm-memory", "vm-memory/backend-mmap", "vm-memory/backend-atomic", "dep:virtio-bindings"]
default = ["cloud-hypervisor", "net-privileged", "net-rootless", "proxy", "metrics", "pipeline", "cli"]

host-common = [
    "dep:tokio", "dep:futures", "dep:bytes",
    "dep:tracing", "dep:tracing-subscriber",
    "dep:tokio-vsock", "dep:nix", "dep:uuid", "dep:which",
    "dep:tokio-util", "dep:async-trait", "dep:libc",
]

cloud-hypervisor = ["host-common", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyperlocal", "dep:serde_json"]
firecracker = ["host-common", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyperlocal", "dep:serde_json"]
qemu = ["host-common", "dep:qapi", "dep:serde_json"]

net-privileged = ["host-common", "dep:rtnetlink", "dep:netns-rs", "dep:tun-tap", "dep:ipnet"]
experiment-nftables = ["net-privileged", "dep:jip-nftables"]
net-rootless = ["host-common", "dep:smoltcp", "dep:vhost", "dep:vhost-user-backend", "dep:virtio-queue", "dep:vmm-sys-util", "dep:vm-memory", "vm-memory/backend-mmap", "vm-memory/backend-atomic", "dep:virtio-bindings"]

proxy = ["host-common", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:rustls-pemfile", "dep:hudsucker"]
proxy-hudsucker = ["proxy"]

metrics = ["host-common", "dep:cgroups-rs", "dep:procfs"]

pipeline = [
    "host-common",
    "dep:reqwest", "dep:pgp", "dep:sha2", "dep:blake3",
    "dep:tar", "dep:flate2", "dep:lzma-rs", "dep:zstd",
    "dep:reflink-copy", "dep:walkdir", "dep:toml", "dep:tempfile",
    "dep:am-fs-erofs",
]

cli = ["host-common", "dep:clap", "dep:anyhow", "dep:serde_json"]

agent = ["dep:vsock", "dep:rustix", "dep:signal-hook"]
test-runner = ["dep:rustix", "dep:capctl", "dep:libc"]
fuse-backend-rs = ["dep:fuse-backend-rs"]
vhost = ["dep:vhost"]
vhost-user-backend = ["dep:vhost-user-backend"]
virtio-queue = ["dep:virtio-queue"]
vmm-sys-util = ["dep:vmm-sys-util"]
vm-memory = ["dep:vm-memory"]
virtio-bindings = ["dep:virtio-bindings"]
jip-nftables = ["dep:jip-nftables"]
am-fs-erofs = ["dep:am-fs-erofs"]
