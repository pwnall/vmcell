name: hosted-kvm-probe

# TEMPORARY, manual-only. Answers one question with evidence instead of assumption: can a
# GitHub-HOSTED ubuntu runner carry vmcell's integration matrix? The matrix needs, at minimum,
# an openable /dev/kvm, a delegated cgroup subtree, unprivileged user namespaces, root via sudo for
# `just bless`, and enough disk to build a kernel and a rootfs. Each is probed and REPORTED rather
# than asserted, so one run produces the whole picture instead of failing at the first gap.
#
# Delete this workflow once the question is settled — it exists to be read, not to gate anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }

      - name: host shape (cores, RAM, disk, kernel, image)
        run: |
          echo "runner image: ${ImageOS:-?} / ${ImageVersion:-?}"
          uname -a
          nproc; free -h; df -h / /mnt 2>/dev/null || true
          echo "--- virtualisation flags ---"
          grep -oE '\b(vmx|svm|hypervisor)\b' /proc/cpuinfo | sort -u || echo "none"

      - name: /dev/kvm before any intervention
        run: |
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "ABSENT: /dev/kvm does not exist"; fi
          echo "--- can THIS user open it read-write? ---"
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "openable: yes"; else echo "openable: no"; fi
          echo "--- kvm modules ---"
          lsmod | grep -E '^kvm' || echo "no kvm module loaded"
          cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || echo "kvm_intel.nested: n/a"
          cat /sys/module/kvm_amd/parameters/nested 2>/dev/null || echo "kvm_amd.nested: n/a"

      - name: /dev/kvm after the documented udev fix
        run: |
          # The recipe every Android-emulator workflow uses. If /dev/kvm exists but is root-only,
          # this is what makes it usable without changing the job's identity.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "still ABSENT"; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "openable after fix: YES"; else echo "openable after fix: no"; fi

      - name: can a VM actually boot? (the only answer that counts)
        run: |
          # Device nodes and CPU flags are proxies. Booting something is not.
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 >/dev/null
          qemu-system-x86_64 -accel kvm -nographic -no-reboot -m 128 \
            -kernel /boot/vmlinuz-"$(uname -r)" -append "console=ttyS0 panic=1" \
            -serial mon:stdio </dev/null > /tmp/qemu.log 2>&1 &
          pid=$!
          sleep 25; kill "$pid" 2>/dev/null || true
          echo "--- first 40 lines of guest console ---"
          head -40 /tmp/qemu.log
          if grep -qiE 'kvm|Linux version' /tmp/qemu.log; then echo "VERDICT: qemu ran"; fi
          grep -qi 'could not access KVM kernel module\|failed to initialize KVM' /tmp/qemu.log \
            && echo "VERDICT: KVM ACCELERATION UNAVAILABLE" || echo "VERDICT: kvm accel accepted"

      - name: cgroup delegation (the privileged + daemon suites need a writable subtree)
        run: |
          cat /proc/self/cgroup
          base=$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)
          echo "base=$base"
          ls -ld "/sys/fs/cgroup${base}" || true
          probe="/sys/fs/cgroup${base}/vmcell-probe-$$"
          if mkdir "$probe" 2>/dev/null; then echo "DELEGATED: can create a sub-cgroup"; rmdir "$probe"; else echo "NOT DELEGATED: mkdir refused"; fi
          echo "--- is a systemd user session available? ---"
          systemctl --user is-system-running 2>&1 | head -2 || echo "no user manager"
          systemd-run --user --scope -p Delegate=yes true 2>&1 | head -3 || echo "systemd-run --user unavailable"
          echo "--- as root? ---"
          sudo systemd-run --scope -p Delegate=yes --quiet true 2>&1 | head -3 && echo "sudo systemd-run scope: ok"

      - name: namespaces, capabilities, and the blessing path
        run: |
          echo "unprivileged userns: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
          echo "apparmor userns restrict: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          unshare -Urn true 2>&1 && echo "unshare -Urn: ok" || echo "unshare -Urn: BLOCKED"
          echo "--- setcap (just bless) ---"
          sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: NO"
          printf '#!/bin/sh\ntrue\n' > /tmp/capprobe; chmod +x /tmp/capprobe
          sudo setcap cap_net_admin,cap_sys_admin,cap_dac_override,cap_setpcap=ep /tmp/capprobe \
            && getcap /tmp/capprobe && echo "setcap: ok" || echo "setcap: FAILED"
          echo "--- filesystem the artifacts dir would live on (reflink/CoW for zygote) ---"
          stat -f -c '%T' . ; stat -f -c '%T' /tmp

      - name: backend binaries available?
        run: |
          for b in cloud-hypervisor firecracker qemu-system-x86_64 crosvm virtiofsd; do
            printf '%-22s ' "$b"; command -v "$b" || echo "ABSENT"
          done
          apt-cache policy qemu-system-x86 2>/dev/null | head -3 || true
