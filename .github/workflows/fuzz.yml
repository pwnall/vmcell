name: fuzz-nightly

# Non-blocking by construction: it is scheduled (gates no PR), but a red run is visible on the
# Actions tab and any crash uploads its reproducer.
#
# ROSTER — 17 targets, grouped by WHO SUPPLIES THE BYTES, which is the only grouping that ranks
# them. Every target file states its own trust boundary, the production precondition it mirrors and
# the buggy implementation it was driven red against; this index does not restate that reasoning.
# `cargo fuzz list` auto-discovers every `[[bin]]`, so a new target runs with no workflow edit — but
# this prose index CAN go stale, which is why GUARD 5 asserts the roster against the tree in both
# directions rather than against anything written here.
#
#   GUEST -> HOST — bytes a booted VM controls; the boundary vmcell exists to hold
#     protocol_decode            framed postcard `Message`, the steward wire (rubric B10)
#     protocol_message_render    `capped_debug` over a decoded `Message`; an uncapped render is a
#                                flood written into the persisted serial-console artifact
#     egress_host_blocklist      the deny-list matcher over the guest's own `Host` header / URI
#                                authority — a label-boundary miss is an egress-filter bypass
#     validator_classify_serial  the console classifier over guest-owned `/dev/console` text;
#                                downstream contract surface, so a panic is consumer-visible
#     validator_kconfig_parse    the `.config` sidecar parser, also reached from an in-guest
#                                `zcat /proc/config.gz`; likewise contract surface
#
#   REMOTE REST CLIENT -> vmcelld — off-host HTTP
#     daemon_auth_bearer         `authorize`/`extract_bearer`, parsed with NO credential presented:
#                                the one target on the pre-authentication path
#     daemon_artifact_name       `resolve_artifact_path`, the single client-name -> path law (P3)
#     daemon_create_vm_dto       the three `Json<T>` request bodies, incl. their presence attributes
#     kernel_cmdline_args        `extra_kernel_args` -> `is_reserved_cmdline_arg` -> the guest kernel
#                                command line (F3); the kernel applies duplicate keys in order
#
#   CROSS-PRIVILEGE — the cap-dropped HTTP parent <-> the cap-HOLDING broker child (P2)
#     broker_frame               parent -> child, framed postcard `BrokerRequest`: a panic here is a
#                                crash in the process still holding the three caps
#     broker_reply_frame         child -> parent, framed postcard `BrokerReply` — the other
#                                direction, per AGENTS.md's both-directions rule
#     daemon_bridge_frame        the JSON engine bridge, both arms, incl. the permissive id-recovery
#                                decode that re-parses the same hostile bytes a second time
#
#   THIRD-PARTY IMAGE — an OCI registry's bytes; a digest pin fixes WHICH bytes arrive, not WHOSE
#     oci_layer_tar              tar layer -> `tar_to_erofs`, the merged tree that becomes the rootfs
#     oci_layer_zstd             the zstd arm — the only LINKED C parser in the tree that sees
#                                off-host bytes (that file records what ASan does and does not cover
#                                there: cargo-fuzz sets no CFLAGS, so libzstd is uninstrumented)
#
#   LOCAL BUILD CONFIG — contract surface, not a remote boundary
#     injection_dest             the F5 injection-dest law; ranked for its real evasion history
#                                (`/usr/sbin/./vmcell-steward`, `/opt/.`), not for remote reach
#     feature_manifest           the F6 feature-manifest sidecar parser; ranked because ABSENCE is
#                                the silent direction — a typo'd declaration that read as
#                                "unsupported" would pass every downstream check
#     registry_entry             the F7 artifact-registry entry parsers (`rootfs`/`handlers`),
#                                driven through the pins overlay's strict parse and the merge, so
#                                the legacy-singleton reject and the sanitized-filename collision
#                                reject are in scope beside the per-entry shape/digest rules
#
# ADDING A TARGET: land it in BOTH `fuzz/fuzz_targets/<name>.rs` and a `[[bin]]` stanza in
# `fuzz/Cargo.toml` — GUARD 5 fails the job loudly if either is missing, because a target file
# without its stanza is invisible to `cargo fuzz list` and is silently never fuzzed. State the trust
# boundary and the mirrored production precondition in the file, add a line to the index above, and
# re-read the budget arithmetic at GUARD 6 before assuming the window is free. Per AGENTS.md, build
# the buggy implementation the target guards and confirm it goes red: a no-panic assertion over a
# function that is total by construction is this repo's "reports success while covering nothing"
# defect in fuzz-target form, so prefer a property, and check the property is reachable at
# libFuzzer's default `-max_len` — several targets here needed a committed seed corpus to be able to
# fail at all. `fuzz/.gitignore`'s re-include rules are the seed roster; do not restate the count
# here, because a second copy of it was wrong within a day of being written.
#
# RETIRED, not outstanding: this header used to ask for a "CH REST/chunked response" target. There
# is no vmcell-authored HTTP response parser to point one at — `unix_api_request_with` hands the
# socket to `hyper`, and vmcell touches only `res.status()` and `from_utf8_lossy` on the collected
# error body — so the request is withdrawn rather than left standing as permanent unmet debt.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # DERIVED from FUZZ_BUDGET_CEILING_SECONDS below: 240 min of fuzzing + 90 min for checkout, the
    # from-source cargo-fuzz build, the 17 per-target builds and the upload. Keep the two in step —
    # a timeout under the ceiling would kill healthy runs GUARD 6 had already approved, and one at or
    # above GitHub's 360 min would never fire at all.
    #
    # This exists for the HANG, which GUARD 6 cannot see: GUARD 6 projects
    # `roster_count * FUZZ_SECONDS` and refuses a roster that would overrun, but it projects what
    # libFuzzer is ASKED to do. A target that ignores `-max_total_time` — an infinite loop in a
    # harness, a parser that blocks on a lock or a socket — is not in that projection, and without
    # this the job would sit until GitHub's own 360 min kill, which reports as an opaque platform
    # cancellation with no step attribution. Failing at OUR bound instead names the step that hung.
    # The repo is public, so runner minutes are free and unmetered; this is about getting an
    # actionable failure, not about cost.
    timeout-minutes: 330
    env:
      # `rust-toolchain.toml` pins channel 1.98.0, and a toolchain FILE outranks `rustup default`,
      # which is all `dtolnay/rust-toolchain@nightly` sets. So every run of this workflow since it
      # landed (41/41, from 2026-07-05) invoked `cargo fuzz` on STABLE rustc and died on
      # `-Zsanitizer=address` before building a single target — the workflow has never fuzzed
      # anything. `RUSTUP_TOOLCHAIN` is the env-var override, which outranks the file.
      RUSTUP_TOOLCHAIN: nightly
      # The per-target fuzzing window, named ONCE for the whole job. Two steps need it — the
      # preflight to project the total budget (GUARD 6), the run loop to pass `-max_total_time` and
      # to derive its did-it-actually-run floor — and two literals would drift. The reasoning behind
      # the value, and behind keeping it FIXED as the roster grows, is at GUARD 6.
      FUZZ_SECONDS: "300"
      # The wall-clock ceiling GUARD 6 holds the projected fuzz loop under: 240 min. GitHub's
      # per-job limit is 360 min, so this leaves 2 h of headroom for checkout, the cargo-fuzz source
      # build, the per-target builds and the reproducer upload.
      FUZZ_BUDGET_CEILING_SECONDS: "14400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb  # nightly branch
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f  # v2.86.4
        # `fallback: cargo-install` is load-bearing — do not drop it back to the default. This pin
        # ships NO manifest for cargo-fuzz ("install-action does not support cargo-fuzz … fallback
        # to cargo-binstall" appears in every run log), and the DEFAULT fallback is cargo-binstall,
        # which silently fetched a prebuilt x86_64-unknown-linux-MUSL cargo-fuzz onto this gnu
        # runner. `cargo fuzz`'s `--target` defaults to the triple its OWN BINARY was compiled for,
        # so that musl binary passed `--target x86_64-unknown-linux-musl` to every fuzz build and
        # produced `error: sanitizer is incompatible with statically linked libc` plus
        # `error[E0463]: can't find crate for 'core'` — cause 2 of the 41-run drought. A silent
        # substitution that changes the built-for platform is the same hazard class `fallback: none`
        # already guards in ci.yml.
        # `cargo-install` builds cargo-fuzz from source with the runner's own toolchain, so the
        # binary is host-native and its baked-in default equals the host BY CONSTRUCTION (verified:
        # `cargo install --locked cargo-fuzz` on a gnu host yields a binary reporting
        # `--target … [default: x86_64-unknown-linux-gnu]`; the binstall musl build reported musl).
        # It also stops install-action forwarding `github.token`, which action.yml hands to the
        # cargo-binstall fallback only — the supply-chain reasoning behind ci.yml's `fallback: none`.
        # NOT `none`: with no manifest, `none` aborts the job and fuzzes nothing at all.
        # This is defence in depth, not the fix. The fix is the explicit `--target` below, asserted
        # against the artifacts the build actually produced, so even a substituted cargo-fuzz cannot
        # choose the platform.
        with: { tool: "cargo-fuzz", fallback: cargo-install }

      - name: preflight (toolchain, target, roster, budget) + build every fuzz target
        id: preflight
        run: |
          set -euo pipefail
          # Everything cheap and named runs BEFORE anything that costs minutes. Both causes of the
          # 41-run drought were one-line config errors that only announced themselves deep inside a
          # per-target build, as a rustc error wall nobody read. Each guard below states the defect
          # it exists to prevent, costs about a second, and names its own cause.

          # GUARD 1 — the toolchain override (cause 1, the RUSTUP_TOOLCHAIN env note above).
          # Read into a variable instead of `rustc -vV | grep -q`: under `set -o pipefail` a
          # short-circuiting `grep -q` can surface the pipeline as SIGPIPE and redden a healthy run.
          rustc_release=$(rustc -vV | sed -n 's/^release: //p')
          case "${rustc_release}" in
            *-nightly) ;;
            *)
              echo "::error::effective rustc is not nightly (release: ${rustc_release:-<unreadable>}) — cargo fuzz cannot build; the RUSTUP_TOOLCHAIN override regressed (rust-toolchain.toml outranks \`rustup default\`)"
              exit 1
              ;;
          esac

          # GUARD 2 — the build target (cause 2). `cargo fuzz`'s `--target` defaults to the triple
          # its own binary was COMPILED for, not the one rustc targets, and nothing in this repo
          # requests musl (no `.cargo/`, no CARGO_BUILD_TARGET, no musl in any manifest). Derive the
          # target from rustc's own host line and pass it explicitly to every build below, so the
          # fuzz build always targets the platform this toolchain actually has std and sanitizer
          # support for — never the platform the cargo-fuzz binary happened to be built for.
          # A derivation that resolves to nothing is an error, not an empty `--target`.
          fuzz_target=$(rustc -vV | sed -n 's/^host: //p')
          if [ -z "${fuzz_target}" ]; then
            echo "::error::could not read a host triple out of \`rustc -vV\` — the fuzz build target is undeterminable; refusing to fall back to cargo-fuzz's baked-in default (that default is what built for musl for 41 runs). Full output: $(rustc -vV | tr '\n' ' ')"
            exit 1
          fi
          echo "FUZZ_TARGET=${fuzz_target}" >> "${GITHUB_ENV}"
          echo "fuzz target: ${fuzz_target} (rustc host)"

          # GUARD 3 — statically linked libc is fundamentally incompatible with the sanitizer
          # cargo-fuzz enables by default, which is the first error the musl runs printed. It stays
          # true even when std IS installed for the target, so it is checked before GUARD 4.
          target_cfg=$(rustc --print cfg --target "${fuzz_target}")
          if grep -q '^target_feature="crt-static"$' <<<"${target_cfg}"; then
            echo "::error::fuzz target ${fuzz_target} links libc statically (target_feature=\"crt-static\"); \`error: sanitizer is incompatible with statically linked libc\` is the exact failure that produced 0 fuzzed bytes for 41 runs. Fuzzing needs a dynamically linked target."
            exit 1
          fi

          # GUARD 4 — std for the target must actually be installed, or every fuzz build dies with
          # `error[E0463]: can't find crate for 'core'` after minutes of setup. `--build-std` is on
          # by default in cargo-fuzz, but it still needs the target's std sources/rlibs present.
          if ! target_libdir=$(rustc --print target-libdir --target "${fuzz_target}" 2>&1); then
            echo "::error::rustc does not know target ${fuzz_target}: ${target_libdir}"
            exit 1
          fi
          if ! compgen -G "${target_libdir}/libcore-*.rlib" > /dev/null; then
            echo "::error::no std/core rlibs under ${target_libdir} — the ${fuzz_target} target is not installed for this toolchain, so every fuzz build would fail with \`can't find crate for 'core'\`. Install it (rustup target add ${fuzz_target}) or fix the toolchain."
            exit 1
          fi

          # GUARD 5 — the roster. An empty target list is the silent-green failure mode of a
          # discovery loop: `cargo fuzz list` auto-discovers every `[[bin]]`, so a renamed fuzz dir
          # or a mangled list would run zero targets and exit 0, reporting a fuzz run that fuzzed
          # nothing. The roster INDEX at the top of this file is prose and can go stale; the
          # three-way agreement below is the fact, so nothing here is checked against that list.
          # It is asserted HERE, before the build and the loop, so a broken roster costs a second
          # rather than a whole job.
          # `cargo fuzz list` is NOT in the CARGO_TERM_COLOR class, checked rather than assumed:
          # this workflow sets no such env, and the list prints through cargo-fuzz's own
          # `list_targets()`, not cargo's renderer. It also has no `--color` flag to add — its only
          # option is `--fuzz-dir` — so "defensively" passing one would abort here and fuzz nothing.
          roster="${RUNNER_TEMP}/fuzz-targets.txt"
          if ! cargo fuzz list > "${roster}"; then
            echo "::error::\`cargo fuzz list\` failed; the target roster is unknown and nothing was fuzzed"
            exit 1
          fi
          roster_count=$(grep -c . "${roster}" || true)
          if [ "${roster_count:-0}" -lt 1 ]; then
            echo "::error::cargo fuzz list produced ${roster_count:-0} target(s); a discovery loop that runs nothing must not report success."
            exit 1
          fi
          # The floor is DERIVED from the tree, not restated as a literal. A hardcoded `-lt 2` is
          # only ever right until the day a third surface lands, and it cannot see the failure that
          # actually matters here: a target added as a FILE without its `[[bin]]` stanza is
          # invisible to `cargo fuzz list`, so the job would fuzz two surfaces, exit 0, and quietly
          # contradict this file's own header claim that "a new target runs with no workflow edit".
          # Both directions are checked, because each is a real one-sided edit:
          #   file without stanza  -> the surface is never fuzzed (silent under-coverage);
          #   stanza without file  -> `cargo fuzz list` names a target that cannot build.
          # This is the same derive-rather-than-restate rule the packer's reserved-path list follows.
          declared=$(grep -c '^\[\[bin\]\]' fuzz/Cargo.toml || true)
          on_disk=$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -type f | wc -l)
          if [ "${roster_count}" -ne "${declared}" ] || [ "${roster_count}" -ne "${on_disk}" ]; then
            echo "::error::fuzz target roster disagrees with the tree: \`cargo fuzz list\` names ${roster_count}, fuzz/Cargo.toml declares ${declared} [[bin]] stanza(s), fuzz/fuzz_targets/ holds ${on_disk} .rs file(s). A target file without its [[bin]] stanza is never fuzzed and the job would still report success."
            echo "  listed:   $(tr '\n' ' ' < "${roster}")"
            echo "  on disk:  $(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -type f -printf '%f ')"
            exit 1
          fi
          echo "roster (${roster_count}, matching ${declared} [[bin]] stanza(s) and ${on_disk} target file(s)): $(tr '\n' ' ' < "${roster}")"

          # GUARD 6 — the RUNTIME BUDGET. Asserted here, in a second, rather than discovered as a
          # platform kill four hours in.
          #
          # THE ARITHMETIC. The loop below is SERIAL and gives every rostered target its own
          # `-max_total_time` window, which `-max_total_time` then actually burns (it has no
          # early-exit path), so wall time is roster_count * FUZZ_SECONDS:
          #     2 targets * 300 s =  10 min   the roster this job shipped with
          #    17 targets * 300 s =  85 min   today, plus ~4 min of build
          #    48 targets * 300 s = 240 min   FUZZ_BUDGET_CEILING_SECONDS, where this guard fires
          #
          # THE DECISION, because the 2 -> 15 expansion forced one. The alternative design is a
          # fixed TOTAL budget divided across the roster (3600 s / 15 = 240 s each at the 15-target
          # roster this argument was written against; the illustration below is that roster's). It bounds
          # wall time for free, and it is REJECTED: it makes every existing target's window a
          # function of how many targets exist, so landing a 16th surface would quietly cut the
          # other 15 from 240 s to 225 s each. Nobody reviewing a diff that adds one fuzz target
          # would see that it weakened fifteen unrelated ones, and no gate would go red — that is
          # exactly this repo's silent-weakening shape, applied to a coverage budget. It also
          # inverts the incentive on a roster we want people to grow: a target should never cost its
          # neighbours coverage. So the PER-TARGET WINDOW IS FIXED and WALL TIME IS LINEAR in the
          # roster. That trade is affordable here specifically because this job is nightly, gates no
          # PR, and cancels its own in-flight run — its cost is runner minutes, not correctness.
          #
          # What linear growth must NOT be allowed to do is walk into GitHub's 360-minute per-job
          # ceiling, and that is a correctness matter rather than a cost one: a job killed at the
          # ceiling has its remaining targets never run AND every later step skipped, so `upload
          # crash reproducers` never executes and a genuine finding from an EARLIER target is
          # destroyed along with the run. Failing loudly here instead costs one night of fuzzing and
          # names the two ways out (shard the roster across a matrix, or lower FUZZ_SECONDS as a
          # deliberate, reviewed change) — neither of which should happen silently.
          budget_seconds=$(( roster_count * ${FUZZ_SECONDS:?} ))
          if [ "${budget_seconds}" -gt "${FUZZ_BUDGET_CEILING_SECONDS:?}" ]; then
            echo "::error::fuzz budget exceeded: ${roster_count} targets * ${FUZZ_SECONDS}s = $(( budget_seconds / 60 )) min of fuzzing, over the $(( FUZZ_BUDGET_CEILING_SECONDS / 60 )) min ceiling (GitHub kills a job at 360 min, which would skip the reproducer upload and destroy any finding from an earlier target). Do NOT fix this by shrinking FUZZ_SECONDS silently — that weakens every existing target at once. Either shard the roster across a job matrix, or lower FUZZ_SECONDS deliberately and say so here."
            exit 1
          fi
          echo "budget: ${roster_count} targets * ${FUZZ_SECONDS}s = $(( budget_seconds / 60 )) min of fuzzing (ceiling $(( FUZZ_BUDGET_CEILING_SECONDS / 60 )) min, room for $(( FUZZ_BUDGET_CEILING_SECONDS / FUZZ_SECONDS )) targets at this window)"

          # Build every target BEFORE the timed loop. A build failure is then reported in seconds
          # with a named cause, instead of surfacing partway into the first target's window and
          # starving the rest. `cargo fuzz run` reuses this exact build (same default BuildOptions),
          # so this front-loads work the loop would do anyway rather than adding any.
          if ! cargo fuzz build --target "${fuzz_target}"; then
            echo "::error::a fuzz target failed to BUILD for ${fuzz_target} — nothing was fuzzed. This is a code or dependency break in the fuzz crate, not a crash finding; there is no reproducer to look for."
            exit 1
          fi

          # GUARD 7 — the effective target, observed rather than assumed. cargo-fuzz lays its
          # binaries down at <fuzz-dir>/target/<triple>/release/<name>, so the triple in that path
          # IS the platform the build actually chose. If a cargo-fuzz whose baked-in default
          # disagrees ever ignores or outranks the `--target` above, the binaries land under a
          # different triple and this fires by name — the musl substitution can never again be
          # discovered as an error wall five minutes into a fuzz window.
          while IFS= read -r t; do
            [ -n "${t}" ] || continue
            if [ ! -x "fuzz/target/${fuzz_target}/release/${t}" ]; then
              echo "::error::fuzz target ${t} was not built for ${fuzz_target} (no executable at fuzz/target/${fuzz_target}/release/${t}). cargo fuzz built for: $(find fuzz/target -mindepth 1 -maxdepth 1 -type d -printf '%f ' 2>/dev/null). \`cargo fuzz --target\` defaults to the triple the cargo-fuzz BINARY was compiled for, so a substituted (e.g. musl-static) cargo-fuzz can pick a platform this toolchain cannot build for."
              exit 1
            fi
          done < "${roster}"
          echo "all ${roster_count} targets built for ${fuzz_target}"

      # Name interpolated from the single `FUZZ_SECONDS` fact rather than restating "5 min", so the
      # window shown in the Actions UI cannot claim one budget while the loop spends another.
      - name: run every fuzz target (${{ env.FUZZ_SECONDS }}s each)
        id: fuzz
        run: |
          set -euo pipefail
          # Every target gets its full window even when an earlier one crashes: under `bash -e` a
          # single failing `cargo fuzz run` aborts the loop, so the FIRST crashing target starves
          # every later one of its nightly budget until someone fixes it — the second decode surface
          # then silently stops being fuzzed at all. Record the failure per target and fail at the
          # end instead, so the run still reports (and uploads reproducers for) all of them.
          # The roster is the file the preflight built and asserted against, not a second discovery
          # that could disagree with it; `--target` is the preflight's derived host triple. The
          # count check below is NOT a second copy of the preflight's three-way roster law — that
          # law lives there, once. This only asserts the handoff file survived between steps,
          # because a vanished roster would otherwise mean a loop over nothing that exits 0.
          roster="${RUNNER_TEMP}/fuzz-targets.txt"
          roster_count=$(grep -c . "${roster}" || true)
          if [ "${roster_count:-0}" -lt 1 ]; then
            echo "::error::the preflight roster at ${roster} is empty or missing at run time; refusing to report a fuzz run that fuzzed nothing."
            exit 1
          fi
          # The per-target window comes from the job-level `FUZZ_SECONDS`, which is the ONE place it
          # is written: the preflight's budget projection (GUARD 6), the `-max_total_time` flag
          # below and the did-it-actually-run floor are all derived from that single fact, so they
          # cannot drift apart the way separate literals would. `:?` because an unset window would
          # otherwise become `-max_total_time=` and fuzz for an unintended length.
          fuzz_seconds="${FUZZ_SECONDS:?}"
          # A target that returns 0 without spending its window did not fuzz its surface. This is
          # not hypothetical: `-runs=1` exits 0 after ~931 runs in under a second, and the loop
          # would have counted that as a fuzzed target and reported the job green. `-max_total_time`
          # has no early-exit path — a healthy target burns the whole budget whether or not it finds
          # new coverage — so anything well under the window means the arguments or the harness
          # stopped fuzzing, which is exactly the "reports success while covering nothing" shape this
          # workflow existed in for 41 runs. 80% absorbs runner scheduling jitter.
          fuzz_min_seconds=$(( fuzz_seconds * 4 / 5 ))
          rc=0
          ran=0
          for_upload=false
          while IFS= read -r t; do
            [ -n "${t}" ] || continue
            ran=$((ran + 1))
            echo "::group::cargo fuzz run ${t}"
            t_rc=0
            t_start=$(date +%s)
            if ! cargo fuzz run "${t}" --target "${FUZZ_TARGET:?}" -- -max_total_time="${fuzz_seconds}"; then
              t_rc=1
              rc=1
              # A failing run is supposed to leave a reproducer under fuzz/artifacts/<target>/
              # (libFuzzer writes crash-/oom-/timeout-/leak- files there via -artifact_prefix). With
              # the build already proven green by the preflight, a failure with NO reproducer is not
              # a crash — it is infrastructure — and the upload step below would otherwise report
              # success while carrying nothing. Name it here, at the target that produced it.
              if ! compgen -G "fuzz/artifacts/${t}/*" > /dev/null; then
                echo "::error::${t} failed but wrote no reproducer under fuzz/artifacts/${t}/ — this is not a crash (the preflight already built it); the failure is in the fuzzing run itself and there is nothing to upload."
              fi
            fi
            t_elapsed=$(( $(date +%s) - t_start ))
            # Only meaningful on the SUCCESS path: a crash legitimately exits early, and it has
            # already set rc=1 and left a reproducer above.
            if [ "${t_rc}" -eq 0 ] && [ "${t_elapsed}" -lt "${fuzz_min_seconds}" ]; then
              echo "::error::${t} exited 0 after ${t_elapsed}s of its ${fuzz_seconds}s window (floor ${fuzz_min_seconds}s) — \`-max_total_time\` has no early-exit path, so a clean early return means the run arguments or the harness body stopped fuzzing this surface. Refusing to report a fuzz run that fuzzed nothing."
              rc=1
            else
              echo "${t}: ${t_elapsed}s of a ${fuzz_seconds}s window"
            fi
            echo "::endgroup::"
          done < "${roster}"
          # Publish the upload flag BEFORE any early exit below. Ordering is load-bearing: a short
          # loop that also produced a real crash would otherwise exit without ever writing this
          # output, the upload step's condition would read false, and the reproducer for a genuine
          # finding would be dropped on the floor. The job stays red either way, so this masks
          # EVIDENCE rather than the verdict — which is precisely the kind of loss that makes a red
          # run unactionable the next morning.
          if compgen -G "fuzz/artifacts/*/*" > /dev/null; then
            for_upload=true
          fi
          echo "reproducers=${for_upload}" >> "${GITHUB_OUTPUT}"
          # The loop must fuzz the whole roster the preflight asserted. A short loop (a mangled
          # roster line, an early `break` added later) would otherwise leave a surface unfuzzed and
          # still exit 0 — the same silent-green shape as an empty target list.
          if [ "${ran}" -ne "${roster_count}" ]; then
            echo "::error::ran ${ran} of ${roster_count} rostered fuzz targets; a discovery loop that skips a surface must not report success."
            exit 1
          fi
          echo "fuzzed ${ran} target(s) on ${FUZZ_TARGET}; reproducers=${for_upload}"
          exit "${rc}"

      # Gated on reproducers actually existing, not on `failure()` alone. Every failed run so far
      # died in the build/preflight, which legitimately produces no reproducers — and the action's
      # default `if-no-files-found: warn` turned that into a green step whose only trace was
      # "No files were found with the provided path: fuzz/artifacts/". Correct, but it trains the
      # reader to ignore the warning, and it reads identically to the case that matters: a real
      # crash whose reproducer went missing. Split: nothing to upload => the step does not run at
      # all; something to upload => `if-no-files-found: error`, so this path and the `compgen -G`
      # in the step above disagreeing about `fuzz/artifacts/` is loud instead of a warning.
      - name: upload crash reproducers
        if: ${{ failure() && steps.fuzz.outputs.reproducers == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: error
