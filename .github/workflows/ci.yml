name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo (checkout); nothing writes contents/issues/packages.
# An explicit top-level block also satisfies zizmor's excessive-permissions audit.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"   # any leftover `warn` (e.g. a regression to warn(missing_docs)) fails CI.

jobs:
  # ---- Static gates: no KVM, no privileges. Most of the rubric lives here. ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # fetch-depth: 0 is load-bearing for the `public-API semver` step below, not tidiness. That
        # step passes `--baseline-rev ${{ github.event.pull_request.base.sha }}`, and the default
        # depth-1 fetch never puts that commit in the object store, so cargo-semver-checks exits 101
        # with `couldn't parse revision "<sha>^{tree}"`. It had never been observed because the step
        # is PR-only and the job died at the tool install below on every PR.
        with: { persist-credentials: false, fetch-depth: 0 }   # persist-credentials: do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # reads rust-toolchain.toml — channel 1.98.0 + clippy/rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f  # v2.86.4
        # `fallback: none`. install-action silently falls through to `cargo-binstall <tool>` for any
        # name it has no manifest for. That detour is exactly how this step killed the whole job:
        # `actionlint` was in this list, install-action has NEVER shipped a manifest for it (it is a
        # Go binary from rhysd/actionlint, not a crates.io crate — verified absent from the
        # recursive tree of both v2.82.8 and v2.85.13, and from TOOLS.md and the CHANGELOG), so
        # binstall reported `actionlint is not found` and exited 76. Every one of the 20 lint gates
        # below was then reported `skipped` — from 2026-07-05 until this fix. Dependabot's pin bump
        # does not help; run 31583296437 proved v2.85.11 fails identically. With `fallback: none` an
        # unsupported tool name fails AT THE NAME instead of detouring, and the action stops being
        # handed `github.token` (it only forwards it for the binstall fallback).
        # `just` is load-bearing here, not a convenience: the ban/check roster lives in ONE recipe
        # (`just gates`) and this job INVOKES it rather than copying the list — see that step below.
        with: { tool: "cargo-hack,cargo-deny,cargo-semver-checks,cargo-machete,typos-cli,zizmor,just", fallback: none }
        # shellcheck is not installed here — it ships preinstalled on ubuntu-latest.

      # actionlint is not an install-action tool at any tag and not a crate, so it is installed from
      # its own release, PINNED and CHECKSUM-VERIFIED. A moving `latest`, or upstream's
      # `curl | bash` bootstrap off `main`, would be an unpinned third party in the workflow whose
      # `test-integration` job holds sudo, installs the VMM binaries, and `just bless`es a
      # file-capability runner — the supply-chain shape zizmor is configured to police and the reason
      # every action here carries a full commit SHA. Bump the version and the digest together; the
      # digest IS the gate, and `--version` at the end is the fail-loud presence check so a bad
      # extract names itself here rather than 14 steps later.
      - name: install actionlint (pinned release, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          "$HOME/.local/bin/actionlint" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Toolchain honesty (the declared `[workspace.package] rust-version` equals the pinned
      # rust-toolchain.toml channel) is NOT a step here: it is `scripts/check-msrv-sync.sh`, inside the
      # one gate roster the "repo gates" step below invokes. It used to be a `run:` block right here,
      # mirroring an inline `sed` comparison in `just ci` — a mirrored ASSERTION, which drifts more
      # quietly than a mirrored roster does, because it can drift in STRICTNESS while both copies stay
      # green. One home now; the script also covers the copies neither inline assertion looked at
      # (fuzz/, examples/downstream-kernel/, clippy.toml's msrv).
      - name: rustfmt
        run: cargo fmt --all --check

      # --locked on every resolving cargo step below: a stale Cargo.lock fails CI instead of being
      # silently regenerated, so dependency bumps land only via reviewed dependabot PRs (mirrors `just ci`).
      - name: clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features

      # NOTE on ordering: the reachable supply-chain / lean-target / API gates run FIRST. The
      # `cargo hack --feature-powerset` step runs LAST and is now BLOCKING — the §10.5 host-stack
      # collapse closed the former C-GATE-1 module-gating debt, so every ≤2-feature config compiles
      # clean and a regression back to RED must fail the job (it is placed last only for runtime).

      - name: cargo-deny
        run: cargo deny check

      # THE ONE GATE ROSTER — invoked, never copied (AGENTS rule 3). Every ban/check script, every
      # red-on-inverse self-test, and the shellcheck pass over the load-bearing bash live in the
      # `gates` recipe; `just ci` runs the SAME recipe, so local ≡ CI by construction and a script
      # added to the justfile is covered here with no second list to edit.
      #
      # This step replaces five hand-copied ones. The copy had drifted three times — most recently
      # `ban-readiness-timeout-literal.sh` and `ban-test-support-in-production.sh` (with their
      # self-tests) landed in the justfile and never reached this file, so the backstop for the one
      # open readiness route, and the ban that only CI's `--all-targets` feature unification can
      # actually exercise, ran nowhere but a developer's laptop. `scripts/ban-ci-script-handcopy.sh`
      # (first entry in the recipe) now fails if this file ever names a `scripts/*.sh` directly
      # again, and asserts the recipe's roster is exactly the gate-shaped scripts on disk.
      #
      # bubblewrap, because ONE gate on the roster genuinely needs it and refuses to pretend
      # otherwise: `scripts/test-with-delegated-scope.sh` fabricates a cgroup tree under `bwrap` to
      # drive every arm of the one wrapper `ban-ci-script-handcopy.sh` exempts and every live suite
      # runs through. It treats an absent `bwrap` as `gate misconfigured` and exits non-zero rather
      # than skipping, which is the same law every source-scanning ban here follows — so the honest
      # fix is to OBTAIN the facility, exactly as `test-integration` builds e2fsprogs rather than
      # living with that battery's skip. Not `continue-on-error`: unlike the ext4 case there is no
      # recorded-skip fallback to degrade to, so a runner that cannot install it must fail loudly
      # here rather than silently retire the gate.
      - name: bubblewrap (the delegated-scope self-test fabricates its cgroup tree under it)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # INSTALLING IT IS NOT ENOUGH, measured: ubuntu-24.04 ships
          # `kernel.apparmor_restrict_unprivileged_userns=1`, which denies the user namespace bwrap
          # needs, and every leg then dies with `setting up uid map: Permission denied`. The runner
          # has sudo and this is a plain sysctl, so obtain the facility properly rather than letting
          # the gate describe the sandbox instead of the wrapper. `|| true`: on a kernel without the
          # knob the sysctl is absent and its absence is not a failure — the self-test's own probe
          # is what decides, and it names this line if it still cannot run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / -- /bin/true && echo "bwrap: usable"

      # Note the workflow-level `CARGO_TERM_COLOR: always` above still applies to everything the
      # recipe runs — that is deliberate. It is the condition that silently killed three cargo-tree
      # bans, `just ci` does not set it, and `ban-uncolored-cargo-parse.sh` (inside the recipe) is
      # what keeps the difference from mattering.
      - name: repo gates (ban/check scripts + red-on-inverse self-tests + shellcheck)
        run: just gates

      - name: lean-member compilation (steward / test-runner / privilege)
        run: |
          # The tree-SHAPE assertion (`check-lean-tree.sh`) runs in `just gates` above. Graph
          # inspection is not enough: actually compile each member so a broken build (e.g. an
          # un-gated host dep) is caught here, not on a KVM host.
          cargo clippy --locked -p vmcell-steward --all-targets -- -D warnings
          cargo clippy --locked -p vmcell-test-runner --all-targets -- -D warnings
          cargo clippy --locked -p vmcell-privilege --all-targets -- -D warnings

      - name: guest-tools build+clippy     # guest userspace helper; build+clippy only (reqwest legitimately pulls hyper/tokio — see impl-notes)
        run: cargo clippy --locked -p vmcell-guest-tools --all-targets -- -D warnings

      - name: reduced-host-feature builds (blocking)   # fast per-backend smoke before the full powerset
        run: |
          # After the §10.5 host-stack collapse, each shipping backend in isolation pulls the full,
          # coherent host stack (host-common → net/proxy/metrics/pipeline + the shared hyper/serde_json
          # deps), so a single-backend build compiles — including `qemu`, which previously did not.
          # `metrics` is part of that stack, so CFG-1's "host without metrics" config is no longer
          # constructible (its code fix remains as defense-in-depth). The powerset below is the
          # comprehensive guard; this loop is fast per-backend feedback.
          for feat in cloud-hypervisor firecracker qemu crosvm; do
            echo "::group::clippy --no-default-features --features $feat"
            cargo clippy --locked -p vmcell --no-default-features --features "$feat" --all-targets -- -D warnings
            echo "::endgroup::"
          done
          # The `ext4-producer` OFF arm (§4.7, §18 delta 8). `--lib`, deliberately WITHOUT
          # `--all-targets`: `vmcell`'s dev-dependency cycle (vmcell → vmcell-artifact-validator →
          # vmcell) re-enables `default`, and therefore this feature, the moment dev-deps are
          # resolved — so neither the loop above nor `cargo hack --feature-powerset` can ever
          # compile the typed capability refusal. This line is the only thing that does.
          echo "::group::clippy --lib --no-default-features --features cloud-hypervisor,pipeline (ext4-producer OFF)"
          cargo clippy --locked -p vmcell --lib --no-default-features --features cloud-hypervisor,pipeline -- -D warnings
          echo "::endgroup::"
          # The Firecracker/QEMU/crosvm backends live in their own crates (depending on `vmcell`, which
          # keeps only Cloud Hypervisor); `vmcell-bench` wires all of them (the `bench-vm` binary).
          # Clippy each standalone so a backend that stops compiling against vmcell's shared surface
          # fails here, not only inside the workspace build.
          echo "::group::clippy extracted backend + bench crates"
          cargo clippy --locked -p vmcell-firecracker -p vmcell-qemu -p vmcell-crosvm -p vmcell-bench --all-targets -- -D warnings
          echo "::endgroup::"

      - name: rustdoc (deny warnings)   # broken/private intra-doc links; clippy does NOT run rustdoc lints
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked

      - name: actionlint (workflow correctness incl. run-block shell)
        run: actionlint
      - name: zizmor (workflow security)   # script injection / over-broad perms / unpinned actions, in a workflow that sudo-installs VMMs and blesses a capability binary
        run: zizmor .github/workflows/
      - name: cargo machete (unused deps)   # unused deps enlarge the audited/licensed/advisory-scanned surface
        run: cargo machete
      - name: typos   # docs are a first-class artifact
        run: typos

      - name: public-API semver (every event, not just PRs)
        # Runs on the pinned toolchain — 1.98.0 satisfies cargo-semver-checks' rustc floor.
        # BOTH contract crates (design §10.4): `vmcell-artifact-validator` is downstream contract
        # surface, so a breaking change there is ledgered like one to `vmcell` — mirrors `just ci`.
        #
        # It used to be `if: github.event_name == 'pull_request'`, and the only PRs this repo has
        # ever had are dependabot's — so the contract-surface gate had never once run against a
        # change to vmcell's OWN public API. Every such change lands as a direct push to `main`,
        # which is precisely the event the condition excluded: the gate was structurally unable to
        # fire on the path changes actually take. One baseline expression covers both events —
        # a second step with the opposite `if:` would be the hand-copy class one file over.
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push that CREATES a branch reports the all-zero SHA as `before`. `on: push` is scoped
          # to `main`, which exists, so this is unreachable in practice — and it fails loud rather
          # than silently comparing against nothing, which is the shape that hid this gate for so
          # long in the first place.
          if [ "$BASELINE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASELINE" ]; then
            echo "no baseline revision for this event: there is nothing to compare the public API against" >&2
            exit 1
          fi
          cargo semver-checks --baseline-rev "$BASELINE" -p vmcell -p vmcell-artifact-validator

      # ---- Feature-powerset: LAST and BLOCKING (former C-GATE-1 debt, closed by the §10.5 collapse). ----
      - name: clippy feature-powerset (blocking; must be GREEN after the §10.5 collapse)
        run: cargo hack --locked --feature-powerset --depth 2 clippy -p vmcell --all-targets

  # ---- The downstream toolkit contract's living consumer (design v30 §10.4; §18 delta 5). ----
  # Its own cargo workspace, excluded from vmcell's members, consuming `vmcell` +
  # `vmcell-artifact-validator` the way a git-dep consumer does. REDDENING THIS JOB IS THE INTENDED
  # FAILURE MODE OF CONTRACT DRIFT: the fix is to reverse or version the contract change (the ledger
  # in crates/vmcell/Cargo.toml), never to edit the example back to green.
  # This job carries the KVM-free legs; the live half (build vmlinux-ikconfig, boot it, validate,
  # prove /proc/config.gz on the data plane) runs in the `test-integration` job below.
  example-downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # examples/ is a descendant dir, so the root pin governs it too
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f  # v2.86.4
        # `just` so the step below can invoke the recipe instead of hand-copying it; `fallback: none`
        # for the reason given at the lint job's install step.
        with: { tool: "just", fallback: none }

      # THE RECIPE, invoked — never copied. Both commands (the `--locked` build of the example's
      # OWN workspace, and its `ci-check.sh`) live in `just example-downstream`; this job used to
      # restate them, which is the drift class AGENTS.md rule 3 and
      # `scripts/ban-recipe-body-handcopy.sh` exist for.
      - name: downstream contract check (KVM-free legs)
        run: just example-downstream

  # ---- Fast tests: unit, codec, property. No KVM. DEFAULT (non-ignored) set only. ----
  test-unit:
    runs-on: ubuntu-latest
    env:
      # H-TEST-3, in the job that needs it now: this suite carries the KVM-free half of the §4.7
      # ext4 battery, whose answer to an absent `mkfs.ext4` is a RECORDED capability skip. Without a
      # run-scoped path that record lands in a per-PID temp file nobody surfaces — the invisible-pass
      # shape already fixed in `test-integration` — so the manifest is pointed, reset, and printed
      # here too. `just skip-manifest-*` and `record_capability_skip` both read this variable.
      VMCELL_SKIP_MANIFEST: ${{ github.workspace }}/target/vmcell-skip-manifest.txt
      # The §4.7 ext4 facility's pin, at JOB scope so the cache key below can INTERPOLATE it
      # rather than restate it. The restatement is what drifted: the key spelled `1.47.2` and the
      # first 16 hex of the retired digest against a `1.47.4` pin, so a re-pin would have been
      # served the tree built from the bytes it replaced — precisely the hazard the key's own
      # comment claimed to prevent. A comment cannot hold two numbers equal; an interpolation can,
      # and arm 8 of `ci_obtains_the_ext4_facility_rather_than_living_with_the_skip` makes a
      # restated key red.
      E2FSPROGS_VERSION: "1.47.4"
      E2FSPROGS_SHA256: "da274408bebbfd13a5a2fc3cfc66e3ffff17c48534673aa67f88d49b99123b96"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # reads rust-toolchain.toml — channel 1.98.0 + clippy/rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f  # v2.86.4
        # `just` so the step below can invoke the recipe instead of hand-copying it; `fallback: none`
        # for the reason given at the lint job's install step — an unsupported tool name must fail at
        # the name, not detour through cargo-binstall and take the job down with it.
        with: { tool: "cargo-nextest,just", fallback: none }
      # ---- The §4.7 ext4 battery's facility, OBTAINED rather than skipped (§18 delta 8). ----
      # `mkfs.ext4 -d <tarball>` — the form the ext4 producer is built on — landed in e2fsprogs
      # 1.47.1, and ubuntu-24.04 packages 1.47.0, so apt cannot supply it at any pin. This builds the
      # pinned release from source. libarchive is what makes the tarball form work at all (mke2fs
      # *dlopen*s libarchive.so.13, so `-V` reports the same banner either way and the only honest
      # probe is a trial build), which is why libarchive-dev goes in first.
      #
      # NON-GATING on purpose. Two of the three possible outcomes are honest: with the facility the
      # battery RUNS, and without it `common::probe_ext4_or_record_skip` records
      # `SKIP cloud-hypervisor ext4_producer` to the manifest this job surfaces. The third — a red
      # job — is what the `panic!` this replaced produced on `test-unit` AND `test-integration` for
      # four commits, and a permanently-red job is a job nobody reads.
      #
      # 1.47.2 rather than the newest release: every measured constant in `vmcell::artifact::ext4`
      # (`EXT4_TARBALL_XATTRS`, the determinism triple) was measured against 1.47.2, so CI agrees
      # with the constants by construction instead of by luck. The digest is upstream's own published
      # `sha256sums.asc` entry for that tarball; bump the two together.
      #
      # `ci_obtains_the_ext4_facility_rather_than_living_with_the_skip` (in
      # crates/vmcell/tests/ext4_producer.rs) is this step's gate: every job that runs the ext4 legs
      # carries these steps BEFORE them, the pin is >= the producer's own `MIN_E2FSPROGS_VERSION`,
      # the download is checksum-verified, the steps stay non-gating, and the copies in the two jobs
      # are byte-identical (this block is duplicated because a `run:` step cannot be shared between
      # jobs; the identity assertion is what keeps a fix to one copy from missing the other).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true   # a cache failure must cost a rebuild, never the job
        with:
          path: ~/.local/e2fsprogs
          # The DIGEST is in the key, not only the version, so a re-pin can never be served the
          # tree built from the bytes it replaced — and both halves are INTERPOLATED from the
          # job-scoped pin, so the key cannot fall behind the pin the way it had.
          key: e2fsprogs-${{ env.E2FSPROGS_VERSION }}-${{ env.E2FSPROGS_SHA256 }}-${{ runner.os }}-${{ runner.arch }}
      - name: e2fsprogs for the ext4 battery (pinned, checksum-verified, non-gating)
        continue-on-error: true
        run: |
          set -uo pipefail
          prefix="$HOME/.local/e2fsprogs"
          # Every command carries an explicit `|| return 1` and nothing here relies on `set -e`:
          # measured, `set -e` inside a function (or a subshell) invoked as an `if` condition is
          # suppressed, so a `set -e` helper called from `if build; then` runs on past a failed
          # `sha256sum -c` and returns the status of whatever it did last. Falling through the
          # CHECKSUM is the one failure that must be impossible — it would build an unverified
          # tarball, which is the supply-chain shape the pin exists to prevent.
          obtain_e2fsprogs() {
            sudo apt-get update -qq || return 1
            sudo apt-get install -y -qq build-essential pkg-config libarchive-dev || return 1
            url="https://cdn.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v${E2FSPROGS_VERSION}/e2fsprogs-${E2FSPROGS_VERSION}.tar.gz"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/e2fsprogs.tar.gz "$url" || return 1
            echo "${E2FSPROGS_SHA256}  /tmp/e2fsprogs.tar.gz" | sha256sum -c - || return 1
            rm -rf /tmp/e2fsprogs-src || return 1
            mkdir -p /tmp/e2fsprogs-src || return 1
            tar -xzf /tmp/e2fsprogs.tar.gz -C /tmp/e2fsprogs-src --strip-components=1 || return 1
            cd /tmp/e2fsprogs-src || return 1
            # The three `--without-*-dir` flags: those files install OUTSIDE --prefix (/etc/cron.d,
            # /lib/udev, the systemd unit dir), so an unprivileged `make install` dies on them —
            # measured: `install: Failed to remove existing file '/etc/cron.d/e2scrub_all'`.
            ./configure --prefix="$prefix" --disable-fuse2fs --disable-defrag --disable-nls \
              --without-crond-dir --without-udev-rules-dir --without-systemd-unit-dir || return 1
            make -j"$(nproc)" || return 1
            make install || return 1
          }
          if [ -x "$prefix/sbin/mkfs.ext4" ]; then
            echo "e2fsprogs $E2FSPROGS_VERSION restored from the cache at $prefix"
          elif obtain_e2fsprogs; then
            echo "built e2fsprogs $E2FSPROGS_VERSION into $prefix"
          else
            echo "::warning::could not obtain e2fsprogs; the ext4 battery will RECORD a capability skip (see the skip-manifest step) instead of running, which is the honest outcome and not a failure"
          fi
          # $GITHUB_PATH only affects LATER steps, so the prepend and the report below are two acts.
          # The prepend is what makes this build win over the image's own /usr/sbin/mkfs.ext4 (1.47.0).
          if [ -x "$prefix/sbin/mkfs.ext4" ]; then
            echo "$prefix/sbin" >> "$GITHUB_PATH"
          fi
          # THE LINE THAT SAYS WHICH ARM HAPPENED — read this before believing the ext4 legs ran.
          echo "--- the mkfs.ext4 the §4.7 producer's probe will find ---"
          if [ -x "$prefix/sbin/mkfs.ext4" ]; then
            "$prefix/sbin/mkfs.ext4" -V || true
          else
            mkfs.ext4 -V || echo "no mkfs.ext4 on PATH at all"
          fi
      - name: reset the run-scoped skip manifest
        run: just skip-manifest-reset   # so the surfaced skips belong to THIS run, not an accumulated history

      # AGENTS rule 3: a CI step that hand-copies a `just` recipe drifts from it. This one was a
      # verbatim copy of `test-unit` — harmless so far, and exactly the shape that let the
      # test-integration job's copy drop `--features qemu` and silently stop compiling a whole
      # backend's matrix legs. Invoke the recipe so local ≡ CI by construction.
      - name: nextest (unit/codec/prop)
        run: just test-unit

      # The half nextest structurally CANNOT run: doctests. Until this step existed nothing in the
      # tree compiled a single `///` example — not this job, not the lint job's rustdoc gate (which
      # checks doc LINKS and never doc CODE) — so the examples on the public API, most of them on
      # `vmcell` (contract surface, §10.4), were correct by luck. A changed signature would break the
      # example that teaches a consumer how to call it with every gate still green. The recipe is
      # invoked, not copied: `just ci` runs the same one (AGENTS rule 3).
      - name: doctests (nextest cannot run them)
        run: just test-doc

      # `always()`, for the same reason as the identical step in `test-integration`: the capability
      # skips of a FAILING run are exactly the ones worth reading. Never gates — a skip is a recorded
      # fact to review, and for the ext4 battery it is the honest outcome when the step above could
      # not obtain e2fsprogs.
      - name: surface the capability-skip manifest (count + contents)
        if: always()
        run: just skip-manifest-show

  # ---- Integration matrix: boots real VMs. Runs the #[ignore]'d suite so it is NOT CI-invisible. ----
  #
  # This job ran on `[self-hosted, linux, kvm]` until 2026-08-14 — and had therefore NEVER run: no
  # such runner was ever registered, so every invocation sat queued until GitHub's 24-hour limit and
  # reported as cancelled. The whole privileged / daemon / unprivileged / live-downstream matrix was
  # CI-invisible for the repo's entire history.
  #
  # It runs on a GitHub-hosted runner now, which was established by probing rather than by argument
  # (image ubuntu-24.04 20260810.271.1): /dev/kvm is present and openable after the udev rule below,
  # `kvm_intel.nested = Y`, sudo+setcap work so `just bless` is unmodified, and
  # `systemd-run --user --scope -p Delegate=yes` gives the delegated cgroup subtree the limit tests
  # need. Measured on the first green run: unprivileged 4/4, privileged 156/156 (312 s), daemon
  # 14/14, downstream live green — identical counts to the maintainer's KVM box, with 8 recorded
  # capability skips that are all backend honesty (Firecracker's unprivileged_vhost_user_net ×4,
  # nested_virt ×2, virtio_fs_shares; QEMU's no-designated-USB-device), not host gaps.
  test-integration:
    runs-on: ubuntu-24.04
    # The cold guest-kernel + rootfs build is ~15 min on 4 cores and the privileged suite ~5 min;
    # the bound is generous for a cold cache, and finite so a wedged VM cannot burn the 6-hour default.
    timeout-minutes: 120
    env:
      # H-TEST-3: one run-scoped path for the capability-skip manifest, shared by every suite step
      # below (the `just` recipes honor an externally-set value). Until this existed the manifest
      # defaulted to a per-PID temp file nobody surfaced, leaving the "skip manifest reviewed"
      # rubric row unenforced — a skip that nobody can read is an invisible pass.
      VMCELL_SKIP_MANIFEST: ${{ github.workspace }}/target/vmcell-skip-manifest.txt
      # The §4.7 ext4 facility's pin, at JOB scope so the cache key below can INTERPOLATE it
      # rather than restate it. The restatement is what drifted: the key spelled `1.47.2` and the
      # first 16 hex of the retired digest against a `1.47.4` pin, so a re-pin would have been
      # served the tree built from the bytes it replaced — precisely the hazard the key's own
      # comment claimed to prevent. A comment cannot hold two numbers equal; an interpolation can,
      # and arm 8 of `ci_obtains_the_ext4_facility_rather_than_living_with_the_skip` makes a
      # restated key red.
      E2FSPROGS_VERSION: "1.47.4"
      E2FSPROGS_SHA256: "da274408bebbfd13a5a2fc3cfc66e3ffff17c48534673aa67f88d49b99123b96"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # reads rust-toolchain.toml — channel 1.98.0 + clippy/rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f  # v2.86.4
        # `fallback: none` — see the lint job's install step. Both tools here have manifests; the
        # point is that a future addition without one fails at the name instead of silently
        # detouring through cargo-binstall.
        with: { tool: "cargo-nextest,just", fallback: none }

      - name: make /dev/kvm, /dev/vhost-vsock and /dev/vhost-net openable by this user
        run: |
          # The hosted image ships all three as root:kvm 0660 and the runner user is not in `kvm`.
          # /dev/vhost-vsock is opened by the QEMU in-kernel-vsock legs and /dev/vhost-net by a
          # `tap,vhost=on` netdev; the blessed runner's CAP_DAC_OVERRIDE would cover them, but
          # `just test-unprivileged` runs WITHOUT the runner, so widen them here rather than lean on
          # a capability that path deliberately does not hold.
          #
          # THE ASSERTION IS THE GATE — AND IT IS DERIVED FROM THE RULES FILE. This step used to
          # widen three nodes and assert one, swallowing both vhost probes with `|| true`, so an
          # absent or still-0660 vhost node surfaced 20 minutes later as the unexplained boot
          # failure this rationale sentence promised it would not (docs/81 m19). The roster is now
          # parsed back out of the rules file this step just wrote: a widened device that nobody
          # asserts is unrepresentable, because adding a KERNEL== line adds its assertion by
          # construction. Nothing is allowed to be absent — the two vhost nodes are created by
          # modules loaded explicitly here, so "module not in this image" fails HERE, named, rather
          # than being swallowed into a green step.
          sudo modprobe vhost_vsock
          sudo modprobe vhost_net
          sudo tee /etc/udev/rules.d/99-vmcell-ci.rules >/dev/null <<'RULES'
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          KERNEL=="vhost-vsock", MODE="0666"
          KERNEL=="vhost-net", MODE="0666"
          RULES
          sudo udevadm control --reload-rules

          devices=$(sed -n 's/^KERNEL=="\([^"]*\)".*/\1/p' /etc/udev/rules.d/99-vmcell-ci.rules)
          if [ -z "$devices" ]; then
            echo "::error::parsed no KERNEL== names out of 99-vmcell-ci.rules — the assertion below would be vacuous"
            exit 1
          fi

          # `</dev/null` on the sudo call, not tidiness: a command inside a `while read` loop that
          # consumes stdin eats the here-string and silently truncates the roster to its first entry.
          while IFS= read -r name; do
            sudo udevadm trigger --name-match="$name" </dev/null
          done <<<"$devices"
          sudo udevadm settle

          fail=0
          while IFS= read -r name; do
            dev="/dev/$name"
            if [ ! -e "$dev" ]; then
              echo "::error::$dev does not exist — this step widens it, so it must be present"
              fail=1
            elif [ ! -r "$dev" ] || [ ! -w "$dev" ]; then
              echo "::error::$dev is still not openable by this user after the udev rule: $(ls -l "$dev")"
              fail=1
            else
              echo "ok: $dev $(stat -c '%A %U:%G' "$dev")"
            fi
          done <<<"$devices"
          [ "$fail" -eq 0 ]

      - name: system packages (README "System Packages")
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison bc libelf-dev libssl-dev \
            pkg-config libseccomp-dev libcap-ng-dev libcap2-bin \
            nftables qemu-system-x86

      # ---- The §4.7 ext4 battery's facility, OBTAINED rather than skipped (§18 delta 8). ----
      # `mkfs.ext4 -d <tarball>` — the form the ext4 producer is built on — landed in e2fsprogs
      # 1.47.1, and ubuntu-24.04 packages 1.47.0, so apt cannot supply it at any pin. This builds the
      # pinned release from source. libarchive is what makes the tarball form work at all (mke2fs
      # *dlopen*s libarchive.so.13, so `-V` reports the same banner either way and the only honest
      # probe is a trial build), which is why libarchive-dev goes in first.
      #
      # NON-GATING on purpose. Two of the three possible outcomes are honest: with the facility the
      # battery RUNS, and without it `common::probe_ext4_or_record_skip` records
      # `SKIP cloud-hypervisor ext4_producer` to the manifest this job surfaces. The third — a red
      # job — is what the `panic!` this replaced produced on `test-unit` AND `test-integration` for
      # four commits, and a permanently-red job is a job nobody reads.
      #
      # 1.47.2 rather than the newest release: every measured constant in `vmcell::artifact::ext4`
      # (`EXT4_TARBALL_XATTRS`, the determinism triple) was measured against 1.47.2, so CI agrees
      # with the constants by construction instead of by luck. The digest is upstream's own published
      # `sha256sums.asc` entry for that tarball; bump the two together.
      #
      # `ci_obtains_the_ext4_facility_rather_than_living_with_the_skip` (in
      # crates/vmcell/tests/ext4_producer.rs) is this step's gate: every job that runs the ext4 legs
      # carries these steps BEFORE them, the pin is >= the producer's own `MIN_E2FSPROGS_VERSION`,
      # the download is checksum-verified, the steps stay non-gating, and the copies in the two jobs
      # are byte-identical (this block is duplicated because a `run:` step cannot be shared between
      # jobs; the identity assertion is what keeps a fix to one copy from missing the other).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true   # a cache failure must cost a rebuild, never the job
        with:
          path: ~/.local/e2fsprogs
          # The DIGEST is in the key, not only the version, so a re-pin can never be served the
          # tree built from the bytes it replaced — and both halves are INTERPOLATED from the
          # job-scoped pin, so the key cannot fall behind the pin the way it had.
          key: e2fsprogs-${{ env.E2FSPROGS_VERSION }}-${{ env.E2FSPROGS_SHA256 }}-${{ runner.os }}-${{ runner.arch }}
      - name: e2fsprogs for the ext4 battery (pinned, checksum-verified, non-gating)
        continue-on-error: true
        run: |
          set -uo pipefail
          prefix="$HOME/.local/e2fsprogs"
          # Every command carries an explicit `|| return 1` and nothing here relies on `set -e`:
          # measured, `set -e` inside a function (or a subshell) invoked as an `if` condition is
          # suppressed, so a `set -e` helper called from `if build; then` runs on past a failed
          # `sha256sum -c` and returns the status of whatever it did last. Falling through the
          # CHECKSUM is the one failure that must be impossible — it would build an unverified
          # tarball, which is the supply-chain shape the pin exists to prevent.
          obtain_e2fsprogs() {
            sudo apt-get update -qq || return 1
            sudo apt-get install -y -qq build-essential pkg-config libarchive-dev || return 1
            url="https://cdn.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v${E2FSPROGS_VERSION}/e2fsprogs-${E2FSPROGS_VERSION}.tar.gz"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/e2fsprogs.tar.gz "$url" || return 1
            echo "${E2FSPROGS_SHA256}  /tmp/e2fsprogs.tar.gz" | sha256sum -c - || return 1
            rm -rf /tmp/e2fsprogs-src || return 1
            mkdir -p /tmp/e2fsprogs-src || return 1
            tar -xzf /tmp/e2fsprogs.tar.gz -C /tmp/e2fsprogs-src --strip-components=1 || return 1
            cd /tmp/e2fsprogs-src || return 1
            # The three `--without-*-dir` flags: those files install OUTSIDE --prefix (/etc/cron.d,
            # /lib/udev, the systemd unit dir), so an unprivileged `make install` dies on them —
            # measured: `install: Failed to remove existing file '/etc/cron.d/e2scrub_all'`.
            ./configure --prefix="$prefix" --disable-fuse2fs --disable-defrag --disable-nls \
              --without-crond-dir --without-udev-rules-dir --without-systemd-unit-dir || return 1
            make -j"$(nproc)" || return 1
            make install || return 1
          }
          if [ -x "$prefix/sbin/mkfs.ext4" ]; then
            echo "e2fsprogs $E2FSPROGS_VERSION restored from the cache at $prefix"
          elif obtain_e2fsprogs; then
            echo "built e2fsprogs $E2FSPROGS_VERSION into $prefix"
          else
            echo "::warning::could not obtain e2fsprogs; the ext4 battery will RECORD a capability skip (see the skip-manifest step) instead of running, which is the honest outcome and not a failure"
          fi
          # $GITHUB_PATH only affects LATER steps, so the prepend and the report below are two acts.
          # The prepend is what makes this build win over the image's own /usr/sbin/mkfs.ext4 (1.47.0).
          if [ -x "$prefix/sbin/mkfs.ext4" ]; then
            echo "$prefix/sbin" >> "$GITHUB_PATH"
          fi
          # THE LINE THAT SAYS WHICH ARM HAPPENED — read this before believing the ext4 legs ran.
          echo "--- the mkfs.ext4 the §4.7 producer's probe will find ---"
          if [ -x "$prefix/sbin/mkfs.ext4" ]; then
            "$prefix/sbin/mkfs.ext4" -V || true
          else
            mkfs.ext4 -V || echo "no mkfs.ext4 on PATH at all"
          fi
      - name: install VMM backends (pinned, checksum-verified)
        env:
          CH_VERSION: "v53.0"
          CH_SHA256: "448af3d4e59b22c2987f7df94c213ad40fb53a10d437e42b5ee6c4fce7c29ecc"
          FC_VERSION: "v1.16.1"
        run: |
          # Pinned + checksum-verified, exactly like the actionlint install in the lint job: these
          # binaries are spawned WITH CAPABILITIES beside the test suite, so `latest` is not an
          # option. Both projects publish static x86_64 builds, which also avoids the ~15-minute
          # source builds the README's `cargo install` route would cost on a 4-core runner.
          set -euo pipefail
          sudo curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o /usr/local/bin/cloud-hypervisor \
            "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/${CH_VERSION}/cloud-hypervisor-static"
          echo "${CH_SHA256}  /usr/local/bin/cloud-hypervisor" | sha256sum -c -
          sudo chmod +x /usr/local/bin/cloud-hypervisor
          cloud-hypervisor --version

          # Firecracker publishes its own .sha256.txt beside the tarball — verify against that rather
          # than a digest copied into this file, and fail loud if either file is missing.
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -O \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -O \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz.sha256.txt"
          sha256sum -c "firecracker-${FC_VERSION}-x86_64.tgz.sha256.txt"
          tar -xzf "firecracker-${FC_VERSION}-x86_64.tgz"
          sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/local/bin/firecracker
          firecracker --version

          # virtiofsd has no binary release; `vhost-device-vsock` is NOT the optional extra the
          # README implies — it is spawned by BARE NAME from vmcell-qemu and is the default QEMU
          # vsock transport (`uses_in_kernel_vsock` returns `cfg.snapshotting` on `Auto`), so every
          # non-snapshotting QEMU leg goes through it and its absence is a loud spawn failure.
          cargo install virtiofsd --locked
          cargo install vhost-device-vsock --locked

      - name: reset the run-scoped skip manifest
        run: just skip-manifest-reset   # so the surfaced skips belong to THIS run, not an accumulated history

      # The long pole (~15 min cold on 4 cores). `--kernel-source host-make` is mandatory: the bare
      # default silently substitutes a prebuilt vmlinux lacking CONFIG_KVM_INTEL /
      # CONFIG_HW_RANDOM_VIRTIO and reddens nested_virt and snapshot_restore. The rootfs comes from a
      # digest-pinned OCI base, which is host-native, so this step needs no KVM.
      - name: build VM artifacts
        run: cargo run --locked -p vmcell-cli --bin vmcell -- build --kernel-source host-make

      # EVERY live suite runs inside a delegated scope. A hosted runner's own cgroup
      # (system.slice/hosted-compute-agent.service) is not delegated, and `MicroVm::start` needs a
      # writable cgroup even when no limit is requested — the first hosted trial died on the
      # unprivileged suite with `Cgroup("create cgroup …: Permission denied (os error 13)")`. The
      # self-hosted job never wrapped `test-privileged` either; it was silently relying on its
      # runner's own cgroup being delegated, which is the most self-hosted-shaped thing it did.
      # `test-daemon`'s recipe carries its own wrapper, so it is invoked bare.
      #
      # Suite steps invoke the `just` recipes, never a hand-copied cargo line: the copy HAD diverged —
      # this step used to inline the nextest command WITHOUT the recipe's `--features qemu`, so the
      # QEMU smoltcp-NAT leg of the `vmm_matrix_test!` was never even COMPILED in CI (M14). That is an
      # invisible coverage loss, not a recorded skip.
      - name: unprivileged suite (no elevation — keeps the unprivileged path honest)
        run: systemd-run --user --scope -p Delegate=yes scripts/with-delegated-scope.sh just test-unprivileged

      # Bless grants the runner cap_net_admin,cap_sys_admin (+dac_override, +setpcap) so the
      # privileged suite runs under the capability wrapper instead of broad `sudo -E`.
      - name: bless the capability runner
        run: just bless

      - name: privileged suite (via vmcell-test-runner capability wrapper, not sudo -E)
        run: systemd-run --user --scope -p Delegate=yes scripts/with-delegated-scope.sh just test-privileged

      - name: daemon end-to-end suite (inverted runner; boots vmcelld → real CH VMs)
        run: just test-daemon

      # The artifact-conformance battery's LIVE half: the known-good pair passes `Level::Full` with
      # zero failures, and a garbage kernel FAILS with a §5.4-clause message. Both tests are
      # `#[ignore]`d and, until `just test-validator` existed, no invocation in the tree selected
      # them — every `--run-ignored all` was scoped to another package — so the downstream contract
      # kit's only can-it-go-red proof was compiled and skipped (m24). The recipe carries
      # `--no-tests=fail`, which is what turns a future mis-scoped filter back into a failure
      # instead of this same silence. It runs after `bless` (its tests go through the capability
      # runner, so the capability-gated Extended/Full checks RUN instead of recording skips) and
      # inside a delegated scope (the `metrics.mem_limit_ooms` leg needs real cgroup enforcement).
      - name: artifact-conformance battery (validator live smoke; garbage-kernel leg proves it can fail)
        run: systemd-run --user --scope -p Delegate=yes scripts/with-delegated-scope.sh just test-validator

      # The `bench-vm` harness's LIVE legs — the same m24 defect as the step above, one package over.
      # Every `#[ignore = "needs KVM"]` test in crates/vmcell-bench/tests/benchmark.rs is one of them
      # (the roster lives in that file, not here: this comment named two of the three until a human
      # noticed the crosvm leg, which is exactly how a quoted roster goes stale). Until
      # `just test-bench` existed, EVERY `--run-ignored all` in the tree was scoped to another package
      # (`-p vmcell`, `-p vmcelld`, `-p vmcell-artifact-validator`), so the composition root that
      # wires all four backends had no can-it-go-red proof anywhere: compiled, then skipped. A
      # renamed backend flag or a report that stops printing percentiles surfaced only when a human
      # ran `bench-vm` by hand. The recipe carries `--no-tests=fail` so a future mis-scoped filter is
      # loud instead of silently green, and it scopes features to cloud-hypervisor,firecracker,qemu so
      # the crosvm leg is never compiled — CI has no `crosvm` binary, and
      # `just test-bench cloud-hypervisor,crosvm` is that leg's opt-in home (the `test-crosvm` rule).
      # After `bless` (the cpufreq pin needs CAP_DAC_OVERRIDE via the runner) and inside a delegated
      # scope, like every other live suite.
      #
      # NO capability wrapper on this line, ever. The recipe wraps the TEST BINARY (nextest's
      # target-runner hook) and the tests spawn `bench-vm` directly, inheriting the caps through the
      # ambient set. A second wrap is not redundant, it is FATAL: the first shrinks the bounding set
      # below the runner file's own `+ep` caps and `execve` answers EPERM. That is how this step first
      # went red — five tests, 0.008s each, `os error 1` and no cause. See
      # crates/vmcell-bench/tests/common/mod.rs.
      - name: benchmark harness live legs (bench-vm across firecracker + qemu)
        run: systemd-run --user --scope -p Delegate=yes scripts/with-delegated-scope.sh just test-bench

      # The downstream example's LIVE half (design v30 §18 delta 5): builds `vmlinux-ikconfig` from
      # the example's OWN pins overlay through the library entry point, asserts the fragment survived
      # in the resolved-config sidecar, runs the conformance battery, and proves the fragment took on
      # the DATA PLANE by reading /proc/config.gz out of the booted guest.
      - name: "downstream example (live: labelled kernel build → battery → /proc/config.gz in-guest)"
        env:
          VMCELL_ARTIFACTS_DIR: ${{ github.workspace }}/examples/downstream-kernel/target/vmcell-artifacts
          VMCELL_ROOTFS: ${{ github.workspace }}/target/vmcell-artifacts/rootfs.erofs
        run: systemd-run --user --scope -p Delegate=yes ../../scripts/with-delegated-scope.sh cargo run --locked --bin downstream-kernel -- live
        working-directory: examples/downstream-kernel

      # FINAL step, and `always()`: the capability skips of a FAILING run are exactly the ones worth
      # reading, so this must survive an earlier red step. Never gates (a skip is a recorded fact to
      # review); it makes the manifest visible in the job log, which is what the rubric row asks for.
      - name: surface the capability-skip manifest (count + contents)
        if: always()
        run: just skip-manifest-show
