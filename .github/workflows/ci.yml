name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo (checkout); nothing writes contents/issues/packages.
# An explicit top-level block also satisfies zizmor's excessive-permissions audit (self-hosted runner).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"   # any leftover `warn` (e.g. a regression to warn(missing_docs)) fails CI.

jobs:
  # ---- Static gates: no KVM, no privileges. Most of the rubric lives here. ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # reads rust-toolchain.toml — channel 1.96.1 + clippy/rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907  # v2
        with: { tool: "cargo-hack,cargo-deny,cargo-semver-checks,actionlint,cargo-machete,typos-cli,zizmor" }
        # shellcheck is not installed here — it ships preinstalled on ubuntu-latest.

      - name: toolchain honesty (declared MSRV == pinned channel)
        run: |
          # One MSRV fact: [workspace.package] rust-version must equal rust-toolchain.toml's channel.
          # An understated rust-version lets MSRV-aware resolvers hand consumers the vulnerable
          # time 0.3.45 the lockfile exists to avoid (design §10.5). Mirrors the `just ci` assertion.
          rv=$(sed -nE 's/^rust-version *= *"([0-9.]+)".*/\1/p' Cargo.toml | head -n1)
          ch=$(sed -nE 's/^channel *= *"([0-9.]+)".*/\1/p' rust-toolchain.toml | head -n1)
          if [ -z "$rv" ] || [ "$rv" != "$ch" ]; then
            echo "::error::MSRV drift: [workspace.package] rust-version=$rv vs rust-toolchain channel=$ch"
            exit 1
          fi

      - name: rustfmt
        run: cargo fmt --all --check

      # --locked on every resolving cargo step below: a stale Cargo.lock fails CI instead of being
      # silently regenerated, so dependency bumps land only via reviewed dependabot PRs (mirrors `just ci`).
      - name: clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features

      # NOTE on ordering: the reachable supply-chain / lean-target / API gates run FIRST. The
      # `cargo hack --feature-powerset` step runs LAST and is now BLOCKING — the §10.5 host-stack
      # collapse closed the former C-GATE-1 module-gating debt, so every ≤2-feature config compiles
      # clean and a regression back to RED must fail the job (it is placed last only for runtime).

      - name: cargo-deny
        run: cargo deny check

      - name: lean-agent invariant         # guest PID-1 member must omit the host stack AND compile standalone
        run: |
          # v15: the lean boundary is now a per-MEMBER structural property (§12.8 #4), so the
          # check targets the crate directly (`-p vmcell-guest-agent`) instead of a feature slice
          # of the old single package — no host module can leak in by construction.
          if cargo tree --locked -e no-dev -p vmcell-guest-agent \
               | grep -E '── (tokio|hyper|rtnetlink) v'; then
            echo "::error::lean-agent invariant violated — host stack leaked into the agent build"
            exit 1
          fi
          # Graph inspection is not enough: actually compile the agent member so a broken
          # agent build (e.g. an un-gated host dep) is caught here, not on a KVM host.
          cargo clippy --locked -p vmcell-guest-agent --all-targets -- -D warnings

      - name: lean-test-runner invariant   # privileged-window member must omit the host async stack AND compile standalone
        run: |
          # Mirrors lean-agent: the test-runner runs with elevated caps, so the same async host
          # stack (tokio/hyper/rtnetlink) must not leak in.
          if cargo tree --locked -e no-dev -p vmcell-test-runner \
               | grep -E '── (tokio|hyper|rtnetlink) v'; then
            echo "::error::lean-test-runner invariant violated — host stack leaked into the test-runner build"
            exit 1
          fi
          cargo clippy --locked -p vmcell-test-runner --all-targets -- -D warnings

      - name: lean-privilege invariant     # shared blessing/capability crate, linked by BOTH the runner and the daemon
        run: |
          # §18.1: `vmcell-privilege` is linked by the runner AND the daemon, so it must stay as lean
          # as the runner — no host async stack. Mirrors `just ci`, which has run this since §18.1
          # landed; CI had only the two member bans above, so a host-stack leak into this crate was
          # caught here at best transitively (and misattributed to the runner edge), and its
          # standalone clippy ran nowhere at all.
          if cargo tree --locked -e no-dev -p vmcell-privilege \
               | grep -E '── (tokio|hyper|rtnetlink) v'; then
            echo "::error::lean-privilege invariant violated — host stack leaked into vmcell-privilege"
            exit 1
          fi
          cargo clippy --locked -p vmcell-privilege --all-targets -- -D warnings

      - name: guest-tools build+clippy     # guest userspace helper; build+clippy only (reqwest legitimately pulls hyper/tokio — see impl-notes)
        run: cargo clippy --locked -p vmcell-guest-tools --all-targets -- -D warnings

      - name: broker web-stack exclusion (vmcell-daemon/axum absent from the cap-holder)   # B9/§12.4 erratum-aware
        run: |
          # The broker OWNS the engine — tokio + rtnetlink are LEGITIMATE (it does netns/tap/nft
          # setup), so it is NOT governed by the full lean-tree ban. Its lean boundary is the
          # network-facing WEB SERVER, which lives in vmcell-daemon (axum): assert the broker links
          # NEITHER vmcell-daemon NOR axum, so the HTTP surface that parses network input never shares
          # the cap-holding process (§12.23 / P2). `hyper` is NOT asserted absent — it enters
          # legitimately through vmcell's egress proxy (hudsucker) + HTTP clients (reqwest/oci-client);
          # the *server*-stack marker is axum + vmcell-daemon (corrects the v3 "axum/hyper" phrasing to
          # the built tree — see implementation-notes.md). if/then form (not `! … | grep`): a leading
          # `!` is exempt from `set -e`, so a two-liner would mask the first hit behind a clean second.
          if cargo tree --locked -p vmcell-broker -e no-dev -i vmcell-daemon 2>/dev/null | grep -q .; then
            echo "::error::vmcell-broker must not link vmcell-daemon (the web/server crate must not share the cap-holder)"; exit 1
          fi
          if cargo tree --locked -p vmcell-broker -e no-dev -i axum 2>/dev/null | grep -q .; then
            echo "::error::vmcell-broker must not link axum (network-input server stack must not share the cap-holder)"; exit 1
          fi

      - name: reduced-host-feature builds (blocking)   # fast per-backend smoke before the full powerset
        run: |
          # After the §10.5 host-stack collapse, each shipping backend in isolation pulls the full,
          # coherent host stack (host-common → net/proxy/metrics/pipeline + the shared hyper/serde_json
          # deps), so a single-backend build compiles — including `qemu`, which previously did not.
          # `metrics` is part of that stack, so CFG-1's "host without metrics" config is no longer
          # constructible (its code fix remains as defense-in-depth). The powerset below is the
          # comprehensive guard; this loop is fast per-backend feedback.
          for feat in cloud-hypervisor firecracker qemu crosvm; do
            echo "::group::clippy --no-default-features --features $feat"
            cargo clippy --locked -p vmcell --no-default-features --features "$feat" --all-targets -- -D warnings
            echo "::endgroup::"
          done
          # The Firecracker/QEMU/crosvm backends live in their own crates (depending on `vmcell`, which
          # keeps only Cloud Hypervisor); `vmcell-bench` wires all of them (the `bench-vm` binary).
          # Clippy each standalone so a backend that stops compiling against vmcell's shared surface
          # fails here, not only inside the workspace build.
          echo "::group::clippy extracted backend + bench crates"
          cargo clippy --locked -p vmcell-firecracker -p vmcell-qemu -p vmcell-crosvm -p vmcell-bench --all-targets -- -D warnings
          echo "::endgroup::"

      - name: rustdoc (deny warnings)   # broken/private intra-doc links; clippy does NOT run rustdoc lints
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked

      - name: ban module-global mutable ID/atomic state
        run: |
          ./scripts/ban-global-state.sh
          ./scripts/test-ban-global-state.sh   # the scanner's own red-on-inverse self-test
          ./scripts/ban-legacy-terms.sh        # design v14 §10.7 rename gate: no rootless/TestVm/imp_testing/imp-* in non-historical code
          ./scripts/test-ban-legacy-terms.sh   # the rename gate's own red-on-inverse self-test
          ./scripts/ban-agent-ip-shellout.sh       # AGENT-4/TEST-5: guest agent must never shell out to `ip` (zero-netlink §4.3)
          ./scripts/test-ban-agent-ip-shellout.sh  # the ip-shellout gate's own red-on-inverse self-test
          ./scripts/ban-artifact-path-join.sh      # P3/B12: no inline `<dir>.join(client)` outside resolve_artifact_path (daemon crate)
          ./scripts/test-ban-artifact-path-join.sh # the artifact-path gate's own red-on-inverse self-test
          ./scripts/ban-inline-setns.sh            # S2/delta 8: no raw `setns` outside net_sys::setns_net + the one pre_exec site
          ./scripts/test-ban-inline-setns.sh       # the inline-setns gate's own red-on-inverse self-test
          ./scripts/test-review-preflight-priv.sh  # preflight three-way verdict (bless-only sentinel): classifier red-on-inverse self-test

      - name: vendored vhost patch is live (M-VEND-3, here and downstream)
        run: |
          # ONE predicate for the carried [patch.crates-io] vhost patch (design v30 §10.4 / delta 2):
          # the same path-independent script a git-dep consumer runs in ITS workspace, so the check
          # cannot drift between here and downstream. A caret bump silently drops the patch (only a
          # "Patch was not used" warning), regressing the QEMU-unprivileged SET_VRING_ENABLE quirk
          # with a green build. Mirrors `just ci`.
          ./scripts/check-vendored-vhost.sh
          ./scripts/test-check-vendored-vhost.sh   # the predicate's own red-on-inverse self-test

      - name: shellcheck (scripts are load-bearing)   # ban scripts, preflight, bless, delegated-scope are security-adjacent bash
        # …plus the downstream example's contract check (v30 delta 5), which must live beside the
        # workspace it checks — so the glob comes to it. Mirrors `just ci` (local ≡ CI).
        # `scripts/git-pre-commit` is named EXPLICITLY: it is a git hook, so it carries no `.sh`
        # extension and the glob silently skipped it — the repo's only unlinted bash.
        run: shellcheck scripts/*.sh scripts/git-pre-commit examples/downstream-kernel/*.sh
      - name: actionlint (workflow correctness incl. run-block shell)
        run: actionlint
      - name: zizmor (workflow security — self-hosted KVM runner)   # script injection / over-broad perms / unpinned actions = lateral movement onto the KVM host
        run: zizmor .github/workflows/
      - name: cargo machete (unused deps)   # unused deps enlarge the audited/licensed/advisory-scanned surface
        run: cargo machete
      - name: typos   # docs are a first-class artifact
        run: typos

      - name: public-API semver (PRs only)
        if: github.event_name == 'pull_request'
        # Runs on the pinned toolchain — 1.96.1 satisfies cargo-semver-checks' rustc floor.
        # BOTH contract crates (design v30 §10.4): `vmcell-artifact-validator` is downstream contract
        # surface, so a breaking change there is ledgered like one to `vmcell` — mirrors `just ci`.
        run: cargo semver-checks --baseline-rev "${{ github.event.pull_request.base.sha }}" -p vmcell -p vmcell-artifact-validator

      # ---- Feature-powerset: LAST and BLOCKING (former C-GATE-1 debt, closed by the §10.5 collapse). ----
      - name: clippy feature-powerset (blocking; must be GREEN after the §10.5 collapse)
        run: cargo hack --locked --feature-powerset --depth 2 clippy -p vmcell --all-targets

  # ---- The downstream toolkit contract's living consumer (design v30 §10.4; §18 delta 5). ----
  # Its own cargo workspace, excluded from vmcell's members, consuming `vmcell` +
  # `vmcell-artifact-validator` the way a git-dep consumer does. REDDENING THIS JOB IS THE INTENDED
  # FAILURE MODE OF CONTRACT DRIFT: the fix is to reverse or version the contract change (the ledger
  # in crates/vmcell/Cargo.toml), never to edit the example back to green.
  # This job carries the KVM-free legs; the live half (build vmlinux-ikconfig, boot it, validate,
  # prove /proc/config.gz on the data plane) runs on the self-hosted KVM job below.
  example-downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # examples/ is a descendant dir, so the root pin governs it too
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      # `cargo build --locked` in the example's OWN workspace: a stale example Cargo.lock fails here
      # rather than being silently regenerated, exactly as in the main workspace.
      - name: build the consumer workspace
        run: cargo build --locked
        working-directory: examples/downstream-kernel

      # Overlay resolution, the harness-getter contract both ways, the documented CLI invocations,
      # and the vendored-vhost assertion trio (this workspace is delta 2's positive control).
      - name: downstream contract check (KVM-free legs)
        run: ./ci-check.sh
        working-directory: examples/downstream-kernel

  # ---- Fast tests: unit, codec, property. No KVM. DEFAULT (non-ignored) set only. ----
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # reads rust-toolchain.toml — channel 1.96.1 + clippy/rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907  # v2
        with: { tool: "cargo-nextest" }
      - name: nextest (unit/codec/prop)
        run: cargo nextest run --locked --all-features

  # ---- Integration matrix: needs /dev/kvm. Runs the #[ignore]'d suite so it is NOT CI-invisible. ----
  test-integration:
    # Self-hosted runner labelled `kvm`, with /dev/kvm and the runner user in the `kvm` group.
    runs-on: [self-hosted, linux, kvm]
    env:
      # H-TEST-3: one run-scoped path for the capability-skip manifest, shared by every suite step
      # below (the `just` recipes honor an externally-set value). Until this existed the manifest
      # defaulted to a per-PID temp file nobody surfaced, leaving the "skip manifest reviewed"
      # rubric row unenforced — a skip that nobody can read is an invisible pass.
      VMCELL_SKIP_MANIFEST: ${{ github.workspace }}/target/vmcell-skip-manifest.txt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }   # do not leave the token in .git/config (zizmor: artipacked)
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install    # reads rust-toolchain.toml — channel 1.96.1 + clippy/rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907  # v2
        with: { tool: "cargo-nextest,just" }

      - name: reset the run-scoped skip manifest
        run: just skip-manifest-reset   # so the surfaced skips belong to THIS run, not an accumulated history

      - name: build VM artifacts
        run: cargo run --locked -p vmcell-cli --bin vmcell -- build --kernel-source host-make

      # Suite steps invoke the `just` recipes, never a hand-copied cargo line: the copy HAD diverged —
      # this step used to inline the nextest command WITHOUT the recipe's `--features qemu`, so the
      # QEMU smoltcp-NAT leg of the `vmm_matrix_test!` was never even COMPILED in CI (M14). That is an
      # invisible coverage loss, not a recorded skip — the tests do not exist in the binary, so nothing
      # lands in the skip manifest — and it hid exactly the path the vendored vhost patch exists for.
      # `just` is installed above and already drives the reset/daemon/show steps, so local ≡ CI by
      # construction here. The run-scoped VMCELL_SKIP_MANIFEST set at job level still wins (the recipes
      # honor an externally-set value).
      - name: unprivileged suite (no elevation — keeps the unprivileged path honest)
        run: just test-unprivileged

      # Bless grants the runner cap_net_admin,cap_sys_admin (debug + release) so the privileged
      # suite runs under the capability wrapper instead of broad `sudo -E` — mirrors `just test-privileged`.
      - name: bless the capability runner
        run: just bless

      # `just test-privileged` passes `--features firecracker,qemu` (additive to the default
      # cloud-hypervisor) so the `#[cfg(feature="firecracker")]`/`qemu` tests are actually exercised
      # here, not just CH (P30), and wraps the test binaries with the blessed runner at the stable
      # ./.vmcell-bin/ path (v15 §12.8) — the recipe owns both, so this step carries no second copy of
      # either. The per-backend matrix skips-with-reason when a binary is absent.
      - name: privileged suite (via vmcell-test-runner capability wrapper, not sudo -E)
        run: just test-privileged

      # KVM job only: the daemon end-to-end suite boots real Cloud Hypervisor VMs THROUGH `vmcelld`.
      # `just test-daemon` wraps the test binary with the (already-blessed) runner so it holds the
      # caps and spawns `vmcelld` in a systemd-delegated cgroup scope, then asserts the HTTP surface +
      # data plane over `vmcell-daemon-client`. The KVM-free daemon gates (auth, OpenAPI parity, the
      # name-validator inverse battery, delete-in-use) run in the ordinary `test-unit` job — they need
      # no runner. Mirrors `just test-daemon`.
      - name: daemon end-to-end suite (inverted runner; boots vmcelld → real CH VMs)
        run: just test-daemon

      # The downstream example's LIVE half (design v30 §18 delta 5 — "live leg non-optional": every
      # assertion below is one the fs-blind fakes structurally cannot make). Builds
      # `vmlinux-ikconfig` from the example's OWN pins overlay through the library entry point,
      # asserts the fragment survived in the resolved-config sidecar, runs the conformance battery,
      # and proves the fragment took on the DATA PLANE by reading /proc/config.gz out of the booted
      # guest. Placed after the operating-mode suites: it compiles a kernel with host `make`
      # (minutes), and it consumes the rootfs the artifact build step above produced.
      - name: "downstream example (live: labelled kernel build → battery → /proc/config.gz in-guest)"
        env:
          # The documented downstream configuration (§10.4): an externally managed rootfs plus this
          # consumer's own artifacts dir, so the example never writes into vmcell's artifact cache.
          VMCELL_ARTIFACTS_DIR: ${{ github.workspace }}/examples/downstream-kernel/target/vmcell-artifacts
          VMCELL_ROOTFS: ${{ github.workspace }}/target/vmcell-artifacts/rootfs.erofs
        run: cargo run --locked --bin downstream-kernel -- live
        working-directory: examples/downstream-kernel

      # FINAL step, and `always()`: the capability skips of a FAILING run are exactly the ones worth
      # reading, so this must survive an earlier red step. Never gates (a skip is a recorded fact to
      # review); it makes the manifest visible in the job log, which is what the rubric row asks for.
      - name: surface the capability-skip manifest (count + contents)
        if: always()
        run: just skip-manifest-show
