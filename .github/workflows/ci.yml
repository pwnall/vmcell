name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"   # any leftover `warn` (e.g. a regression to warn(missing_docs)) fails CI.

jobs:
  # ---- Static gates: no KVM, no privileges. Most of the rubric lives here. ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-hack,cargo-deny,cargo-semver-checks" }

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features

      # NOTE on ordering (C-GATE-1): the reachable supply-chain / lean-target / API gates run
      # FIRST and block the job. The known-RED `cargo hack --feature-powerset` step (accepted
      # host-common module-gating debt) is moved to the END with `continue-on-error: true`, so it
      # stays visible (a red annotation) but no longer short-circuits the gates below it.

      - name: cargo-deny
        run: cargo deny check

      - name: lean-agent invariant         # guest PID-1 binary must omit the host stack AND compile standalone
        run: |
          if cargo tree -e no-dev --no-default-features --features agent \
               | grep -E '── (tokio|hyper|rtnetlink) v'; then
            echo "::error::lean-agent invariant violated — host stack leaked into the agent build"
            exit 1
          fi
          # Graph inspection is not enough: actually compile the agent-only target so a broken
          # agent-only build (e.g. an un-gated host dep) is caught here, not on a KVM host.
          cargo clippy --no-default-features --features agent --bin imp-guest-agent -- -D warnings

      - name: lean-test-runner invariant   # privileged-window binary must omit the host async stack AND compile standalone
        run: |
          # Mirrors lean-agent: the test-runner runs with elevated caps, so the same async host
          # stack (tokio/hyper/rtnetlink) must not leak in. tracing(-subscriber) is intentionally
          # NOT in this list — it is a declared `test-runner` feature dep (Cargo.toml), exactly as
          # for the `agent` target whose assertion also permits it.
          if cargo tree -e no-dev --no-default-features --features test-runner \
               | grep -E '── (tokio|hyper|rtnetlink) v'; then
            echo "::error::lean-test-runner invariant violated — host stack leaked into the test-runner build"
            exit 1
          fi
          cargo clippy --no-default-features --features test-runner --bin imp-test-runner -- -D warnings

      - name: guest-tools build+clippy     # guest userspace helper; build+clippy only (reqwest legitimately pulls hyper/tokio — see impl-notes)
        run: cargo clippy --no-default-features --features guest-tools --bin imp-guest-tools -- -D warnings

      - name: ban module-global mutable ID/atomic state
        run: |
          ./scripts/ban-global-state.sh
          ./scripts/test-ban-global-state.sh   # the scanner's own red-on-inverse self-test

      - name: public-API semver (PRs only)
        if: github.event_name == 'pull_request'
        run: cargo semver-checks --baseline-rev "${{ github.event.pull_request.base.sha }}"

      # ---- Accepted-RED debt: LAST and non-blocking (C-GATE-1). Keep it visible, not gating. ----
      - name: clippy feature-powerset (accepted-RED debt; non-blocking)
        continue-on-error: true            # known-RED host-common module-gating; tracked, must not short-circuit the gates above
        run: cargo hack --feature-powerset --depth 2 clippy --all-targets

  # ---- Fast tests: unit, codec, property. No KVM. DEFAULT (non-ignored) set only. ----
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest" }
      - name: nextest (unit/codec/prop)
        run: cargo nextest run --all-features

  # ---- Integration matrix: needs /dev/kvm. Runs the #[ignore]'d suite so it is NOT CI-invisible. ----
  test-integration:
    # Self-hosted runner labelled `kvm`, with /dev/kvm and the runner user in the `kvm` group.
    runs-on: [self-hosted, linux, kvm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest,just" }

      - name: build VM artifacts
        run: cargo run --bin imp-testing -- build

      - name: rootless suite (no elevation — keeps the rootless path honest)
        run: cargo nextest run --profile integration --run-ignored all -E 'test(rootless) | test(smoltcp)'

      # Bless grants the runner cap_net_admin,cap_sys_admin (debug + release) so the privileged
      # suite runs under the capability wrapper instead of broad `sudo -E` — mirrors `just test-priv`.
      - name: bless the capability runner
        run: just bless

      # `--features firecracker,qemu` (additive to the default cloud-hypervisor) compiles in the
      # `#[cfg(feature="firecracker")]`/`qemu` tests so the FC/QEMU backends are actually exercised
      # here, not just CH (P30). The per-backend matrix skips-with-reason when a binary is absent.
      - name: privileged suite (via imp-test-runner capability wrapper, not sudo -E)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/target/debug/imp-test-runner
        run: cargo nextest run --profile integration --features firecracker,qemu --run-ignored all -E 'not (test(rootless) | test(smoltcp))'
