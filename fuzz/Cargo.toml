# naming it, never a silent absence (F6). Directed by quality-gates v5's fuzz delta.
[[bin]]
name = "feature_manifest"
path = "fuzz_targets/feature_manifest.rs"
test = false
doc = false

# v33 §10.5: the artifact-registry entry parsers (F7) — the `rootfs` and `handlers` label maps,
# reached through the pins overlay's strict parse and the merge, so the legacy-singleton reject
# (which only fires on the MERGED document) and the sanitized-filename collision reject are in
# scope beside the per-entry shape, digest, `unpinned_path` and `features` rules.
[[bin]]
