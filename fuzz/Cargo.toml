# cargo-fuzz crate for the guest/network decode surfaces (rubric B10). Deliberately EXCLUDED from
# the root workspace (see `exclude = ["fuzz"]` in the top-level Cargo.toml): libfuzzer-sys links the
# libFuzzer/sanitizer runtime and only builds under `cargo fuzz` on nightly, so it must never be
# pulled into a stable `cargo build --workspace` / nextest / doc / hack run.
#
# ROSTER LAW: every target lands in BOTH a `[[bin]]` stanza here and a `fuzz_targets/<name>.rs`
# file. `.github/workflows/fuzz.yml` GUARD 5 asserts `cargo fuzz list` == the `[[bin]]` count here ==
# the `.rs` count on disk, because a target file without its stanza is invisible to `cargo fuzz list`
# and is therefore never fuzzed while the job still reports success.
[package]
name = "vmcell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.96.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The real wire type; path points at the repo's `crates/` layout (docs/51 wrote `../vmcell-protocol`,
# aligned here to the actual member path).
vmcell-protocol = { path = "../crates/vmcell-protocol" }
# The broker's cross-privilege frame types (`BrokerRequest`/`BrokerReply`) + its framed codec
# (`recv_msg`/`read_frame`) and `MAX_BROKER_FRAME_BYTES`, for the `broker_frame` / `broker_reply_frame`
# targets (rubric B10). Pulls `vmcell` transitively — fine here: the fuzz crate is workspace-excluded
# and only builds under `cargo fuzz` on nightly.
vmcell-broker = { path = "../crates/vmcell-broker" }
# postcard is the actual decode surface for the two broker/protocol payload targets
# (`vmcell-protocol`/`vmcell-broker` have no `decode_frame`; the doc's name was a placeholder — the
# honest entry points are the framed postcard `Message` / `BrokerRequest` / `BrokerReply`).
postcard = { version = "1", features = ["use-std"] }
# The host library, declared DIRECTLY rather than leaned on through `vmcell-broker`'s transitive
# edge: the tar/erofs packer (`artifact::tar2erofs`), the kernel-cmdline composer (`config`) and the
# egress deny-list predicate all need it, and a transitive edge's feature set is not ours to rely on.
# `fuzzing` is the non-default feature that opens the six otherwise-private predicates (see its
# stanza in crates/vmcell/Cargo.toml).
vmcell = { path = "../crates/vmcell", features = ["fuzzing"] }
# The control-plane daemon: the pre-authentication bearer parser, the artifact-name → path predicate
# (P3), the client DTO decode, and — behind the non-default `fuzzing` feature — the two bridge
# decode entry points that run inside the CAP-HOLDING broker child.
vmcell-daemon = { path = "../crates/vmcell-daemon", features = ["fuzzing"] }
# The downstream contract crate: the guest-console classifier and the `.config` sidecar parser. A
# panic in either is visible to an out-of-repo consumer, which is why they are fuzzed at all.
vmcell-artifact-validator = { path = "../crates/vmcell-artifact-validator" }
# The archive/decompressor front ends the OCI layer ingest composes, at the SAME pins the host lib
# uses (crates/vmcell/Cargo.toml), so cargo unifies rather than building a second copy.
tar = "0.4"
zstd = "0.13"
# The bridge/DTO codec. JSON is what those surfaces actually ship over (Appendix A reversal 10:
# postcard corrupts the DTOs' `skip_serializing_if`/`default` fields), so it is what gets fuzzed.
serde_json = "1"

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false

