[profile.default]
# Unit/codec/property tests are fast; flag anything that stalls.
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[profile.integration]
# VM boot + snapshot restore are slower; the builder-VM mmdebstrap run is the long outlier.
slow-timeout = { period = "120s", terminate-after = 5 }
# Retry the VM-booting integration tests. These boot real Cloud Hypervisor / Firecracker / QEMU
# guests and talk to them over vsock; under the full serialized suite (many back-to-back boots)
# the CH hybrid-vsock control connection *intermittently* resets mid-exchange — the guest logs
# `handle_connection error: failed to fill whole buffer`, the host sees `Agent … timed out`. It is
# environmental, NOT a code regression: it reproduces on the pre-optimization baseline too and every
# affected test passes 3/3 in isolation (bisected 2026-07-02; see docs/perf-experiments-log.md).
# A fresh-VM retry sidesteps the transient reset; a genuine break still fails all 3 attempts, so
# real coverage is preserved. The fixed 3s delay lets any transient host/vsock state settle first.
retries = { backoff = "exponential", count = 3, delay = "5s", max-delay = "20s" }
fail-fast = false

[test-groups]
# Mechanical equivalent of #[serial]: run host-state-mutating tests one at a time so parallel
# --ignored runs don't race on netns / cgroups / nft.
serial-host = { max-threads = 1 }

[[profile.integration.overrides]]
# List the suites that create a VM or touch netns/cgroups/nft.
filter = '''
    binary(boot) | binary(lifecycle) | binary(concurrency) | binary(snapshot_restore)
  | binary(egress_proxy) | binary(host_endpoint) | binary(metrics_limits)
  | binary(nested_virt) | binary(shares_ro_rw) | binary(pipeline) | binary(proptests) | binary(benchmark) | binary(exec_vsock)
'''
test-group = 'serial-host'
