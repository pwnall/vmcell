# L-TEST-3: pin the minimum nextest version so the "a filter that selects zero tests is a CI FAILURE,
# not a pass" contract (design §14) can't silently regress. nextest's default `--no-tests=fail` landed
# in 0.9.85; on an older pinned runner (or if a future default flips) a rename that zeroes the
# `unprivileged`/`smoltcp` selection would otherwise green-pass an empty suite. This key is top-level
# (before any [profile.*]) so TOML does not fold it into a profile table.
nextest-version = "0.9.85"

[profile.default]
# Unit/codec/property tests are fast; flag anything that stalls.
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[profile.integration]
# VM boot + snapshot restore are slower; the builder-VM mmdebstrap run is the long outlier.
slow-timeout = { period = "120s", terminate-after = 5 }
# Retry the VM-booting integration tests. These boot real Cloud Hypervisor / Firecracker / QEMU
# guests and talk to them over vsock; under the full serialized suite (many back-to-back boots)
# the CH hybrid-vsock control connection *intermittently* resets mid-exchange — the guest logs
# `handle_connection error: failed to fill whole buffer`, the host sees `Steward … timed out`. It is
# environmental, NOT a code regression: it reproduces on the pre-optimization baseline too and every
# affected test passes 3/3 in isolation (bisected 2026-07-02; see
# docs/historical/44-claude-perf-experiments.md, "Flake investigation").
# A fresh-VM retry sidesteps the transient reset; a genuine break still fails all 3 attempts, so
# real coverage is preserved. The fixed 3s delay lets any transient host/vsock state settle first.
retries = { backoff = "exponential", count = 3, delay = "5s", max-delay = "20s" }
fail-fast = false

[test-groups]
# Mechanical equivalent of #[serial]: run host-state-mutating tests one at a time so parallel
# --ignored runs don't race on netns / cgroups / nft.
serial-host = { max-threads = 1 }

[[profile.integration.overrides]]
# M-TEST-5 / v3 workspace-glob: POSITIVELY select EVERY vmcell-* member's integration-test binary
# (current AND future) so a newly added VM-booting test — in `vmcell`, `vmcelld`, `vmcell-daemon`, or
# any future member — auto-joins serial-host instead of silently running unserialized and racing on
# netns / cgroups / nft. `package(~vmcell)` (substring match) subsumes the old per-package names
# (`package(vmcell)` PLUS the separate `package(vmcelld)` override), each of which silently denied new
# members. The mild cost — serializing a few cheap KVM-free daemon integration tests — buys that
# auto-inclusion. N-TEST-2: `proptests` is pure in-memory property testing (no host state), so it is
# excluded to keep its parallelism; a new VM test still auto-joins because it will not be `proptests`.
filter = 'package(~vmcell) & kind(test) & !binary(proptests)'
test-group = 'serial-host'
